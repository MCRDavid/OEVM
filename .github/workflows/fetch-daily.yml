name: Fetch daily
run-name: ${{ github.event_name == 'schedule' && format('Fetch daily (GitHub schedule {0})', github.event.schedule) || inputs.started_by == 'timer' && 'Fetch daily (Cloudflare timer)' || 'Fetch daily (by hand)' }}

# Fetches every operator that is enabled in the registry, publishes the map files and
# the feed health page, then deploys the site. Blueprint task 10.
#
# Started once a day by the relay Worker's timer (relay/wrangler.toml, 04:17 UTC with a
# second try at 06:17 UTC), which asks GitHub to start this workflow with started_by set to
# timer. GitHub's own schedule below is a backup only: GitHub starts scheduled runs late or
# not at all when it is busy (ADR 0024). The first job lets only the first timer or
# schedule run each day (UTC) fetch; a run started by hand always fetches.

on:
  schedule:
    # Away from the busy top of the hour, and after the timer's two tries.
    - cron: "47 4 * * *"
    - cron: "47 10 * * *"
    - cron: "47 16 * * *"
  workflow_dispatch:
    inputs:
      started_by:
        description: How this run was started. Leave as hand; the Cloudflare timer sends timer.
        type: choice
        options: [hand, timer]
        default: hand

permissions:
  contents: read

# Never run two fetches at once: they would use the same operator hosts in parallel.
concurrency:
  group: fetch-daily
  cancel-in-progress: false

jobs:
  check:
    name: Check whether today's fetch has run
    # Only main publishes, so a run started on another branch cannot replace the site.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read # to list today's runs of this workflow
    outputs:
      fetch: ${{ steps.check.outputs.fetch }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: pipeline

      # Standard library only, so nothing needs installing.
      - name: Fetch only if no run has fetched today, unless started by hand
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          STARTED_BY: ${{ inputs.started_by }}
        run: python3 -m pipeline.daily_runs check --event "$EVENT" --started-by "$STARTED_BY"

  fetch:
    name: Fetch operator feeds
    needs: check
    if: github.ref == 'refs/heads/main' && needs.check.outputs.fetch == 'true'
    runs-on: ubuntu-latest
    # The slowest host sets the length (ADR 0014): the 22 networks on open-chargepoints.com
    # make 57 requests within each token's hourly allowance, at most 5 at once, about a
    # minute; Roam and char.gy then take about 12. Any trouble there puts each network back
    # to a 125 second gap (about 30 minutes), so the limit leaves room for that and retries.
    timeout-minutes: 150
    permissions:
      contents: read
      actions: read # to find the feed health history from the last run
    outputs:
      some-failed: ${{ steps.fetch.outputs.some-failed }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@v7

      - name: Install dependencies from the lock file
        run: uv sync --locked

      - name: Validate operator registry
        run: uv run python -m pipeline.registry --validate

      - name: Get the feed health history from the last run
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: .github/scripts/download-site-data.sh previous

      - name: Fetch every enabled operator, never two on one host at once
        id: fetch
        # Keys are passed to this step only, by secret name, as the registry lists them.
        # Operators with a relay decision (operators/<id>.yaml, relay) go through the
        # project's one relay Worker, which these two secrets address.
        env:
          ALDI_TOKEN: ${{ secrets.ALDI_TOKEN }}
          ALLEGO_TOKEN: ${{ secrets.ALLEGO_TOKEN }}
          BLINK_CHARGING_UK_TOKEN: ${{ secrets.BLINK_CHARGING_UK_TOKEN }}
          BP_PULSE_TOKEN: ${{ secrets.BP_PULSE_TOKEN }}
          CHARGEPOINT_TOKEN: ${{ secrets.CHARGEPOINT_TOKEN }}
          DRAX_GROUP_TOKEN: ${{ secrets.DRAX_GROUP_TOKEN }}
          DRAX_ISTA_TOKEN: ${{ secrets.DRAX_ISTA_TOKEN }}
          ESB_ECARS_TOKEN: ${{ secrets.ESB_ECARS_TOKEN }}
          ESB_ENERGY_TOKEN: ${{ secrets.ESB_ENERGY_TOKEN }}
          EVYVE_TOKEN: ${{ secrets.EVYVE_TOKEN }}
          EV_POINT_TOKEN: ${{ secrets.EV_POINT_TOKEN }}
          FASTNED_API_KEY: ${{ secrets.FASTNED_API_KEY }}
          GFX_GB_DRAX_TOKEN: ${{ secrets.GFX_GB_DRAX_TOKEN }}
          IONITY_TOKEN: ${{ secrets.IONITY_TOKEN }}
          JOLT_API_KEY: ${{ secrets.JOLT_API_KEY }}
          LIDL_TOKEN: ${{ secrets.LIDL_TOKEN }}
          MONTA_CLIENT_ID: ${{ secrets.MONTA_CLIENT_ID }}
          MONTA_CLIENT_SECRET: ${{ secrets.MONTA_CLIENT_SECRET }}
          PLUG_CHARGING_TOKEN: ${{ secrets.PLUG_CHARGING_TOKEN }}
          POD_TOKEN: ${{ secrets.POD_TOKEN }}
          RAW_CHARGING_TOKEN: ${{ secrets.RAW_CHARGING_TOKEN }}
          SHELL_RECHARGE_TOKEN: ${{ secrets.SHELL_RECHARGE_TOKEN }}
          SOURCE_EV_TOKEN: ${{ secrets.SOURCE_EV_TOKEN }}
          SOUTHAMPTON_APARTMENT_HOTELS_TOKEN: ${{ secrets.SOUTHAMPTON_APARTMENT_HOTELS_TOKEN }}
          TRAVIS_PERKINS_TOKEN: ${{ secrets.TRAVIS_PERKINS_TOKEN }}
          UBITRICITY_TOKEN: ${{ secrets.UBITRICITY_TOKEN }}
          VOLVO_TOKEN: ${{ secrets.VOLVO_TOKEN }}
          WCCC_EDGBASTON_TOKEN: ${{ secrets.WCCC_EDGBASTON_TOKEN }}
          OEVM_RELAY_URL: ${{ secrets.OEVM_RELAY_URL }}
          OEVM_RELAY_TOKEN: ${{ secrets.OEVM_RELAY_TOKEN }}
        run: |
          set +e
          uv run python -m pipeline.run --live all --log-dir logs --publish build \
            --previous previous
          code=$?
          set -e
          # 3: an operator failed, but the map still shows its last good copy (ADR 0018).
          # The run stays green; the feed health page and this warning say which.
          # 2: an operator failed and is not on the map at all, so the run ends red.
          if [ "$code" -eq 3 ]; then
            echo "::warning::At least one operator failed; the map shows its last good copy. See the log above and the feed health page."
          elif [ "$code" -eq 2 ]; then
            echo "::warning::At least one operator failed and was left off the map. See the log above."
            echo "some-failed=true" >> "$GITHUB_OUTPUT"
          elif [ "$code" -ne 0 ]; then
            exit "$code"
          fi

      - name: Read how the daily fetch started over the last 30 days
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run python -m pipeline.daily_runs record --out record/daily-runs.json

      - name: Build the feed health page
        run: |
          uv run python -m pipeline.status --runs logs --out build \
            --previous previous/data/status.json --map build/data/locations.geojson \
            --daily-runs record/daily-runs.json

      - name: Keep the map files and feed health page for the deploy
        uses: actions/upload-artifact@v7
        with:
          name: site-data
          path: build
          retention-days: 30
          if-no-files-found: error

  deploy:
    name: Deploy
    needs: fetch
    uses: ./.github/workflows/deploy.yml
    with:
      from-this-run: true
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write

  report:
    name: Report failed operators
    needs: [fetch, deploy]
    if: needs.fetch.outputs.some-failed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # The site was still deployed with the operators that worked. An operator is missing
      # from the map (it failed with no last good copy to show), so the run shows red to
      # be noticed; the feed health page says which.
      - run: |
          echo "::error::At least one operator failed today and is not on the map. The feed health page and the Fetch operator feeds log say which."
          exit 1
