# Temporary: a one-off check of PLUG Charging's feed from this branch, removed before the PR
# is ready. Reads the whole feed once, two seconds between requests, with the key from the
# PLUG_CHARGING_TOKEN secret, and prints the recorded responses for a trimmed test fixture.
name: PLUG Charging check (temporary)

on:
  push:
    branches: [claude/project-thread-6jh3s5]
    paths: [.github/workflows/plug-check.yml, .github/scripts/plug-check.py]

permissions:
  contents: read

concurrency:
  group: fetch-daily
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked
      - name: Fetch PLUG Charging's whole feed once with the pipeline
        env:
          PLUG_CHARGING_TOKEN: ${{ secrets.PLUG_CHARGING_TOKEN }}
        run: |
          sed -i 's/^enabled: false$/enabled: true/' operators/plug_charging.yaml
          uv run python -m pipeline.run --live plug_charging --save-raw raw --log-dir logs || echo "exit $?"
          for f in $(find raw logs -name '*.json' | sort); do
            echo "----- $f -----"
            python3 -c "import json, sys; print(json.dumps(json.load(open(sys.argv[1]))))" "$f"
          done
