# Temporary: a one-off check of PLUG Charging's feed from this branch, removed before the PR
# is ready. Four requests, two seconds apart, with the key from the PLUG_CHARGING_TOKEN secret.
name: PLUG Charging check (temporary)

on:
  push:
    branches: [claude/project-thread-6jh3s5]
    paths: [.github/workflows/plug-check.yml, .github/scripts/plug-check.py]

permissions:
  contents: read

concurrency:
  group: fetch-daily
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked
      - name: Read PLUG Charging's feed once
        env:
          PLUG_CHARGING_TOKEN: ${{ secrets.PLUG_CHARGING_TOKEN }}
        run: PYTHONPATH=. uv run python .github/scripts/plug-check.py
