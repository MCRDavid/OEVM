name: Monta price check (one-off)

# Temporary. Tries Monta's AFIR price endpoints on several UK EVSEs, printing status codes, field
# names and prices only, then is removed before the branch is merged.

on:
  push:
    branches: [claude/project-thread-yma71t]
    paths: [.github/workflows/monta-check.yml, .github/scripts/monta_afir_check.py]

permissions:
  contents: read

concurrency:
  group: monta-check
  cancel-in-progress: false

jobs:
  check:
    name: Try Monta's per-charger price endpoints on several EVSEs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@v7

      - name: Install dependencies from the lock file
        run: uv sync --locked

      - name: Ask for several EVSEs' status and price (field names and prices only)
        env:
          MONTA_CLIENT_ID: ${{ secrets.MONTA_CLIENT_ID }}
          MONTA_CLIENT_SECRET: ${{ secrets.MONTA_CLIENT_SECRET }}
          PYTHONPATH: ${{ github.workspace }}
        run: uv run python .github/scripts/monta_afir_check.py
