name: Monta token check (one-off)

# Temporary. Runs Monta's adapter once on this branch, printing the run report (counts and
# issue lines only, no records), then is removed before the branch is merged.

on:
  push:
    branches: [claude/project-thread-yma71t]
    paths: [.github/workflows/monta-check.yml]

permissions:
  contents: read

concurrency:
  group: monta-check
  cancel-in-progress: false

jobs:
  check:
    name: Run Monta's adapter once with the project's token
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@v7

      - name: Install dependencies from the lock file
        run: uv sync --locked

      - name: Run Monta's adapter and build map files (report only)
        env:
          MONTA_CLIENT_ID: ${{ secrets.MONTA_CLIENT_ID }}
          MONTA_CLIENT_SECRET: ${{ secrets.MONTA_CLIENT_SECRET }}
        run: uv run python -m pipeline.run --live monta --publish build
