# Temporary: one run of Believ's documented token request and charger lookup from this branch,
# removed again straight away. Two requests, 865 s apart, with the BELIEV_CLIENT_* secrets.
name: Believ API check (temporary)

on:
  push:
    branches: [claude/project-thread-6jh3s5]
    paths: [.github/workflows/believ-check.yml, .github/scripts/believ-check.py]

permissions:
  contents: read

concurrency:
  group: believ-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked
      - name: Run Believ's documented calls once
        env:
          BELIEV_CLIENT_ID: ${{ secrets.BELIEV_CLIENT_ID }}
          BELIEV_CLIENT_SECRET: ${{ secrets.BELIEV_CLIENT_SECRET }}
        run: PYTHONPATH=. uv run python -u .github/scripts/believ-check.py
