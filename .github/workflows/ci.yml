name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, test and scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7

      - name: Install dependencies from the lock file
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Run tests (offline, fixtures only) with a coverage floor
        run: uv run pytest -q --cov --cov-report=term-missing:skip-covered

      - name: Check exported JSON Schema is up to date
        run: uv run python -m schema.export --check

      - name: Validate operator registry
        run: uv run python -m pipeline.registry --validate

      - name: Run adapters on recorded fixtures (no network)
        run: uv run python -m pipeline.run --fixtures

      - name: Check the transparency page is up to date
        run: uv run python -m pipeline.transparency --check

      - name: Check locked packages for known vulnerabilities
        # Dependabot alerts may not read uv.lock, so audit an export of it with pip-audit.
        run: |
          uv export --format requirements-txt --frozen --all-groups --no-emit-project \
            -o "$RUNNER_TEMP/requirements.txt"
          uvx pip-audit==2.10.1 --disable-pip --require-hashes --progress-spinner off \
            -r "$RUNNER_TEMP/requirements.txt"

      - name: Secret scan and file checks (pre-commit, every file)
        run: uv run pre-commit run --all-files --show-diff-on-failure

      - name: Prove the secret scanner blocks a fake key
        # The fake key is split in two so this workflow file does not contain it.
        run: |
          printf 'aws_access_key_id = "AKIA%s"\n' "IOSFODNN7EXAMPLE" > canary_fake_key.txt
          if uv run pre-commit run detect-secrets --files canary_fake_key.txt; then
            echo "::error::The secret scanner did not block a fake AWS key."
            exit 1
          fi
          echo "The secret scanner blocked the fake key, as expected."
          rm canary_fake_key.txt

  site:
    name: Map page (build, browser tests, accessibility)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - uses: astral-sh/setup-uv@v7

      - name: Install dependencies from the lock files
        run: |
          npm ci
          uv sync --locked

      - name: Check locked front-end packages for known vulnerabilities
        run: npm audit

      - name: JavaScript unit tests
        run: npm test

      - name: Browser tests and Lighthouse accessibility score (offline map style, no outside hosts)
        # Builds the site from the recorded fixtures and drives the Chrome that GitHub's
        # Ubuntu runners include. OEVM_REQUIRE_E2E makes a missing browser fail, not skip.
        env:
          CHROME_PATH: /usr/bin/google-chrome
          OEVM_REQUIRE_E2E: "1"
        run: uv run pytest -q -m e2e
