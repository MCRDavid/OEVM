# Temporary: a one-off recording of Eco-Movement's PCPR API from this branch, removed
# before the PR is ready. At most 18 requests (one page of locations and tariffs for each
# of nine networks), each token's requests 125 seconds apart, with the tokens from their
# secrets. Shares the daily fetch's concurrency group, so the two never
# run at once.
name: Eco-Movement check (temporary)

on:
  push:
    branches: [claude/project-thread-4ki23c]
    paths: [.github/workflows/eco-movement-check.yml, .github/scripts/eco-movement-check.py]

permissions:
  contents: read

concurrency:
  group: fetch-daily
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked
      - name: Read one page of each network's locations and tariffs
        env:
          DRAX_GROUP_TOKEN: ${{ secrets.DRAX_GROUP_TOKEN }}
          GFX_GB_DRAX_TOKEN: ${{ secrets.GFX_GB_DRAX_TOKEN }}
          DRAX_ISTA_TOKEN: ${{ secrets.DRAX_ISTA_TOKEN }}
          ALDI_TOKEN: ${{ secrets.ALDI_TOKEN }}
          TRAVIS_PERKINS_TOKEN: ${{ secrets.TRAVIS_PERKINS_TOKEN }}
          VOLVO_TOKEN: ${{ secrets.VOLVO_TOKEN }}
          WCCC_EDGBASTON_TOKEN: ${{ secrets.WCCC_EDGBASTON_TOKEN }}
          SOUTHAMPTON_APARTMENT_HOTELS_TOKEN: ${{ secrets.SOUTHAMPTON_APARTMENT_HOTELS_TOKEN }}
          SHELL_RECHARGE_TOKEN: ${{ secrets.SHELL_RECHARGE_TOKEN }}
        run: PYTHONPATH=. uv run python .github/scripts/eco-movement-check.py
      - name: Keep the responses for the fixtures
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: eco-movement-raw
          path: raw
          retention-days: 3
          if-no-files-found: warn
