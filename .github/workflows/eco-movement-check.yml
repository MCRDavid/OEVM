# Temporary: a one-off recording of Eco-Movement's PCPR API from this branch, removed
# before the PR is ready. At most 26 requests, 125 seconds apart, with the 13 networks'
# tokens from their secrets. Shares the daily fetch's concurrency group, so the two never
# run at once.
name: Eco-Movement check (temporary)

on:
  push:
    branches: [claude/project-thread-4ki23c]
    paths: [.github/workflows/eco-movement-check.yml, .github/scripts/eco-movement-check.py]

permissions:
  contents: read

concurrency:
  group: fetch-daily
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked
      - name: Read one page of each network's locations and tariffs
        env:
          ALLEGO_TOKEN: ${{ secrets.ALLEGO_TOKEN }}
          BLINK_CHARGING_UK_TOKEN: ${{ secrets.BLINK_CHARGING_UK_TOKEN }}
          CHARGEPOINT_TOKEN: ${{ secrets.CHARGEPOINT_TOKEN }}
          EV_POINT_TOKEN: ${{ secrets.EV_POINT_TOKEN }}
          LIDL_TOKEN: ${{ secrets.LIDL_TOKEN }}
          RAW_CHARGING_TOKEN: ${{ secrets.RAW_CHARGING_TOKEN }}
          ESB_ECARS_TOKEN: ${{ secrets.ESB_ECARS_TOKEN }}
          ESB_ENERGY_TOKEN: ${{ secrets.ESB_ENERGY_TOKEN }}
          EVYVE_TOKEN: ${{ secrets.EVYVE_TOKEN }}
          IONITY_TOKEN: ${{ secrets.IONITY_TOKEN }}
          POD_TOKEN: ${{ secrets.POD_TOKEN }}
          SOURCE_EV_TOKEN: ${{ secrets.SOURCE_EV_TOKEN }}
          UBITRICITY_TOKEN: ${{ secrets.UBITRICITY_TOKEN }}
        run: PYTHONPATH=. uv run python .github/scripts/eco-movement-check.py
      - name: Keep the responses for the fixtures
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: eco-movement-raw
          path: raw
          retention-days: 3
          if-no-files-found: warn
