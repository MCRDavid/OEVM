# Weekly dependency update pull requests. See docs/GITHUB_SETTINGS.md for the alerts and
# security updates that are switched on in the repository settings, not here.
version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      python-minor-and-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        applies-to: version-updates
        patterns:
          - "*"

  # MapLibre GL JS (served with the site) and Lighthouse (tests only). After a MapLibre
  # update, check its licence and the notices of what it bundles (THIRD_PARTY_NOTICES.txt).
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      npm-minor-and-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"

  # Hook versions in .pre-commit-config.yaml. Local hooks have no version and are skipped.
  - package-ecosystem: "pre-commit"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      pre-commit-hooks:
        applies-to: version-updates
        patterns:
          - "*"
