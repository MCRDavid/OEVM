name: Data correction
description: Tell us about a charger, price or status that looks wrong. Issues are public.
title: "Correction: "
labels: ["correction"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you. This project shows what operators publish, so if the operator's own data
        is wrong, please tell the operator too.

        **Issues are public.** Please do not include personal information, such as your
        name, registration number or where you live.
  - type: input
    id: where
    attributes:
      label: Which charger or page?
      description: A link, the operator and location name, or the location id.
    validations:
      required: true
  - type: textarea
    id: wrong
    attributes:
      label: What looks wrong?
    validations:
      required: true
  - type: textarea
    id: right
    attributes:
      label: What did you see, and when?
      description: For example, the price shown on the charger and the date you saw it.
    validations:
      required: true
  - type: checkboxes
    id: public
    attributes:
      label: Before you post
      options:
        - label: I understand this issue is public and I have not included personal information.
          required: true
