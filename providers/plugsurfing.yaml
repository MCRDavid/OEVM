name: Plugsurfing
kind: roaming
website: https://plugsurfing.com
terms:
  url: https://plugsurfing.com/legal/terms-of-use/
  reuse: no_restriction_found
  quote: null
  attribution: null
  checked: 2026-10-09
plans:
- id: plugsurfing_plus
  name: Plugsurfing+
  pay_by: Plugsurfing app
  monthly_fee: 6.9
