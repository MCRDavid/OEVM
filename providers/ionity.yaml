# yaml-language-server: $schema=schema.json
# IONITY: operator network with its own app and subscriptions. Rules are in schema/provider.py.
id: ionity
name: IONITY
kind: operator
website: https://www.ionity.eu/
terms:
  url: https://www.ionity.eu/policies/imprint
  reuse: forbidden
  quote: "The copyrights or rights of use under copyrights respectively are exclusively owned by us and the use and exploitation of copyright protected content is prohibited without our explicit written consent, unless provided for by statutory law."
  attribution: null
  checked: 2026-10-09
own_networks: [ionity]
plans: []
# Said in this project's words, without the price, at its locations (ADR 0034).
cheaper_direct:
  - pay_by: when signed up in the IONITY app
    cheaper_than: paying at the charger without signing up
    needs_subscription: false
    feed_check: >-
      On 2026-11-15 every IONITY tariff in the feed had an id marked ADHOC, and at most
      sites its price was the page's price for paying at the charger without signing up,
      so the map shows that price.
    source:
      url: https://www.ionity.eu/subscriptions
      said: >-
        Paying through the free IONITY app costs a little less per kWh than paying at the
        charger without signing up, with no subscription or monthly fee.
      checked: 2026-11-15
  - pay_by: with an IONITY subscription
    cheaper_than: the IONITY app without one
    needs_subscription: true
    feed_check: >-
      On 2026-11-15 every IONITY tariff in the feed had an id marked ADHOC, the price for
      paying at the charger without signing up.
    source:
      url: https://www.ionity.eu/subscriptions
      said: >-
        IONITY's monthly and yearly subscriptions, taken out in its app, cost less per kWh
        than paying in the app without one.
      checked: 2026-11-15
notes: "Plans are not listed because the provider's imprint does not allow use of its copyright protected content without explicit written consent; the site links only an imprint and a privacy policy, and no separate website terms of use were found (checked 2026-10-09)."
