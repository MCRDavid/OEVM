# yaml-language-server: $schema=schema.json
# bp pulse: operator network with its own app, contactless payment and a subscription.
# Rules are in schema/provider.py.
id: bp_pulse
name: bp pulse
kind: operator
website: https://www.bppulse.com/en-gb
terms:
  url: https://www.bppulse.com/en-gb/legal-notice
  reuse: forbidden
  quote: "We permit you to make copies of this website as necessary incidental acts during your viewing of it; and you may take a print for your personal use of so much of the site as is reasonable for private purposes. All other use is strictly prohibited."
  attribution: null
  checked: 2026-10-09
own_networks: [bp_pulse]
plans: []
# Said in this project's words, without the price, at its locations (ADR 0034).
cheaper_direct:
  - pay_by: with a bp pulse subscription
    cheaper_than: paying by contactless or as you go in the app
    needs_subscription: true
    feed_check: >-
      On 2026-11-15 the feed's prices were the page's contactless and pay as you go
      prices, which are the same, for fast chargers and for the most common rapid price.
      Many rapid connectors have no price in the feed.
    source:
      url: https://www.bppulse.com/en-gb/public-ev-charging/pricing
      said: >-
        Subscribers, who pay a monthly fee, pay less per kWh than contactless and pay as you
        go customers, who pay the same as each other.
      checked: 2026-11-15
notes: "Plans are not listed because the provider's legal notice allows copies only for viewing and personal use, and does not allow its content to be republished, compiled or used in a database (checked 2026-10-09)."
