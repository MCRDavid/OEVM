rate_limit:
  min_seconds_between_requests: 2
  limits: []
  limits_checked: 2026-10-10
  notes: >-
    The Wenea Open Data Policy, read 2026-10-10, states no numeric limit. It says "We may
    impose rate limits or other technical controls on your use of the API at our discretion
    to maintain system integrity and performance." The API's technical documentation has
    not been seen.
supports_single_location: unknown
