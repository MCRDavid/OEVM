# yaml-language-server: $schema=schema.json
id: believ
display_name: Believ
ocpi_country_code: unknown
ocpi_party_id: unknown
adapter: unknown
base_url: unknown
endpoints: {}
auth:
  method: client_credentials
  name: Authorization
  scheme: Bearer
  secret_name: BELIEV_CLIENT_SECRET
  client_id_secret_name: BELIEV_CLIENT_ID
  token_url: https://api.believ.com/oauth/token
rate_limit:
  min_seconds_between_requests: 865
  limits:
    - publisher: Believ
      requests: 100
      per_seconds: 86400
      endpoint: all
      quote: >-
        Requests are limited to 100 calls per 24hrs, with a maximum of one request per
        second.
      source_url: https://api.believ.com/
      checked: 2026-10-23
    - publisher: Believ
      requests: 1
      per_seconds: 1
      endpoint: all
      quote: >-
        Requests are limited to 100 calls per 24hrs, with a maximum of one request per
        second.
      source_url: https://api.believ.com/
      checked: 2026-10-23
  limits_checked: 2026-10-23
  notes: >-
    The limits are in the API documentation, shown only after signing in (copy in
    evidence/believ/2026-10-23-api-documentation.md). 100 calls a day, with this project's
    1 second margin, means one request every 865 seconds.
supports_single_location: unknown
cors: unknown
attribution: null
licence: null
engagement:
  status: key_on_request
  evidence:
    - date: 2026-10-10
      url: https://api.believ.com/
      note: >-
        Believ's API portal says credentials are generated after creating a free account.
        Its registration page asks for a name, email address and password. No account was
        created.
  log:
    - date: 2026-10-10
      action: page_checked
      summary: >-
        Believ's open data page was read; it sends API users to Believ's API portal, which
        says documentation and credentials are available after creating a free account.
      quote: >-
        This API provides machine readable access to EVSE data for the Believ network.
        After creating your FREE account you'll be able to view the documentation and
        generate credentials to call our service.
      evidence_url: https://api.believ.com/
    - date: 2026-10-23
      action: request_sent
      channel: web_form
      summary: >-
        Registered for a free account on Believ's API portal and generated API credentials
        in its dashboard.
      evidence_url: https://api.believ.com/register
    - date: 2026-10-23
      action: key_granted
      summary: >-
        Believ's portal showed a client id and secret at once, with the API documentation.
        The credentials are kept outside the repository.
      quote: >-
        Store your client secret securely. It cannot be retrieved after generation and will
        need to be regenerated if lost.
      evidence_file: evidence/believ/2026-10-23-api-documentation.md
    - date: 2026-10-23
      action: page_checked
      summary: >-
        The API documentation was read. It describes one endpoint, which returns a single
        EVSE by the label printed on the charger, and a limit of 100 calls per 24 hours.
        Believ's open data page was read again; it offers a separate form for a larger data
        set.
      quote: If you would like access to a larger data set please fill in the form linked below
      evidence_url: https://www.believ.com/open-data/
access_requested: 2026-10-23
access_granted: 2026-10-23
sources:
  - url: https://www.believ.com/open-data/
    note: >-
      Believ's open data page, read 2026-10-10. Says "For API access, please visit
      https://api.believ.com/." and links a separate "Request Data" form for "a larger data
      set". States no licence, terms or rate limit for the data.
  - url: https://www.believ.com/believ-charge-point-live-data/
    note: >-
      Believ Charge Point Live Data page, linked from the site footer, read 2026-10-10.
      Gives the same API portal link as the open data page.
  - url: https://api.believ.com/
    note: >-
      Believ EVSE API portal home page, read 2026-10-10. Offers registration for a free
      account and a sign-in link.
  - url: https://api.believ.com/register
    note: >-
      Registration page, read 2026-10-10 without submitting it. Asks for a name, email
      address and password; shows no terms to agree to.
  - url: https://forms.monday.com/forms/e5d445c2e96e6b7f2d53291bb0d7711d?r=euc1
    note: >-
      Believ's "Request Data" form, linked from its open data page, read 2026-10-23 without
      submitting it. Asks for an organisation name, company registration number, registered
      address, phone number, the purpose and use of the data, how it will be stored and
      secured, whether it will be shared or sent outside the UK or EEA, ISO 27001 or 27701
      certification and a data protection officer.
findings:
  - date: 2026-10-23
    kind: access
    summary: >-
      Believ's API documentation describes one endpoint, which returns a single EVSE by the
      label printed on the charger, limited to 100 calls per 24 hours. It documents no way
      to list locations or chargers.
    handling: >-
      Believ stays off the map, because its chargers cannot be found without their labels.
      Its open data page offers a form for a larger data set; no request has been sent.
    evidence_url: https://api.believ.com/
notes: >-
  Access to Believ's API is through a free self-serve account on its API portal, which gives
  a client id and secret and the documentation after registering (done 2026-10-23). The API
  answers one charger at a time by its label, with location, live status, connectors and
  tariffs, so it suits checking a known charger rather than mapping the network. The
  credentials are to be kept as the GitHub Actions secrets BELIEV_CLIENT_ID and
  BELIEV_CLIENT_SECRET. The documentation states no licence for the data.
enabled: false
