  - url: https://developer.tesla.com/en_GB/docs/charging/roaming
    note: >-
      Tesla's developer page "Getting Started" for charging roaming, read 2026-10-13. It is
      on a different host from www.tesla.com, so the 2026-10-11 site map check did not
      cover it. Steps: sign in with a Tesla Account (verified email and multi-factor
      authentication), make a connection by giving a connection scope, authentication token,
      role, URL and party ID, then "Tesla will validate the inputted information and pass
      relevant data upon successful connection". States no licence, terms or rate limit.
  - url: https://developer.tesla.com/en_GB/dashboard/charging/roaming
    note: >-
      Tesla's Charging API documentation, shown only after signing in; read by the
      repository owner on 2026-10-13. Sections: Credentials ("Credentials module as defined
      in OCPI 2.2.1 is used to perform handshake between Tesla systems and 3rd party
      platform requesting tesla location data"), Locations ("Tesla is following OCPI 2.2.1
      specs for location data, and has also extended the specs with additional fields") and
      Tariffs. States no licence, terms or rate limit.
  - url: https://developer.tesla.com/en_GB/dashboard/charging/roaming/connection
    note: >-
      Tesla's "Charging OCPI Connection" form, shown only after signing in; read by the
      repository owner on 2026-10-13 and not submitted. Fields: connection scope (US or UK),
      an authentication token that identifies the requester, role (EMSP, HUB, NAP, NSP or
      OTHER), URL ("URL to OCPI Versions endpoint") and party ID, for which the form says a
      requester with no ID may use a three-letter abbreviation of its name.
findings:
  - date: 2026-10-13
    kind: access
    summary: >-
      Tesla's developer page says the Tesla Roaming Portal, through which it offers an OCPI
      connection, is currently available on a pilot and invitation basis only. A connection
      needs a Tesla Account and a request that Tesla reviews. Neither the public page nor
      the signed-in documentation states terms, a licence or a rate limit for the data.
    handling: >-
      Recorded as a possible source of Tesla's data. Nothing has been requested. Under the
      OCPI 2.2.1 credentials handshake that the form starts, the requester supplies its own
      token and the address of its own OCPI versions endpoint, and must host versions and
      credentials endpoints that Tesla calls. The map is a static site, so on 2026-10-16 the
      repository owner decided to answer those calls from a separate Cloudflare Worker that
      only does the handshake (ADR 0025). The operator stays switched off until Tesla's terms
      are read.
    evidence_url: https://developer.tesla.com/en_GB/docs/charging/roaming
  - date: 2026-10-13
    kind: spec_conformance
    summary: >-
      Tesla's signed-in documentation says it extends OCPI 2.2.1. Locations gain
      access_type and evse_count fields. Tariffs gain a CONGESTION_TIME price component and
      min_vehicle_soc and min_congestion_threshold restrictions, none of which are in OCPI
      2.2.1. The documentation also spells the connector field "tarrif_ids" (OCPI 2.2.1:
      tariff_ids) and describes power_type and one status field in US terms ("DCFC, AC
      Level 2"; "operational, under construction, planned, or decommissioned") rather than
      OCPI 2.2.1 values.
    handling: >-
      Not fetched yet, so how the data really looks needs testing. Before Tesla prices are
      shown, the adapter work must make sure a price that depends on these extensions is
      never shown as if it had no condition; how such tariffs are shown is for the
      repository owner to decide. Values that are not OCPI 2.2.1 values are recorded as
      unknown, as for every operator.
    evidence_url: https://developer.tesla.com/en_GB/dashboard/charging/roaming
notes: >-
  Tesla offers its data through an OCPI 2.2.1 connection on its developer portal, open by
  invitation during a pilot, with a UK scope ("Charging Location Data will be shared based on
  selected scope (i.e. UK sites)"). On 2026-10-16 the repository owner decided to answer the
  handshake from a separate Cloudflare Worker, oevm-ocpi in ocpi/ (ADR 0025, proposed until
  the owner confirms its defaults D2 to D8), which gives role NSP (navigation service
  provider) and a three-letter party ID; the daily run will fetch locations and tariffs
  itself with the token Tesla sends in its credentials POST. OCPI 2.2.1 also asks for the
  token to be Base64 encoded and for request ID headers, which the ocpi_221 adapter does not
  do yet. Next steps: the owner sets up the Worker (docs/GITHUB_SETTINGS.md, section 11) and
  only then submits Tesla's form, recording a request_sent step the same day; after the first
  registration the owner records Tesla's host here, never a full address or a token (D8); ask
  Tesla, at the address on its developer page, about an invitation, terms and rate limits;
  the pipeline side and the adapter follow in later pull requests. The operator stays
  switched off until Tesla's terms are read.
enabled: false
