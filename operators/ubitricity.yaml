# yaml-language-server: $schema=schema.json
id: ubitricity
display_name: ubitricity
ocpi_country_code: GB
ocpi_party_id: UBI # Confirmed from the feed's own country_code and party_id on 2026-10-29.
adapter: eco_movement_pcpr
base_url: unknown
endpoints:
  locations:
    url: https://open-chargepoints.com/api/ocpi/cpo/2.2.1/locations/
    status: documented
    note: >-
      Confirmed in Eco-Movement's PCPR API reference on 2026-10-07. Written with the trailing
      slash, as in the user guide's example request and the getting started page's paging
      link (read 2026-10-26); without it the server answered HTTP 307 on 2026-10-29.
  tariffs:
    url: https://open-chargepoints.com/api/ocpi/cpo/2.2.1/tariffs/
    status: documented
  statuses:
    url: https://open-chargepoints.com/api/statuses
    status: documented
auth:
  method: header
  name: Authorization
  scheme: Token
  secret_name: UBITRICITY_TOKEN
rate_limit:
  min_seconds_between_requests: 125
  limits:
    - publisher: Eco-Movement
      requests: 30
      per_seconds: 3600
      endpoint: locations
      quote: The `locations` endpoint has a rate limit of 30 requests per 1 hour.
      source_url: https://developers.eco-movement.com/v2.2.1/reference/get-all-locations-pcpr-api
      checked: 2026-10-26
    - publisher: Eco-Movement
      requests: 30
      per_seconds: 3600
      endpoint: locations
      scope: single location
      quote: The `locations/{id}` endpoint has a rate limit of 30 requests per 1 hour.
      source_url: https://developers.eco-movement.com/v2.2.1/reference/get-specific-location-pcpr-api
      checked: 2026-10-26
    - publisher: Eco-Movement
      requests: 30
      per_seconds: 3600
      endpoint: tariffs
      quote: The `tariffs` endpoint has a rate limit of 30 requests per 1 hour.
      source_url: https://developers.eco-movement.com/reference/get-tariffs-pcpr-api
      checked: 2026-10-26
    - publisher: Eco-Movement
      requests: 1
      per_seconds: 30
      endpoint: statuses
      quote: The `statuses` endpoint has a rate limit of 1 request per 30 seconds.
      source_url: https://developers.eco-movement.com/reference/get-statuses-pcpr-api
      checked: 2026-10-26
  limits_checked: 2026-10-26
  notes: >-
    One gap of 125 seconds (the 120 seconds the strictest limit needs, plus a safety
    margin) is kept between any two requests to open-chargepoints.com, shared by every
    operator served from it, so this project sends it at most 29 requests in any hour.
    Requests are sent one at a time; Eco-Movement "strongly recommends limiting
    simultaneous GET requests to a maximum of 5". It recommends retrieving the entire
    dataset once a day.
supports_single_location: supported
cors: needs_testing
attribution: >-
  Contains data from ubitricity published under the Public Charge Point Regulations 2023,
  used in line with the Open Government Licence v3.0.
licence:
  name: OGL-3.0
  url: https://www.nationalarchives.gov.uk/doc/open-government-licence/version/3/
  basis: >-
    ubitricity's PCPR data request page (read 2026-10-09) names no licence, terms, key or
    agreement. Eco-Movement's email of 2026-10-26 with the token, and its PCPR API user
    guide and reference (read 2026-10-26), state no licence or terms either. Regulation
    10(5) of the Public Charge Point Regulations 2023 requires the data to be available
    "without any requirement to agree to terms and conditions regarding the use of that
    data", and the DfT guidance says "Data must be open in line with the Open Government
    Licence". On 2026-10-10 the repository owner decided, as a standing rule for operators
    whose data has no terms of its own, that such operators can be switched on without
    asking again.
  checked: 2026-10-29
engagement:
  status: key_on_request
  evidence:
    - date: 2026-10-09
      url: https://ubitricity.com/en/pcpr-data-request/
      note: >-
        ubitricity's PCPR data request page asks for contact details and the data needed
        through a request form. It names no licence, terms, key or agreement.
    - date: 2026-10-26
      file: evidence/ubitricity/2026-10-26-token-email.md
      note: >-
        Eco-Movement's email with an expiring link to this network's token for its PCPR
        API, sent as an "Authorization: Token" header to its OCPI 2.2.1 endpoints. The
        token itself is not kept here.
  log:
    - date: 2026-10-09
      action: page_checked
      summary: >-
        ubitricity's PCPR data request page was read. It offers a request form and says
        the data will be provided in a suitable format, with questions going to an
        Eco-Movement address.
      evidence_url: https://ubitricity.com/en/pcpr-data-request/
    - date: 2026-10-23
      action: request_sent
      channel: web_form
      summary: >-
        Requested access to ubitricity's PCPR data through its Google form, which is shared with Eco-Movement.
    - date: 2026-10-26
      action: key_granted
      channel: email
      summary: >-
        Eco-Movement sent a token for this network's PCPR data by email, through an
        expiring link, to be sent as an "Authorization: Token" header to its OCPI
        2.2.1 endpoints. The token is kept as a GitHub Actions secret.
      evidence_file: evidence/ubitricity/2026-10-26-token-email.md
access_requested: 2026-10-23
access_granted: 2026-10-26
sources:
  - url: https://wiki.openstreetmap.org/wiki/EV_charge_points_in_the_United_Kingdom
    note: The blueprint cites this page for this operator using Eco-Movement's PCPR API.
  - url: https://developers.eco-movement.com/reference/get-tariffs-pcpr-api
    note: Tariffs endpoint and its rate limit.
  - url: https://developers.eco-movement.com/reference/get-statuses-pcpr-api
    note: Statuses endpoint and its rate limit.
  - url: https://developers.eco-movement.com/reference/locations-pcpr-api
    note: Locations overview; recommends retrieving the entire dataset once a day.
  - url: https://developers.eco-movement.com/v2.2.1/reference/get-all-locations-pcpr-api
    note: Locations endpoint URL and its rate limit (read 2026-10-07).
  - url: https://developers.eco-movement.com/v2.2.1/reference/get-specific-location-pcpr-api
    note: >-
      Fetching a single location by id, and its rate limit. The blueprint linked
      /reference/get-specific-location, which is Eco-Movement's separate paid Data API.
  - url: https://developers.eco-movement.com/v2.2.1/reference/getting-started-pcpr-api
    note: 'Authentication: each request adds an "Authorization: Token <token>" header.'
  - url: https://developers.eco-movement.com/v2.2.1/docs/eco-movement-pcpr-api-user-guide
    note: At most 5 simultaneous requests; date_from and date_to described for locations only.
  - url: https://www.shell.co.uk/electric-vehicle-charging/shell-recharge-open-data-request.html
    note: >-
      Shell UK page titled "Public Charge Point Regulations", described as "Request data on
      Shell Recharge including location and usage of our charge points". Its main content
      loads with a script and has not been read yet (checked 2026-10-08). Whether it covers
      this operator needs testing.
findings:
  - date: 2026-10-29
    kind: spec_conformance
    summary: >-
      75 EVSEs give parking_restrictions as a single string, such as "ev_only", where
      OCPI 2.2.1 has a list of values.
    handling: >-
      The value is not read and the EVSE's parking restrictions are shown as unknown.
      Nothing else in the record changes.
    evidence_url: https://open-chargepoints.com/api/ocpi/cpo/2.2.1/locations/
  - date: 2026-10-07
    kind: documentation
    summary: >-
      Eco-Movement's PCPR API documentation gives two different defaults for the page size
      (1000 on the getting started page, 1 in the endpoint reference), and its user guide
      says date_from works for locations only while the tariffs reference lists it.
    handling: This project will always send an explicit page size and test date_from before relying on it.
    evidence_url: https://developers.eco-movement.com/v2.2.1/reference/getting-started-pcpr-api
  - date: 2026-10-07
    kind: documentation
    summary: >-
      The rate limits are published, but the documentation does not say whether they
      apply per key or per address, what kind of time window is used, or what response
      is sent when a limit is reached.
    handling: >-
      This project assumes the strictest reading: one allowance shared by every endpoint
      and every operator on this host, so it waits 125 seconds between any two requests to
      it.
    evidence_url: https://developers.eco-movement.com/v2.2.1/docs/eco-movement-pcpr-api-user-guide
notes: >-
  Its regulation 10 data is served by Eco-Movement's PCPR API (eco_movement_pcpr adapter),
  with a token Eco-Movement sent on 2026-10-26, kept as the GitHub Actions secret
  UBITRICITY_TOKEN. Every response on 2026-10-29 linked to a next page past the last
  record, which the adapter does not follow. Eco-Movement's user guide says it creates the
  location ids and may change them when it merges locations. On 2026-10-29 the feed
  reported 12,531 locations, in 13 pages of 1000, and 7 tariffs, each price with VAT 20.
  Most are on-street chargers in lamp posts.
enabled: true
