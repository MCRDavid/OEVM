# yaml-language-server: $schema=schema.json
id: parkrecharge
display_name: ParkRecharge
ocpi_country_code: unknown
ocpi_party_id: unknown
adapter: ocpi_221
base_url: unknown
endpoints:
  locations:
    url: https://ocpi-pcpr.hubeleon.net/2.2.1/reference
    status: documented
    note: >-
      Linked as "Access Reference Data" under "Reference Data: Locations & Connectors" on
      ParkRecharge's "Public Charging and Open Data" page (read 2026-10-11). Hosted by
      Hubeleon, whose e-mobility portal ParkRecharge links as its customer portal.
  tariffs:
    url: https://ocpi-pcpr.hubeleon.net/2.2.1/referencetariffs
    status: documented
    note: >-
      Linked as "Access Reference Data" under "Reference Data: Tariffs & Pricing" on the
      same page (read 2026-10-11).
auth:
  method: none
  name: null
  secret_name: null
rate_limit:
  min_seconds_between_requests: 2
  limits: []
  limits_checked: 2026-10-11
  notes: >-
    Neither ParkRecharge's page nor the responses state a rate limit. The 2 second gap is
    this project's own choice. Each response holds every record, so a full run makes two
    requests (about 0.8 MB on 2026-10-11).
supports_single_location: unknown
cors: needs_testing
attribution: >-
  Contains data from ParkRecharge published under the Public Charge Point Regulations
  2023, used in line with the Open Government Licence v3.0.
licence:
  name: OGL-3.0
  url: https://www.nationalarchives.gov.uk/doc/open-government-licence/version/3/
  basis: >-
    ParkRecharge's "Public Charging and Open Data" page says the reference data is
    "Published as a JSON file following the OCPI 2.2.1 standard" and that the location data
    "can be consumed by roaming platforms, mapping services, and fleet management tools".
    It states no licence, terms or rate limit for the files, and links the government's
    Public Charge Point Regulations 2023 guidance. DfT's guidance (updated 21 October 2024)
    says "Data must be open in line with the Open Government Licence". ParkRecharge's terms
    and conditions (read 2026-10-11) "apply to all Pay-As-You-Go and Top-Up charging
    carried out through the ParkRecharge app" and say nothing about the data. On 2026-10-10
    the repository owner decided, as a standing rule for operators whose data has no terms
    of its own, to read general website or charging terms as not covering the open data,
    which regulation 10(5) requires to be available without terms on its use.
  checked: 2026-10-11
expired_certificate:
  decided: 2026-10-11
  basis: >-
    The certificate of the host ParkRecharge links for its open data expired on 7 October
    2026, and its date is the only problem OpenSSL reports with it. The repository owner
    decided on 2026-10-11 to read the two files past it, with a note on the transparency
    page. The feed needs no key, so nothing secret is sent.
  evidence_url: https://parkrecharge.com/public-charging
  host: ocpi-pcpr.hubeleon.net
  sha256: 49:82:A7:AD:8B:2B:D2:E6:A5:7A:A5:83:46:E1:F1:E6:6F:CB:55:00:9C:E5:81:AE:6D:9F:1F:64:A9:4B:6C:6D
  expired: 2026-10-07
engagement:
  status: open_anonymous
  evidence:
    - date: 2026-10-10
      url: https://parkrecharge.com/public-charging
      note: >-
        ParkRecharge's "Public Charging and Open Data" page links its OCPI 2.2.1 reference
        data for locations and for tariffs directly, and says authentication is required for
        live availability data. This project has not fetched the reference data, so whether
        it needs a key still needs testing.
  log:
    - date: 2026-10-10
      action: page_checked
      summary: >-
        Read ParkRecharge's "Public Charging and Open Data" page, which links reference data
        for locations and tariffs and offers a form for credentials to live availability
        data.
      quote: >-
        Reference data updated daily. Availability data is near real-time (authentication
        required).
      evidence_url: https://parkrecharge.com/public-charging
access_requested: null
access_granted: null
sources:
  - url: https://parkrecharge.com/
    note: >-
      ParkRecharge's home page (read 2026-10-10). Built by JavaScript. Its menu lists a
      "Public Charging & Open Data" link to /public-charging under "Knowledge".
  - url: https://parkrecharge.com/sitemap.xml
    note: >-
      ParkRecharge's sitemap (read 2026-10-10). Lists the /public-charging page.
  - url: https://parkrecharge.com/public-charging
    note: >-
      ParkRecharge's "Public Charging and Open Data" page (read 2026-10-10, including the
      page's own script that holds its text). It says "Open data published in a
      machine-readable format using OCPI (including reference and availability data)", that
      the location and tariff data are each "Published as a JSON file following the OCPI
      2.2.1 standard.", and, for live availability data, "Complete the form below and we'll
      send your credentials." The form asks for a name, company, email address and use case.
findings:
  - date: 2026-10-10
    kind: access
    summary: >-
      A request on 2026-10-10 to the locations reference data address,
      https://ocpi-pcpr.hubeleon.net/2.2.1/reference, did not complete because this project's
      HTTPS client reported the server's TLS certificate as expired. No data was read.
    handling: >-
      The project never turns off certificate checks. The address will be tried again later.
    evidence_url: https://parkrecharge.com/public-charging
    status: open
notes: >-
  The page links "Access Reference Data" to https://ocpi-pcpr.hubeleon.net/2.2.1/reference
  (locations, EVSEs and connectors) and https://ocpi-pcpr.hubeleon.net/2.2.1/referencetariffs
  (tariffs). This project has not fetched either, so whether they need a key, their format
  and any rate limit need testing before an adapter is chosen; live availability needs
  credentials requested through the form on the same page. The page's embedded dataset
  description gives the government's Public Charge Point Regulations 2023 guidance page as
  the licence for both datasets, and its visible text names no licence or terms. Its
  sitemap lists a terms and conditions page, not read on 2026-10-10. The repository owner's
  standing rule of 2026-10-10 reads general website or charging terms as not covering an
  operator's open data; that page still needs reading, and the licence section filling in,
  before ParkRecharge could be switched on.
enabled: true
