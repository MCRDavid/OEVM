# yaml-language-server: $schema=schema.json
id: parkrecharge
display_name: ParkRecharge
ocpi_country_code: GB # From the feed's own records, 2026-10-11.
ocpi_party_id: HUB
adapter: ocpi_221
base_url: unknown
endpoints:
  locations:
    url: https://ocpi.hubeleon.net/ocpi/public/2.2.1/locations
    status: documented
    note: >-
      Linked as "Access Reference Data" under "Reference Data: Locations & Connectors" on
      ParkRecharge's "Public Charging and Open Data" page (read 2026-10-17), which says live
      availability is included in this feed. Hosted by Hubeleon, whose e-mobility portal
      ParkRecharge links as its customer portal. Until 2026-10-13 the page linked
      https://ocpi-pcpr.hubeleon.net/2.2.1/reference, a host that no longer exists.
  tariffs:
    url: https://ocpi.hubeleon.net/ocpi/public/2.2.1/tariffs
    status: documented
    note: >-
      Linked as "Access Reference Data" under "Reference Data: Tariffs & Pricing" on the
      same page (read 2026-10-17). Until 2026-10-13 the page linked
      https://ocpi-pcpr.hubeleon.net/2.2.1/referencetariffs.
auth:
  method: none
  name: null
  secret_name: null
rate_limit:
  min_seconds_between_requests: 2
  limits: []
  limits_checked: 2026-10-17
  notes: >-
    ParkRecharge's page states no rate limit. Responses carry X-RateLimit-Limit 60 and
    X-RateLimit-Reset 60 (see findings), which a 2 second gap stays well within. The 2
    second gap is this project's own choice. Each page holds up to 100 records, so a full
    run makes six requests (about 0.9 MB on 2026-10-17).
supports_single_location: unknown
cors: needs_testing
attribution: >-
  Contains data from ParkRecharge published under the Public Charge Point Regulations
  2023, used in line with the Open Government Licence v3.0.
licence:
  name: OGL-3.0
  url: https://www.nationalarchives.gov.uk/doc/open-government-licence/version/3/
  basis: >-
    ParkRecharge's "Public Charging and Open Data" page says the reference data is
    "Published as a JSON file following the OCPI 2.2.1 standard" and that the location data
    "can be consumed by roaming platforms, mapping services, and fleet management tools".
    On 2026-10-17 it also said "All of this data is open and free to use, with no
    registration or credentials needed." It states no licence or rate limit for the files;
    its structured data names the government's Public Charge Point Regulations 2023
    guidance as each dataset's licence, and the page links that guidance. DfT's guidance (updated 21 October 2024)
    says "Data must be open in line with the Open Government Licence". ParkRecharge's terms
    and conditions (read 2026-10-11) "apply to all Pay-As-You-Go and Top-Up charging
    carried out through the ParkRecharge app" and say nothing about the data. On 2026-10-10
    the repository owner decided, as a standing rule for operators whose data has no terms
    of its own, to read general website or charging terms as not covering the open data,
    which regulation 10(5) requires to be available without terms on its use.
  checked: 2026-10-17
excluded_locations:
  decided: 2026-10-11
  basis: >-
    Both are named as test units and sit at the same office address in Writtle, Chelmsford,
    so a driver could be sent somewhere they cannot charge. The repository owner decided on
    2026-10-11 to leave them off the map.
  evidence_url: https://ocpi.hubeleon.net/ocpi/public/2.2.1/locations
  locations:
    - id: "3166"
      name: PR06767 H19 Test Unit
    - id: "1183"
      name: TR0047 Hubeleon Test Centre
engagement:
  status: open_anonymous
  evidence:
    - date: 2026-10-10
      url: https://parkrecharge.com/public-charging
      note: >-
        ParkRecharge's "Public Charging and Open Data" page links its OCPI 2.2.1 reference
        data for locations and for tariffs directly, and says authentication is required for
        live availability data.
    - date: 2026-10-11
      url: https://ocpi-pcpr.hubeleon.net/2.2.1/reference
      note: >-
        Both reference data files answered without a key, read past the host's expired
        certificate: 447 locations and 469 tariffs, all with country code GB and party HUB.
    - date: 2026-10-17
      url: https://parkrecharge.com/public-charging
      note: >-
        The page now links the reference data at
        https://ocpi.hubeleon.net/ocpi/public/2.2.1/locations and
        https://ocpi.hubeleon.net/ocpi/public/2.2.1/tariffs, says live availability is
        included in the locations feed, and says no registration or credentials are needed.
        Both answered without a key: 288 locations and 292 tariffs, all with country code GB
        and party HUB.
  log:
    - date: 2026-10-10
      action: page_checked
      summary: >-
        Read ParkRecharge's "Public Charging and Open Data" page, which links reference data
        for locations and tariffs and offers a form for credentials to live availability
        data.
      quote: >-
        Reference data updated daily. Availability data is near real-time (authentication
        required).
      evidence_url: https://parkrecharge.com/public-charging
    - date: 2026-10-11
      action: page_checked
      summary: >-
        Read the page again and ParkRecharge's terms and conditions, which cover charging
        through its app and say nothing about the data. Both reference data files answered
        without a key once read past the host's expired certificate.
      evidence_url: https://parkrecharge.com/knowledge/terms-and-conditions
    - date: 2026-10-17
      action: page_checked
      summary: >-
        The daily fetch could not reach the old reference data host from 2026-10-14. Read
        the page again: it now links the reference data on a different host, with live
        availability included and no registration needed.
      quote: >-
        Reference data is updated daily. Live availability is included in the locations feed
        and updates in near real time. All of this data is open and free to use, with no
        registration or credentials needed.
      evidence_url: https://parkrecharge.com/public-charging
access_requested: null
access_granted: null
sources:
  - url: https://parkrecharge.com/
    note: >-
      ParkRecharge's home page (read 2026-10-10). Built by JavaScript. Its menu lists a
      "Public Charging & Open Data" link to /public-charging under "Knowledge".
  - url: https://parkrecharge.com/sitemap.xml
    note: >-
      ParkRecharge's sitemap (read 2026-10-10 and 2026-10-11). Lists the /public-charging
      page and the terms and conditions page.
  - url: https://parkrecharge.com/public-charging
    note: >-
      ParkRecharge's "Public Charging and Open Data" page (read 2026-10-10, and rendered in a
      browser on 2026-10-11). On those dates it said "Open data published in a
      machine-readable format using OCPI (including reference and availability data)", that
      the location and tariff data are each "Published as a JSON file following the OCPI
      2.2.1 standard.", linked both files on ocpi-pcpr.hubeleon.net as "Access Reference
      Data", and, for live availability data, said "Complete the form below and we'll send
      your credentials." On 2026-10-17 the page's script (assets/PublicCharging-DVG32ZcW.js)
      linked the files at https://ocpi.hubeleon.net/ocpi/public/2.2.1/locations and
      https://ocpi.hubeleon.net/ocpi/public/2.2.1/tariffs, said live availability is
      included in the locations feed and "The open data above needs no registration", and
      its structured data named the government's Public Charge Point Regulations 2023
      guidance as each dataset's licence. No terms or rate limit for the files.
  - url: https://parkrecharge.com/knowledge/terms-and-conditions
    note: >-
      ParkRecharge's terms and conditions (rendered in a browser on 2026-10-11). ParkRecharge
      is a trading name of Hanger19 Limited. The terms "apply to all Pay-As-You-Go and
      Top-Up charging carried out through the ParkRecharge app" and do not mention the
      open data.
findings:
  - date: 2026-10-10
    kind: access
    summary: >-
      A request on 2026-10-10 to the locations reference data address,
      https://ocpi-pcpr.hubeleon.net/2.2.1/reference, did not complete because this project's
      HTTPS client reported the server's TLS certificate as expired. No data was read.
    handling: >-
      On 2026-10-11 the repository owner decided to read both files past this certificate
      (expired_certificate). The project checked the certificate's chain and host name and
      accepted only that one certificate. On 2026-10-17 ParkRecharge's page linked the data
      on a host whose certificate is in date, so the exception was removed.
    evidence_url: https://parkrecharge.com/public-charging
    status: resolved
    resolved_date: 2026-10-17
  - date: 2026-10-11
    kind: access
    summary: >-
      ocpi-pcpr.hubeleon.net presents a certificate for *.hubeleon.net issued by Go Daddy
      Secure Certificate Authority G2, valid from 23 March 2026 to 7 October 2026 07:59 UTC.
      Its expiry is the only problem OpenSSL reports with it.
    handling: >-
      Read past the expiry by the owner's decision of 2026-10-11, until the data moved to
      ocpi.hubeleon.net, whose certificate was in date on 2026-10-17.
    evidence_url: https://parkrecharge.com/public-charging
    status: resolved
    resolved_date: 2026-10-17
  - date: 2026-10-11
    kind: data_quality
    summary: >-
      The locations file's timestamp is 2026-04-27T14:24:34Z and its newest location
      last_updated is 2026-04-01 (read 2026-10-11), although the page says reference data
      is updated daily. The tariffs file's timestamp is the time of the request.
    handling: >-
      Locations were kept as published, each EVSE status shown with its own date. In the
      feed linked on 2026-10-17, location last_updated values run from 2026-09-08 to the
      day of the request.
    evidence_url: https://ocpi-pcpr.hubeleon.net/2.2.1/reference
    status: resolved
    resolved_date: 2026-10-17
  - date: 2026-10-11
    kind: spec_conformance
    summary: >-
      59 of 447 locations give last_updated as "0000-00-00T00:00:00Z", which is not a valid
      date.
    handling: >-
      The date was recorded as unknown and the locations kept. None of the 288 locations in
      the feed linked on 2026-10-17 gives an invalid date.
    evidence_url: https://ocpi-pcpr.hubeleon.net/2.2.1/reference
    status: resolved
    resolved_date: 2026-10-17
  - date: 2026-10-11
    kind: spec_conformance
    summary: >-
      Each tariff's elements is a single object holding price_components, where OCPI 2.2.1
      gives a list of elements.
    handling: >-
      Read as a list of one element, with the price components exactly as sent. Every
      tariff in the feed linked on 2026-10-17 gives a list.
    evidence_url: https://ocpi-pcpr.hubeleon.net/2.2.1/referencetariffs
    status: resolved
    resolved_date: 2026-10-17
  - date: 2026-10-11
    kind: spec_conformance
    summary: >-
      Locations have an empty city and no postal_code; the full address, postcode included,
      is in the address field.
    handling: >-
      Shown as published. Every location in the feed linked on 2026-10-17 has a city and a
      postal_code.
    evidence_url: https://ocpi-pcpr.hubeleon.net/2.2.1/reference
    status: resolved
    resolved_date: 2026-10-17
  - date: 2026-10-11
    kind: data_quality
    summary: >-
      Connectors name 447 different tariff ids, 17 of which are not in the tariffs file
      (read 2026-10-11).
    handling: >-
      Connectors whose tariff is not found show "Price unknown". Every tariff id named in
      the feed linked on 2026-10-17 is in its tariffs feed.
    evidence_url: https://ocpi-pcpr.hubeleon.net/2.2.1/referencetariffs
    status: resolved
    resolved_date: 2026-10-17
  - date: 2026-10-11
    kind: data_quality
    summary: >-
      7 locations are in Argentina, with country GBR, and 8 tariffs are in US dollars (5) or
      Argentine pesos (3).
    handling: >-
      Checked on 2026-10-11: their addresses and postcodes are Argentine, and neither
      swapping their coordinates nor changing a sign puts any of them in the UK. They were
      left off the map as outside the UK (ADR 0017), and tariffs in other currencies showed
      "Price unknown". The feed linked on 2026-10-17 has only UK locations and GBP tariffs.
    evidence_url: https://ocpi-pcpr.hubeleon.net/2.2.1/reference
    status: resolved
    resolved_date: 2026-10-17
  - date: 2026-10-11
    kind: data_quality
    summary: >-
      Two locations at the same office address in Writtle, Chelmsford, are named as test
      units: "UK-HBN-PAYTERTEST" (id 3166) and "TR0047 Hubeleon Test Centre" (id 1183). Both
      are marked for publishing.
    handling: >-
      Left off the map by the repository owner's decision of 2026-10-11
      (excluded_locations). Both are still in the feed linked on 2026-10-17; id 3166 is now
      named "PR06767 H19 Test Unit", at the same address.
    evidence_url: https://ocpi.hubeleon.net/ocpi/public/2.2.1/locations
  - date: 2026-10-11
    kind: data_quality
    summary: >-
      23 UK locations use a tariff whose every price is zero. Their names include hospital,
      college and company sites and one marked "HCC Fleet Only".
    handling: >-
      Shown as free, as the tariffs stated. In the feed linked on 2026-10-17 no connector
      uses a tariff whose every price is zero.
    evidence_url: https://ocpi-pcpr.hubeleon.net/2.2.1/referencetariffs
    status: resolved
    resolved_date: 2026-10-17
  - date: 2026-10-11
    kind: documentation
    summary: >-
      Locations carry no operator object. Their names start with several prefixes (PR 354,
      GR 21, AW 17, SCC 14 and others) and include sites such as Belfast City Hospital, which
      suggests the file covers sites ParkRecharge runs for several hosts (inferred).
    handling: >-
      Every location is shown as ParkRecharge's, the publisher of the file. In the feed
      linked on 2026-10-17 every location names its operator as "Park&Recharge Limited".
    evidence_url: https://ocpi-pcpr.hubeleon.net/2.2.1/reference
    status: resolved
    resolved_date: 2026-10-17
  - date: 2026-10-11
    kind: data_quality
    summary: One connector gives max_electric_power and max_amperage as 0.
    handling: >-
      Its power was recorded as unknown. Every connector in the feed linked on 2026-10-17
      gives a power figure.
    evidence_url: https://ocpi-pcpr.hubeleon.net/2.2.1/reference
    status: resolved
    resolved_date: 2026-10-17
  - date: 2026-10-17
    kind: access
    summary: >-
      From 2026-10-14 to 2026-10-17 the daily fetch could not connect to
      https://ocpi-pcpr.hubeleon.net/2.2.1/reference. On 2026-10-17 that host name no longer
      resolved, and ParkRecharge's page linked the reference data at
      https://ocpi.hubeleon.net/ocpi/public/2.2.1/locations and
      https://ocpi.hubeleon.net/ocpi/public/2.2.1/tariffs.
    handling: >-
      The operator file now uses the addresses the page links. Until then the map showed the
      copy fetched on 2026-10-13, as the feed health page said.
    evidence_url: https://parkrecharge.com/public-charging
    status: resolved
    resolved_date: 2026-10-17
  - date: 2026-10-17
    kind: documentation
    summary: >-
      The feed linked on 2026-10-17 is paged, 100 records a page, with X-Total-Count and Link
      headers as OCPI 2.2.1 describes. Responses carry X-RateLimit-Limit 60,
      X-RateLimit-Remaining and X-RateLimit-Reset 60; no page states what they mean.
    handling: >-
      The adapter follows the Link headers. The project leaves 2 seconds between requests,
      within 60 requests a minute if that is what the headers mean, and makes six requests
      a run.
    evidence_url: https://ocpi.hubeleon.net/ocpi/public/2.2.1/locations
  - date: 2026-10-17
    kind: data_quality
    summary: >-
      The feed linked on 2026-10-17 holds 288 locations; the file linked until 2026-10-13
      held 447 on 2026-10-11, 7 of them in Argentina.
    handling: Every location the feed marks for publishing is mapped, as published.
    evidence_url: https://ocpi.hubeleon.net/ocpi/public/2.2.1/locations
  - date: 2026-10-17
    kind: data_quality
    summary: >-
      Two location names begin "(REMOVED)" (id 2647) and "(Archived)" (id 3779), while
      their EVSEs report AVAILABLE or CHARGING. Five locations have every EVSE marked
      REMOVED.
    handling: >-
      Shown as published, each EVSE with the status and date it reports. A REMOVED EVSE
      shows as Removed and counts as reported out of service.
    evidence_url: https://ocpi.hubeleon.net/ocpi/public/2.2.1/locations
notes: >-
  Standard OCPI 2.2.1 paged responses for locations and tariffs, read by the ocpi_221
  adapter. ParkRecharge's page says live availability is included in the locations feed.
  Until 2026-10-13 the data was on ocpi-pcpr.hubeleon.net, read past that host's expired
  certificate by the owner's decision of 2026-10-11 (ADR 0021); that host no longer
  resolves, and the data's new host has a certificate in date, so the exception is no longer
  needed.
enabled: true
