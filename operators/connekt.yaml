# yaml-language-server: $schema=schema.json
id: connekt
display_name: Connekt
ocpi_country_code: GB
ocpi_party_id: CON
adapter: sent_copy
base_url: unknown
endpoints: {}
auth:
  method: none
  name: null
  secret_name: null
rate_limit:
  min_seconds_between_requests: 2
  limits: []
  limits_checked: 2026-10-26
  notes: >-
    No requests are made: the map shows a copy of Connekt's data that it sent by email on
    2026-10-26 (sent_copy below). Connekt's open data page and its reply state no rate
    limit. The 2 second gap is this project's own choice, for a feed if one is published.
supports_single_location: unknown
cors: unknown
attribution: >-
  Contains data from Connekt provided under the Public Charge Point Regulations 2023, used in
  line with the Open Government Licence v3.0.
licence:
  name: OGL-3.0
  url: https://www.nationalarchives.gov.uk/doc/open-government-licence/version/3/
  basis: >-
    Connekt's "Public Charge Point Regulations | Open Data" page says "Open data is
    information about our public charge points that anyone can access free of charge" and
    "There is no charge for a request", and its request form asks for contact details only.
    The page states no licence or terms for the data, and Connekt's reply of 2026-10-26,
    which sent the data, states none either. The terms linked from Connekt's website footer
    and from each connector in the data ("Connekt Charging General Terms & Conditions",
    https://www.connektcharging.com/terms-and-conditions) lead to a PDF headed "Management
    Terms and Conditions", which covers the services Connekt supplies to its customers and
    does not mention charge point open data (read 2026-10-29). Regulation 10(5) of the
    Public Charge Point Regulations 2023 requires the data to be available without terms on
    its use, and DfT's guidance says "Data must be open in line with the Open Government
    Licence". On 2026-10-10 the repository owner decided, as a standing rule for operators
    whose data has no terms of its own, that such operators can be switched on without
    asking again.
  checked: 2026-10-29
sent_copy:
  decided: 2026-10-29
  basis: >-
    Connekt answered a request through its open data form by emailing its location and
    tariff data as two OCPI 2.2.1 files, with no address to fetch them from. On 2026-10-29
    the repository owner decided to show that copy on the map, dated as made and with
    charge point status unknown, while Connekt is asked for an address that can be fetched,
    and to replace it with Connekt's feed if one is published.
  evidence_file: evidence/connekt/2026-10-26-reply.md
  channel: email
  received: 2026-10-26
  made_at: 2026-10-26T14:22:52Z
  locations: sent_copies/connekt/2026-10-26-locations.json.gz
  tariffs: sent_copies/connekt/2026-10-26-tariffs.json.gz
engagement:
  status: no_public_feed_found
  evidence:
    - date: 2026-10-10
      url: https://www.connektcharging.com/
      note: >-
        Connekt's home page has no open data, regulations or charge point data link. Its
        sitemap, driver support page and FAQ page list or give no open data feed or route for
        requesting open data.
    - date: 2026-10-24
      url: https://www.connektcharging.com/public-charge-point-regulations
      note: >-
        Connekt's "Public Charge Point Regulations" page offers its open data through a request
        form that asks for contact details only, and says "We review your request and send the
        data to you in a suitable format."
    - date: 2026-10-26
      file: evidence/connekt/2026-10-26-reply.md
      note: >-
        Connekt's emailed reply, with its location and tariff data attached as two OCPI 2.2.1
        JSON files and no web address or key for fetching the data.
  log:
    - date: 2026-10-10
      action: feed_searched
      summary: >-
        Connekt's home page, sitemap, driver support page and FAQ page were read, and no open
        data feed or route for requesting open data was found.
      evidence_url: https://www.connektcharging.com/
    - date: 2026-10-24
      action: request_sent
      channel: web_form
      summary: >-
        Requested Connekt's open data through the request form on its Public Charge Point
        Regulations page, which asks for contact details only.
      evidence_url: https://www.connektcharging.com/public-charge-point-regulations
    - date: 2026-10-26
      action: reply_received
      channel: email
      summary: >-
        Connekt replied by email with its location and tariff data attached as two OCPI 2.2.1
        JSON files, with no web address or key for fetching the data.
      evidence_file: evidence/connekt/2026-10-26-reply.md
    - date: 2026-10-26
      action: follow_up_sent
      channel: email
      summary: >-
        Answered Connekt's email, thanking it for the data and asking for a web address where the
        same OCPI 2.2.1 data can be fetched automatically, with reference to the GOV.UK guidance.
      evidence_file: evidence/connekt/2026-10-26-follow-up.md
access_requested: 2026-10-24
access_granted: null
sources:
  - url: https://www.connektcharging.com/
    note: Connekt's home page (read 2026-10-10). No open data link.
  - url: https://www.connektcharging.com/public-charge-point-regulations
    note: >-
      Connekt's "Public Charge Point Regulations | Open Data" page (read 2026-10-24 and
      2026-10-26), with its open data request form. Not listed in the sitemap read on
      2026-10-10.
  - url: https://www.connektcharging.com/sitemap.xml
    note: Connekt's sitemap (read 2026-10-10). No open data, OCPI or data request page is listed.
  - url: https://www.connektcharging.com/driver-support
    note: Connekt's driver support page (read 2026-10-10). No open data link.
  - url: https://www.connektcharging.com/faq
    note: >-
      Connekt's FAQ page (read 2026-10-10). Gives a network uptime of 99.13%; no open data
      link.
findings:
  - date: 2026-10-26
    kind: access
    summary: >-
      Connekt offers its open data through a request form, and its reply to a request on
      2026-10-24 was the data as two files attached to an email, with no web address for
      fetching it.
    handling: >-
      By the repository owner's decision of 2026-10-29, the map shows the emailed copy as
      sent, dated 2026-10-26 14:22 UTC when it was made, says it is a copy that is not
      updated, and shows every charge point status as unknown. On 2026-10-26 the project asked
      Connekt by email for an address that can be fetched automatically.
    evidence_url: https://www.connektcharging.com/public-charge-point-regulations
notes: >-
  No open data feed or request route was found on Connekt's own website on 2026-10-10. A
  request form was found on its Public Charge Point Regulations page on 2026-10-24 and used the
  same day. Connekt replied on 2026-10-26 with its data as emailed files (362 locations under
  GB CON). The map shows that copy by the owner's decision of 2026-10-29 (sent_copy, ADR
  0029), with charge point status unknown, until Connekt's data can be fetched.
enabled: true
