findings: []
notes: >-
  YourParkingSpace is mainly a parking booking marketplace, where many listed spaces are
  private driveways. Its business offer funds and installs chargers in car parks it manages
  or lists, but its pages do not say whether it or the site owner is the operator of those
  charge points, so it is recorded as possibly out of scope. The next step is to ask whether
  it operates any public charge points itself and, if so, where its open data is published.
