# yaml-language-server: $schema=schema.json
id: geniepoint
display_name: GeniePoint
ocpi_country_code: GB
ocpi_party_id: GPT # Confirmed from the feed's own country_code and party_id on 2026-10-08.
adapter: ocpi_221
base_url: unknown
endpoints:
  locations:
    url: https://opendata.geniepoint.co.uk/locations
    status: documented
    note: Linked as "Locations data" from GeniePoint's open data page (read 2026-10-08).
  tariffs:
    url: https://opendata.geniepoint.co.uk/tariffs
    status: documented
    note: Linked as "Tariffs data" from GeniePoint's open data page (read 2026-10-08).
auth:
  method: none
  name: null
  secret_name: null
rate_limit:
  min_seconds_between_requests: 2
  limits: []
  limits_checked: 2026-10-08
  notes: >-
    GeniePoint's open data page states no rate limit. The 2 second gap is this project's
    own choice. Each file holds every record, so a full run makes two requests (about 1.6
    MB on 2026-10-08).
supports_single_location: needs_testing
cors: not_supported # no access-control-allow-origin header on 2026-10-08
attribution: >-
  Contains data from GeniePoint published under the Public Charge Point Regulations 2023,
  used in line with the Open Government Licence v3.0.
licence:
  name: OGL-3.0
  url: https://www.nationalarchives.gov.uk/doc/open-government-licence/version/3/
  basis: >-
    GeniePoint's open data page says the data "must be publicly available in line with
    the Public Charge Point Regulations 2023", and DfT's guidance says "Data must be open
    in line with the Open Government Licence". The open data page, read in a browser on
    2026-10-08, states no licence or terms for the data. The Equans website's general terms
    of use (read in a browser on 2026-10-08) cover www.equans.co.uk and "any subsidiary
    Equans sites which are linked to such site", and say that apart from downloads "for
    your personal and internal business use", other reproduction needs Equans' permission.
    On 2026-10-08 the repository owner decided to read those general website terms as not
    covering the open data files, which GeniePoint publishes under the regulations, and
    regulation 10(5) requires them to be available without terms on their use.
  checked: 2026-10-08
relay:
  decided: 2026-10-08
  reason: >-
    The files answered HTTP 403 to the first request from a GitHub Actions runner in the
    first daily run, while answering normally from another network. The repository owner
    decided to fetch them through the project's relay on Cloudflare Workers, with the
    project's User-Agent and the same rate limits.
  evidence_url: https://github.com/MCRDavid/OEVM/actions/runs/37853739264
  url_variable: OEVM_RELAY_URL
  secret_name: OEVM_RELAY_TOKEN
  path_prefix: /geniepoint
engagement:
  status: open_anonymous
  evidence:
    - date: 2026-10-08
      url: https://www.equans.co.uk/drivers-geniepoint/open-data
      note: >-
        Read in a browser by the repository owner. Links "Locations data" and "Tariffs
        data" as .json files and states no licence, terms or rate limit.
access_requested: null
access_granted: null
sources:
  - url: https://www.equans.co.uk/drivers-geniepoint/open-data
    note: >-
      GeniePoint's open data page, read in a browser on 2026-10-08. Gives the two download
      links. It returns a browser check (HTTP 403) to automated requests.
  - url: https://www.equans.co.uk/terms-use
    note: >-
      The Equans website's general terms of use, read in a browser on 2026-10-08 by the
      repository owner. Summarised in the licence section.
findings:
  - date: 2026-10-08
    kind: access
    summary: >-
      The open data page returns a browser check (HTTP 403) to automated requests. The
      download links, on opendata.geniepoint.co.uk, answer automated requests normally.
    handling: >-
      The page was read in a browser by the repository owner and its links recorded here.
      The files are fetched directly.
    evidence_url: https://www.equans.co.uk/drivers-geniepoint/open-data
  - date: 2026-10-08
    kind: spec_conformance
    summary: >-
      Each file holds every record in one response (306 locations and 530 tariffs on
      2026-10-08), matching X-Total-Count, but sends X-Limit 0. OCPI 2.2.1 describes
      X-Limit as the maximum number of objects the server can return.
    handling: The adapter reads each file in one request and checks the count against X-Total-Count.
    evidence_url: https://opendata.geniepoint.co.uk/tariffs
  - date: 2026-10-08
    kind: data_quality
    summary: >-
      The tariffs file repeats 22 tariffs 8 times each (530 records, 376 distinct ids on
      2026-10-08). The copies are identical and no location refers to them.
    handling: One copy of each is kept and the repeats are logged.
    evidence_url: https://opendata.geniepoint.co.uk/tariffs
  - date: 2026-10-08
    kind: data_quality
    summary: >-
      Tariff descriptions (tariff_alt_text) are internal names, such as Tariff_Fast or
      Tariff_Rapid followed by an id.
    handling: Kept as published. Prices are described from the price components, not this text.
    evidence_url: https://opendata.geniepoint.co.uk/tariffs
  - date: 2026-10-08
    kind: access
    summary: >-
      The files send no Access-Control-Allow-Origin header, so web browsers cannot read
      them directly.
    handling: The map will use data fetched by the pipeline, not requests from visitors' browsers.
    evidence_url: https://opendata.geniepoint.co.uk/locations
  - date: 2026-10-08
    kind: access
    summary: >-
      The Equans website's general terms of use cover linked subsidiary sites and say that,
      apart from downloads for personal and internal business use, reproduction needs
      Equans' permission. The open data page says the data must be publicly available in
      line with the regulations, and states no terms for the data.
    handling: >-
      The repository owner decided on 2026-10-08 to read the general website terms as not
      covering the open data files. The reasoning is recorded in the licence section.
    evidence_url: https://www.equans.co.uk/terms-use
  - date: 2026-10-08
    kind: data_quality
    summary: >-
      One location, "Cheshire East Council - Crewe Civic" (postcode CW1 2JZ), has longitude
      2.444352, which is east of the UK. Its postcode is in Crewe, west of the Greenwich
      meridian.
    handling: >-
      Left off the map and listed in the manifest as not mapped. Coordinates are never
      corrected by this project.
    evidence_url: https://opendata.geniepoint.co.uk/locations
  - date: 2026-10-08
    kind: access
    summary: >-
      In the first daily run from a GitHub Actions runner, the locations file answered HTTP
      403 to the first request. The same file answered normally from another network the
      same evening.
    handling: >-
      GeniePoint was left out of that run and the feed health page shows the failure. The
      repository owner decided the same day to fetch it through the project's relay (see
      relay above). The owner chose not to contact GeniePoint about the refusal.
    evidence_url: https://github.com/MCRDavid/OEVM/actions/runs/37853739264
notes: >-
  The blueprint expected downloads for the static_file adapter. The files turned out to be
  OCPI 2.2.1 responses, so the ocpi_221 adapter reads them. Switched on 2026-10-08 after
  the open data page and the Equans website's terms of use were read.
enabled: true
