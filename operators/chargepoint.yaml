# yaml-language-server: $schema=schema.json
id: chargepoint
display_name: ChargePoint
ocpi_country_code: unknown
ocpi_party_id: unknown
adapter: eco_movement_pcpr
base_url: unknown
endpoints:
  locations:
    url: https://open-chargepoints.com/api/ocpi/cpo/2.2.1/locations
    status: documented
    note: Confirmed in Eco-Movement's PCPR API reference on 2026-10-07.
  tariffs:
    url: https://open-chargepoints.com/api/ocpi/cpo/2.2.1/tariffs
    status: documented
  statuses:
    url: https://open-chargepoints.com/api/statuses
    status: documented
auth:
  method: header
  name: Authorization
  scheme: Token
  secret_name: CHARGEPOINT_TOKEN
rate_limit:
  min_seconds_between_requests: 125
  limits:
    - publisher: Eco-Movement
      requests: 30
      per_seconds: 3600
      endpoint: locations
      quote: The `locations` endpoint has a rate limit of 30 requests per 1 hour.
      source_url: https://developers.eco-movement.com/v2.2.1/reference/get-all-locations-pcpr-api
      checked: 2026-10-26
    - publisher: Eco-Movement
      requests: 30
      per_seconds: 3600
      endpoint: locations
      scope: single location
      quote: The `locations/{id}` endpoint has a rate limit of 30 requests per 1 hour.
      source_url: https://developers.eco-movement.com/v2.2.1/reference/get-specific-location-pcpr-api
      checked: 2026-10-26
    - publisher: Eco-Movement
      requests: 30
      per_seconds: 3600
      endpoint: tariffs
      quote: The `tariffs` endpoint has a rate limit of 30 requests per 1 hour.
      source_url: https://developers.eco-movement.com/reference/get-tariffs-pcpr-api
      checked: 2026-10-26
    - publisher: Eco-Movement
      requests: 1
      per_seconds: 30
      endpoint: statuses
      quote: The `statuses` endpoint has a rate limit of 1 request per 30 seconds.
      source_url: https://developers.eco-movement.com/reference/get-statuses-pcpr-api
      checked: 2026-10-26
  limits_checked: 2026-10-26
  notes: >-
    One gap of 125 seconds (the 120 seconds the strictest limit needs, plus a safety
    margin) is kept between any two requests to open-chargepoints.com, shared by every
    operator served from it, so this project sends it at most 29 requests in any hour.
    Requests are sent one at a time; Eco-Movement "strongly recommends limiting
    simultaneous GET requests to a maximum of 5". It recommends retrieving the entire
    dataset once a day.
supports_single_location: unknown
cors: unknown
attribution: null
licence: null
engagement:
  status: key_on_request
  evidence:
    - date: 2026-10-10
      url: https://www.chargepoint.com/en-gb/blog/navigating-uk-public-charging-regulations-guide-charge-point-operators
      note: >-
        ChargePoint's UK guide to the regulations links a Google form for requesting data via
        API on the charge point operators it serves, and says the API covers all public
        charging stations on its station management software in the UK. Its UK home page and
        UK legal page do not link the form.
    - date: 2026-10-10
      url: https://docs.google.com/forms/d/e/1FAIpQLSeJ9Z3dyMdsBjaQ3pj9F3aOAXE4jstoHFBxwVq3wxs5lU5JLg/viewform
      note: >-
        The "PCPR Data Request - ChargePoint station management software" form asks for an
        email address, name, organisation, network and planned use of data, and says requests
        are shared with Eco-Movement. It names no licence, terms, key or rate limit.
    - date: 2026-10-23
      url: https://docs.google.com/forms/d/e/1FAIpQLSeJ9Z3dyMdsBjaQ3pj9F3aOAXE4jstoHFBxwVq3wxs5lU5JLg/viewform
      note: >-
        On 2026-10-23 the form said the data of these operators on the ChargePoint platform
        is reached by choosing "ChargePoint platform CPOs": Airbus UK, AMR GP Ltd, Aylesford
        Electrical, Bicester Village, BILLING SERVICE STATION LTD., ChargePoint UK
        Headquarters, Chargie Chargie, Cullen Group Limited, Dean Court Community
        Association, Derby Leisure and Events Venue, East Devon 4x4, Euro Stars WIDNES LTD,
        Evie Life, Harwell Science & Innovation Campus, Harwich Haven, Holiday Inn Express -
        St Albans, InstaVolt Ltd, Jute Jam & Journalism Group, LCFA Sefton CIC, Loch Ness
        Inn, Macrow Ltd, MEPC Milton Park, mysql8ccqauat_eu (appears to be a test entry),
        Otford Parish Council, Pamusoro, Sea Level Wave Co Ltd, Selwood Limited, Sutton hotel
        collection, Tylehurst Instruments, West Estates Limited, ZOLB EV.
    - date: 2026-10-26
      file: evidence/chargepoint/2026-10-26-token-email.md
      note: >-
        Eco-Movement's email with an expiring link to this network's token for its PCPR
        API, sent as an "Authorization: Token" header to its OCPI 2.2.1 endpoints. The
        token itself is not kept here.
  log:
    - date: 2026-10-10
      action: feed_searched
      summary: >-
        ChargePoint's UK home page, its sitemap and its UK legal page were read; none links an
        open data page, and the sitemap lists a UK guide to the regulations.
      evidence_url: https://www.chargepoint.com/en-gb
    - date: 2026-10-10
      action: page_checked
      summary: >-
        ChargePoint's UK guide to the regulations was read; it links a form for requesting
        data via API on the charge point operators that use its software.
      quote: If you would like to request data via API on any CPOs we serve, you can do so here.
      evidence_url: https://www.chargepoint.com/en-gb/blog/navigating-uk-public-charging-regulations-guide-charge-point-operators
    - date: 2026-10-10
      action: page_checked
      summary: >-
        ChargePoint's "PCPR Data Request" Google form was read, not submitted; it says the
        request will be shared with Eco-Movement and an answer will come within 5 working
        days.
      quote: >-
        Request data on the location, status, and properties of stations and networks using
        ChargePoint station management software in the United Kingdom, in accordance with the
        UK Public Charge Point Regulations. You will receive an answer within 5 working days.
      evidence_url: https://docs.google.com/forms/d/e/1FAIpQLSeJ9Z3dyMdsBjaQ3pj9F3aOAXE4jstoHFBxwVq3wxs5lU5JLg/viewform
    - date: 2026-10-23
      action: request_sent
      channel: web_form
      summary: >-
        Requested access to PCPR data for the ChargePoint platform networks through ChargePoint's Google form (choice "ChargePoint platform CPOs"), which is shared with Eco-Movement.
    - date: 2026-10-26
      action: key_granted
      channel: email
      summary: >-
        Eco-Movement sent a token for this network's PCPR data by email, through an
        expiring link, to be sent as an "Authorization: Token" header to its OCPI
        2.2.1 endpoints. The token is kept as a GitHub Actions secret.
      evidence_file: evidence/chargepoint/2026-10-26-token-email.md
access_requested: 2026-10-23
access_granted: 2026-10-26
sources:
  - url: https://www.chargepoint.com/en-gb
    note: ChargePoint's UK home page (read 2026-10-10). No open data link.
  - url: https://www.chargepoint.com/sitemap.xml
    note: >-
      ChargePoint's sitemap index and its two pages (read 2026-10-10). UK pages include blog
      posts on charging regulations, such as a guide for charge point operators, but no open
      data, OCPI or data request page.
  - url: https://www.chargepoint.com/en-gb/legal
    note: ChargePoint's UK legal information page (read 2026-10-10). No open data link.
  - url: https://www.chargepoint.com/en-gb/blog/navigating-uk-public-charging-regulations-guide-charge-point-operators
    note: >-
      ChargePoint's UK guide to the regulations for charge point operators (read 2026-10-10).
      Its open data section links the data request form and says the form leads to "an
      external partner of ChargePoint".
  - url: https://docs.google.com/forms/d/e/1FAIpQLSeJ9Z3dyMdsBjaQ3pj9F3aOAXE4jstoHFBxwVq3wxs5lU5JLg/viewform
    note: >-
      The "PCPR Data Request - ChargePoint station management software" Google form (read
      2026-10-10, not submitted). Its disclaimer says ChargePoint is a technology provider
      and "does not act as a Charge Point Operator beyond charging stations on its own
      premises". Its network list offers "ChargePoint platform CPOs", Raw Charging, ev-point
      and Lidl Great Britain Limited.
findings: []
notes: >-
  Access could be requested through the "PCPR Data Request" form linked from ChargePoint's UK
  guide to the regulations. The form says ChargePoint is a technology provider rather than a
  charge point operator, so this file records the route for networks on its platform.
  Requests are shared with Eco-Movement, so the eco_movement_pcpr adapter may apply once
  access is given, but the form does not say how the data is delivered; this needs testing.
  On 2026-10-26 Eco-Movement sent a token for this network's data on its PCPR API, so it
  uses the eco_movement_pcpr adapter. What the token returns needs testing with one
  recorded fetch before the network is switched on.
enabled: false
