  evidence:
    - date: 2026-10-23
      url: https://energy.drax.com/drax-network-of-public-chargers/
      note: >-
        Drax's "Public Charge Point Regulations (PCPR) RFI Files" page offers a form to
        request reference data for "the Drax managed Public Charge Point Network within the
        United Kingdom" and says requests are shared with Eco-Movement.
    - date: 2026-10-27
      file: evidence/drax_energy_solutions/2026-10-27-token-emails.md
      note: >-
        Three emails from Eco-Movement with tokens for eight networks, all published under
        OCPI party GB GFX. The tokens are not kept here.
  log:
    - date: 2026-10-23
      action: page_checked
      summary: >-
        Drax's PCPR page was read; the form asks for a name, email address, organisation and
        planned use of the data, and promises a reply within five working days.
      quote: >-
        Your request will be shared with Eco-Movement, and in submitting the email you are
        consenting to the processing of their data for the purpose of providing you with the
        requested information.
      evidence_url: https://energy.drax.com/drax-network-of-public-chargers/
    - date: 2026-10-23
      action: request_sent
      channel: web_form
      summary: >-
        Requested access to Drax Energy Solutions' PCPR data through the form on its PCPR page, which is shared with Eco-Movement.
    - date: 2026-10-27
      action: reply_received
      channel: email
      summary: >-
        Eco-Movement sent tokens by email for eight networks: Drax Group, GFX-GB Drax,
        drax-Ista, Aldi Stores Limited, Travis Perkins, Volvo, WCCC Edgbaston and
        Southampton Apartment Hotels. The emails do not say which request they answer;
        reading them as the answer to this one is inferred from the labels and from the
        shared OCPI party GB GFX.
      evidence_file: evidence/drax_energy_solutions/2026-10-27-token-emails.md
