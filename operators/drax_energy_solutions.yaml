findings: []
notes: >-
  Drax's PCPR page offers data on "the Drax managed Public Charge Point Network". The
  eight networks whose tokens Eco-Movement sent on 2026-10-27 are recorded as operators of
  their own, each with its own token: drax_group, gfx_gb_drax, drax_ista, aldi,
  travis_perkins, volvo, wccc_edgbaston and southampton_apartment_hotels. This file keeps
  the request and reply; it has no feed of its own. Whether the eight are the whole of
  Drax's managed network is unknown.
