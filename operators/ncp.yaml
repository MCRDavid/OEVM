findings: []
notes: >-
  NCP is a car park operator. National Car Parks Limited entered administration on
  2026-03-16 and press reports of 2026-10-08 say its business and most car parks were sold
  and still trade as NCP. Charge points listed at NCP car parks on 2026-10-11 name other
  networks (Roam, Be.EV and bp pulse among them), whose own data would cover them, and no
  sign of an NCP charging network was found. NCP's website refused automated reads, so the
  next step is to read its charging pages in a browser; if NCP runs no charge points itself,
  this file can be removed.
