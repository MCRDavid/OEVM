engagement:
  status: no_public_feed_found
  evidence:
    - date: 2026-10-10
      url: https://www.zest.uk.com/charge-point-open-data
      note: >-
        Zest's open data page offers a request form asking for a first and last name,
        email address, company and reason for the request. It says the data is licensed
        under CC BY 4.0. It does not say whether access is given as a key, a file or by
        other means.
    - date: 2026-10-28
      file: evidence/zest/2026-10-28-reply.md
      note: >-
        Zest's emailed reply, with its location and tariff data attached as two OCPI 2.2.1
        JSON files made on 2026-10-26 and no web address or key for fetching the data. It
        asks for the form to be completed monthly for an updated snapshot.
  log:
    - date: 2026-10-10
      action: page_checked
      summary: >-
        Zest's charge point open data page was read; it offers a request form and states a
        licence for the data.
      quote: >-
        Request Zest’s charge point open data as per the Public Charge Point Regulations
        2023.
      evidence_url: https://www.zest.uk.com/charge-point-open-data
    - date: 2026-10-23
      action: request_sent
      channel: web_form
      summary: >-
        Requested access to Zest's charge point open data through its open data form.
    - date: 2026-10-28
      action: reply_received
      channel: email
      summary: >-
        Zest replied by email with its location and tariff data attached as two OCPI 2.2.1
        JSON files, with no web address or key for fetching the data, and asked for the form
        to be completed monthly for an updated snapshot.
      quote: >-
        Please find the OCPI Data request documents attached. We are currently working hard
        behind the scenes to implement automation for this process. In the meantime, please
        complete the form monthly to ensure we have an updated snapshot of the necessary
        information.
