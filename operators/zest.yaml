      The files are kept privately and are not on the map while the repository owner
      decides whether to show them.
    evidence_url: https://www.zest.uk.com/charge-point-open-data
notes: >-
  Zest's page says "Use of this data is licensed under CC BY 4.0." (read 2026-10-10). Access
