# yaml-language-server: $schema=schema.json
id: esb_ecars
display_name: ESB ecars (Northern Ireland)
ocpi_country_code: GB
ocpi_party_id: ESB # Confirmed from the feed's own country_code and party_id on 2026-10-29.
adapter: eco_movement_pcpr
base_url: unknown
endpoints:
  locations:
    url: https://open-chargepoints.com/api/ocpi/cpo/2.2.1/locations/
    status: documented
    note: >-
      Confirmed in Eco-Movement's PCPR API reference on 2026-10-07. Written with the trailing
      slash, as in the user guide's example request and the getting started page's paging
      link (read 2026-10-26); without it the server answered HTTP 307 on 2026-10-29.
  tariffs:
    url: https://open-chargepoints.com/api/ocpi/cpo/2.2.1/tariffs/
    status: documented
  statuses:
    url: https://open-chargepoints.com/api/statuses
    status: documented
auth:
  method: header
  name: Authorization
  scheme: Token
  secret_name: ESB_ECARS_TOKEN
rate_limit:
  min_seconds_between_requests: 125
  limits:
    - publisher: Eco-Movement
      requests: 30
      per_seconds: 3600
      endpoint: locations
      quote: The `locations` endpoint has a rate limit of 30 requests per 1 hour.
      source_url: https://developers.eco-movement.com/v2.2.1/reference/get-all-locations-pcpr-api
      checked: 2026-10-26
    - publisher: Eco-Movement
      requests: 30
      per_seconds: 3600
      endpoint: locations
      scope: single location
      quote: The `locations/{id}` endpoint has a rate limit of 30 requests per 1 hour.
      source_url: https://developers.eco-movement.com/v2.2.1/reference/get-specific-location-pcpr-api
      checked: 2026-10-26
    - publisher: Eco-Movement
      requests: 30
      per_seconds: 3600
      endpoint: tariffs
      quote: The `tariffs` endpoint has a rate limit of 30 requests per 1 hour.
      source_url: https://developers.eco-movement.com/reference/get-tariffs-pcpr-api
      checked: 2026-10-26
    - publisher: Eco-Movement
      requests: 1
      per_seconds: 30
      endpoint: statuses
      quote: The `statuses` endpoint has a rate limit of 1 request per 30 seconds.
      source_url: https://developers.eco-movement.com/reference/get-statuses-pcpr-api
      checked: 2026-10-26
  limits_checked: 2026-10-26
  notes: >-
    A gap of 125 seconds (the 120 seconds the strictest limit needs, plus a safety
    margin) is kept between any two requests with this network's token, so at most 29
    requests in any hour are sent with it. By the repository owner's decision of
    2026-10-29 (limits_per_key) the limits are read as applying to each token. Requests
    to open-chargepoints.com are still sent one at a time, at least 2 seconds apart
    whichever network they are for, and a request from the server to wait holds back
    every network on it. Eco-Movement "strongly recommends limiting simultaneous GET
    requests to a maximum of 5". It recommends retrieving the entire dataset once a day.
limits_per_key:
  decided: 2026-10-29
  basis: >-
    Eco-Movement publishes a limit of 30 requests an hour for each of the locations and
    tariffs endpoints and gives each network its own token, but does not say whether the
    limits count per token or per address. The repository owner decided on 2026-10-29
    that they are read as applying to each token, so each network keeps its own 125
    second gap, while requests to open-chargepoints.com are still sent one at a time.
  evidence_url: https://developers.eco-movement.com/v2.2.1/docs/eco-movement-pcpr-api-user-guide
supports_single_location: unknown
cors: unknown
attribution: >-
  Contains data from ESB ecars (Northern Ireland) published under the Public Charge Point
  Regulations 2023, used in line with the Open Government Licence v3.0.
licence:
  name: OGL-3.0
  url: https://www.nationalarchives.gov.uk/doc/open-government-licence/version/3/
  basis: >-
    ESB ecars' pages have no open data page and state no terms for the data (read
    2026-10-22). Eco-Movement's email of 2026-10-26 with the token, and its PCPR API user
    guide and reference (read 2026-10-26), state no licence or terms either. Regulation
    10(5) of the Public Charge Point Regulations 2023 requires the data to be available
    "without any requirement to agree to terms and conditions regarding the use of that
    data", and the DfT guidance says "Data must be open in line with the Open Government
    Licence". On 2026-10-10 the repository owner decided, as a standing rule for operators
    whose data has no terms of its own, that such operators can be switched on without
    asking again.
  checked: 2026-10-29
vat_in_price:
  decided: 2026-10-29
  basis: >-
    ESB ecars' three tariffs on Eco-Movement's PCPR API give every energy price with VAT
    20 on 2026-10-29, and all 9 are whole pence as published (0.75 and 0.61 pounds per
    kWh). Read as OCPI 2.2.1 says, with VAT added, 0.75 would be 90p per kWh. That the
    stated VAT is already in the prices is inferred from the figures, not stated by ESB
    ecars. The repository owner decided on 2026-10-29 that the prices are read as
    already including VAT, so no VAT is added.
  evidence_url: https://open-chargepoints.com/api/ocpi/cpo/2.2.1/tariffs/
engagement:
  status: key_on_request
  evidence:
    - date: 2026-10-22
      url: https://esb.ie/what-we-do/ecars/our-network
      note: >-
        ESB ecars' network page says ESB operates and maintains the public charge point
        network in Northern Ireland, and sends drivers in Great Britain to ESB Energy. Neither
        this page, the ecars FAQs, the essential driver information page nor ESB's sitemap
        links open data or a route for requesting it.
    - date: 2026-10-26
      file: evidence/esb_ecars/2026-10-26-token-email.md
      note: >-
        Eco-Movement's email with an expiring link to this network's token for its PCPR
        API, sent as an "Authorization: Token" header to its OCPI 2.2.1 endpoints. The
        token itself is not kept here.
  log:
    - date: 2026-10-22
      action: feed_searched
      summary: >-
        ESB ecars' network page, FAQs and essential driver information page, and ESB's
        sitemap, were read, and no open data feed or route for requesting open data was
        found for Northern Ireland.
      quote: >-
        ESB also operates and maintains the public charge point network for electric vehicle
        drivers in Northern Ireland.
      evidence_url: https://esb.ie/what-we-do/ecars/our-network
    - date: 2026-10-26
      action: key_granted
      channel: email
      summary: >-
        Eco-Movement sent a token for ESB ecars' PCPR data by email, alongside tokens
        for other networks whose requests are passed to it. No separate request for
        ESB ecars is recorded here. The token is kept as a GitHub Actions secret.
      evidence_file: evidence/esb_ecars/2026-10-26-token-email.md
access_requested: null
access_granted: 2026-10-26
sources:
  - url: https://esb.ie/what-we-do/ecars/our-network
    note: >-
      ESB ecars' network page (read 2026-10-22). Describes a Levelling Up Fund programme to
      replace all existing fast and rapid chargers in Northern Ireland, and points drivers
      in Great Britain to esbenergy.co.uk/EV.
  - url: https://esb.ie/what-we-do/ecars/faqs
    note: >-
      ESB ecars' FAQs (read 2026-10-22). Gives VAT of 20% on charging in Northern Ireland. No
      open data answer.
  - url: https://esb.ie/what-we-do/ecars/essential-ev-driver-information
    note: >-
      ESB ecars' essential driver information page (read 2026-10-22). Has sections on its
      networks in Northern Ireland and in Great Britain. No open data link.
  - url: https://www.legislation.gov.uk/uksi/2023/1168/regulation/1/made
    note: >-
      Regulation 1(2) of the Public Charge Point Regulations 2023 (read 2026-10-22): "These
      Regulations extend to England and Wales, Scotland and Northern Ireland."
findings:
  - date: 2026-10-29
    kind: spec_conformance
    summary: >-
      Every energy price gives VAT 20, and all 9 are whole pence as published (75p and
      61p per kWh); with VAT added as OCPI 2.2.1 says, 0.75 would be 90p.
    handling: >-
      By the repository owner's decision of 2026-10-29 recorded in vat_in_price, the
      stated VAT is read as already in each price, so it is not added again. This is
      inferred from the figures and needs confirming by ESB ecars. The tariffs are
      published unchanged.
    evidence_url: https://open-chargepoints.com/api/ocpi/cpo/2.2.1/tariffs/
notes: >-
  Its regulation 10 data is served by Eco-Movement's PCPR API (eco_movement_pcpr adapter),
  with a token Eco-Movement sent on 2026-10-26, kept as the GitHub Actions secret
  ESB_ECARS_TOKEN. Every response on 2026-10-29 linked to a next page past the last
  record, which the adapter does not follow. Eco-Movement's user guide says it creates the
  location ids and may change them when it merges locations. On 2026-10-29 the feed
  reported 125 locations and 3 tariffs. ESB ecars and ESB Energy share the OCPI party GB
  ESB, each with its own token.
enabled: true
