# yaml-language-server: $schema=schema.json
id: raw_charging
display_name: RAW Charging
ocpi_country_code: GB
ocpi_party_id: CPI # Confirmed from the feed's own country_code and party_id on 2026-10-29.
adapter: eco_movement_pcpr
base_url: unknown
endpoints:
  locations:
    url: https://open-chargepoints.com/api/ocpi/cpo/2.2.1/locations/
    status: documented
    note: >-
      Confirmed in Eco-Movement's PCPR API reference on 2026-10-07. Written with the trailing
      slash, as in the user guide's example request and the getting started page's paging
      link (read 2026-10-26); without it the server answered HTTP 307 on 2026-10-29.
  tariffs:
    url: https://open-chargepoints.com/api/ocpi/cpo/2.2.1/tariffs/
    status: documented
  statuses:
    url: https://open-chargepoints.com/api/statuses
    status: documented
auth:
  method: header
  name: Authorization
  scheme: Token
  secret_name: RAW_CHARGING_TOKEN
rate_limit:
  min_seconds_between_requests: 125
  limits:
    - publisher: Eco-Movement
      requests: 30
      per_seconds: 3600
      endpoint: locations
      quote: The `locations` endpoint has a rate limit of 30 requests per 1 hour.
      source_url: https://developers.eco-movement.com/v2.2.1/reference/get-all-locations-pcpr-api
      checked: 2026-10-26
    - publisher: Eco-Movement
      requests: 30
      per_seconds: 3600
      endpoint: locations
      scope: single location
      quote: The `locations/{id}` endpoint has a rate limit of 30 requests per 1 hour.
      source_url: https://developers.eco-movement.com/v2.2.1/reference/get-specific-location-pcpr-api
      checked: 2026-10-26
    - publisher: Eco-Movement
      requests: 30
      per_seconds: 3600
      endpoint: tariffs
      quote: The `tariffs` endpoint has a rate limit of 30 requests per 1 hour.
      source_url: https://developers.eco-movement.com/reference/get-tariffs-pcpr-api
      checked: 2026-10-26
    - publisher: Eco-Movement
      requests: 1
      per_seconds: 30
      endpoint: statuses
      quote: The `statuses` endpoint has a rate limit of 1 request per 30 seconds.
      source_url: https://developers.eco-movement.com/reference/get-statuses-pcpr-api
      checked: 2026-10-26
  limits_checked: 2026-10-26
  notes: >-
    By the repository owner's decisions of 2026-10-29 the limits are read as applying to
    each network's own token (limits_per_key) and as an allowance rather than a spacing
    (limits_as_allowance). With this network's token, no period of an hour and a second
    holds more than 29 requests to an endpoint limited to 30 an hour, and each request
    starts at least 2 seconds after the last one finished. At most 5 requests are sent to
    open-chargepoints.com at the same time, whichever network they are for, started at
    least 1 second apart. Any retry, wait the server asks for or refusal puts every
    network back to a gap of 125 seconds (the 120 seconds the strictest limit needs, plus
    a safety margin) and one request at a time for the rest of the run. Eco-Movement
    "strongly recommends limiting simultaneous GET requests to a maximum of 5". It
    recommends retrieving the entire dataset once a day.
limits_per_key:
  decided: 2026-10-29
  basis: >-
    Eco-Movement publishes a limit of 30 requests an hour for each of the locations and
    tariffs endpoints and gives each network its own token, but does not say whether the
    limits count per token or per address. The repository owner decided on 2026-10-29
    that they are read as applying to each token, so each network keeps its own 125
    second gap, while requests to open-chargepoints.com are still sent one at a time.
  evidence_url: https://developers.eco-movement.com/v2.2.1/docs/eco-movement-pcpr-api-user-guide
limits_as_allowance:
  decided: 2026-10-29
  basis: >-
    Eco-Movement publishes its limits as a number of requests an hour (30 for each of the
    locations and tariffs endpoints) and does not say they must be spread evenly. The
    repository owner decided on 2026-10-29 that each network's token may use that
    allowance close together once a day, as the whole dataset fits within it (the largest
    network, ubitricity, took 14 requests on 2026-10-29), keeping one request in hand as
    the margin.
  at_once: 5
  at_once_source: >-
    Eco-Movement's PCPR API user guide "strongly recommends limiting simultaneous GET
    requests to a maximum of 5". It does not say whether that counts per token or in
    total; the owner chose 5 in total, which keeps within either reading.
  evidence_url: https://developers.eco-movement.com/v2.2.1/docs/eco-movement-pcpr-api-user-guide
supports_single_location: unknown
cors: unknown
attribution: >-
  Contains data from RAW Charging published under the Public Charge Point Regulations 2023,
  used in line with the Open Government Licence v3.0.
licence:
  name: OGL-3.0
  url: https://www.nationalarchives.gov.uk/doc/open-government-licence/version/3/
  basis: >-
    RAW Charging's own site has no open data page (read 2026-10-10). Its data was requested
    through ChargePoint's "PCPR Data Request" Google form, which names no licence, terms,
    key or rate limit (read 2026-10-10 and 2026-10-23). Eco-Movement's email of 2026-10-26
    with the token, and its PCPR API user guide and reference (read 2026-10-26), state no
    licence or terms either. Regulation 10(5) of the Public Charge Point Regulations 2023
    requires the data to be available "without any requirement to agree to terms and
    conditions regarding the use of that data", and the DfT guidance says "Data must be open
    in line with the Open Government Licence". On 2026-10-10 the repository owner decided,
    as a standing rule for operators whose data has no terms of its own, that such operators
    can be switched on without asking again.
  checked: 2026-10-29
vat_not_stated:
  decided: 2026-10-29
  basis: >-
    RAW Charging's tariffs on Eco-Movement's PCPR API gave no VAT rate on any price on
    2026-10-29. Of the 67 energy prices in GBP, 55 come to whole pence once 20% is added
    (for example 0.6417 pounds per kWh becomes 77p), while 31 are whole pence as
    published. This suggests prices with VAT at 20%, the UK standard rate on public
    charging, taken off; that is inferred from the figures, not stated by RAW Charging.
    The repository owner decided on 2026-10-29 that VAT at 20% is added, so prices on
    the map all include VAT and can be compared.
  evidence_url: https://open-chargepoints.com/api/ocpi/cpo/2.2.1/tariffs/
  add_percent: 20
engagement:
  status: key_on_request
  evidence:
    - date: 2026-10-10
      url: https://rawcharging.com/news/article/new-government-ev-charging-regulations-faqs
      note: >-
        RAW Charging's FAQ article on the charging regulations describes reporting data to
        government. It gives no open data feed and no route for requesting open data.
    - date: 2026-10-26
      file: evidence/raw_charging/2026-10-26-token-email.md
      note: >-
        Eco-Movement's email with an expiring link to this network's token for its PCPR
        API, sent as an "Authorization: Token" header to its OCPI 2.2.1 endpoints. The
        token itself is not kept here.
  log:
    - date: 2026-10-10
      action: feed_searched
      summary: >-
        RAW Charging's home page, sitemap, driver support page, Legal Information page and two
        articles on the regulations were read and its /open-data, /opendata and /pcpr
        addresses were tried, and no open data feed or route for requesting open data was
        found.
      quote: We manage all necessary data reporting to government authorities.
      evidence_url: https://rawcharging.com/news/article/new-government-ev-charging-regulations-faqs
    - date: 2026-10-23
      action: request_sent
      channel: web_form
      summary: >-
        Requested access to Raw Charging's PCPR data through ChargePoint's Google form (one submission for this network), which is shared with Eco-Movement.
    - date: 2026-10-26
      action: key_granted
      channel: email
      summary: >-
        Eco-Movement sent a token for this network's PCPR data by email, through an
        expiring link, to be sent as an "Authorization: Token" header to its OCPI
        2.2.1 endpoints. The token is kept as a GitHub Actions secret.
      evidence_file: evidence/raw_charging/2026-10-26-token-email.md
access_requested: 2026-10-23
access_granted: 2026-10-26
sources:
  - url: https://rawcharging.com/
    note: >-
      RAW Charging's home page (read 2026-10-10). Links Driver Support, News and Legal
      Information; no open data or regulations link.
  - url: https://rawcharging.com/sitemap.xml
    note: >-
      RAW Charging's sitemap (read 2026-10-10). Lists 158 pages; none is an open data, OCPI
      or data request page.
  - url: https://rawcharging.com/driver-support
    note: >-
      RAW Charging's driver support page (read 2026-10-10). Covers using the ChargePoint app,
      how to charge and roaming partners; no open data link.
  - url: https://rawcharging.com/news/article/new-government-ev-charging-regulations-faqs
    note: >-
      RAW Charging's "New Government EV Charging Regulations - FAQs" article (read
      2026-10-10). Covers data reporting to government; no open data feed.
  - url: https://rawcharging.com/news/article/what-do-the-new-ev-charging-regulations-mean-for-hospitality-leisure-and-retail-businesses
    note: >-
      RAW Charging's article "What do the new EV charging regulations mean for Hospitality,
      Leisure and Retail businesses?" (read 2026-10-10). Covers reliability, support, pricing
      and contactless payment; no open data feed or request route.
  - url: https://rawcharging.com/legal-information
    note: >-
      RAW Charging's Legal Information page (read 2026-10-10). Its "Public Charge Point
      Regulations" section covers reliability only; no open data feed or request route.
  - url: https://rawcharging.com/open-data
    note: Tried 2026-10-10. Shows RAW Charging's "Not Found" page.
  - url: https://rawcharging.com/opendata
    note: Tried 2026-10-10. Shows RAW Charging's "Not Found" page.
  - url: https://rawcharging.com/pcpr
    note: Tried 2026-10-10. Shows RAW Charging's "Not Found" page.
findings:
  - date: 2026-10-29
    kind: data_quality
    summary: >-
      No price gives a VAT rate. 55 of the 67 energy prices in GBP come to whole pence
      once 20% is added, and 31 as published.
    handling: >-
      By the repository owner's decision of 2026-10-29 recorded in vat_not_stated, VAT
      at 20% is added to every price that gives no VAT rate, and the price says this
      project added it. Reading the prices as excluding VAT is inferred from the
      figures and needs confirming by RAW Charging. The tariffs are published
      unchanged.
    evidence_url: https://open-chargepoints.com/api/ocpi/cpo/2.2.1/tariffs/
  - date: 2026-10-29
    kind: data_quality
    summary: >-
      1 tariff in US dollars, with every price zero, is the only tariff named by 29
      connectors at 8 locations.
    handling: >-
      Only GBP tariffs are shown, so these connectors show "Price unknown". Nothing is
      converted.
    evidence_url: https://open-chargepoints.com/api/ocpi/cpo/2.2.1/tariffs/
  - date: 2026-10-29
    kind: data_quality
    summary: >-
      One location gives time_zone "Atlantic/St_Helena", although it is in Great
      Britain, where the time zone is Europe/London.
    handling: >-
      The time zone is not used on the map, which shows every time in UK time. Nothing
      is changed.
    evidence_url: https://open-chargepoints.com/api/ocpi/cpo/2.2.1/locations/
notes: >-
  Its regulation 10 data is served by Eco-Movement's PCPR API (eco_movement_pcpr adapter),
  with a token Eco-Movement sent on 2026-10-26, kept as the GitHub Actions secret
  RAW_CHARGING_TOKEN. Every response on 2026-10-29 linked to a next page past the last
  record, which the adapter does not follow. Eco-Movement's user guide says it creates the
  location ids and may change them when it merges locations. On 2026-10-29 the feed
  reported 514 locations and 59 tariffs. It uses the OCPI party GB CPI of ChargePoint's
  platform, as do ChargePoint and evpoint.
enabled: true
