# yaml-language-server: $schema=schema.json
id: raw_charging
display_name: RAW Charging
ocpi_country_code: unknown
ocpi_party_id: unknown
adapter: eco_movement_pcpr
base_url: unknown
endpoints:
  locations:
    url: https://open-chargepoints.com/api/ocpi/cpo/2.2.1/locations
    status: documented
    note: Confirmed in Eco-Movement's PCPR API reference on 2026-10-07.
  tariffs:
    url: https://open-chargepoints.com/api/ocpi/cpo/2.2.1/tariffs
    status: documented
  statuses:
    url: https://open-chargepoints.com/api/statuses
    status: documented
auth:
  method: header
  name: Authorization
  scheme: Token
  secret_name: RAW_CHARGING_TOKEN
rate_limit:
  min_seconds_between_requests: 125
  limits:
    - publisher: Eco-Movement
      requests: 30
      per_seconds: 3600
      endpoint: locations
      quote: The `locations` endpoint has a rate limit of 30 requests per 1 hour.
      source_url: https://developers.eco-movement.com/v2.2.1/reference/get-all-locations-pcpr-api
      checked: 2026-10-26
    - publisher: Eco-Movement
      requests: 30
      per_seconds: 3600
      endpoint: locations
      scope: single location
      quote: The `locations/{id}` endpoint has a rate limit of 30 requests per 1 hour.
      source_url: https://developers.eco-movement.com/v2.2.1/reference/get-specific-location-pcpr-api
      checked: 2026-10-26
    - publisher: Eco-Movement
      requests: 30
      per_seconds: 3600
      endpoint: tariffs
      quote: The `tariffs` endpoint has a rate limit of 30 requests per 1 hour.
      source_url: https://developers.eco-movement.com/reference/get-tariffs-pcpr-api
      checked: 2026-10-26
    - publisher: Eco-Movement
      requests: 1
      per_seconds: 30
      endpoint: statuses
      quote: The `statuses` endpoint has a rate limit of 1 request per 30 seconds.
      source_url: https://developers.eco-movement.com/reference/get-statuses-pcpr-api
      checked: 2026-10-26
  limits_checked: 2026-10-26
  notes: >-
    One gap of 125 seconds (the 120 seconds the strictest limit needs, plus a safety
    margin) is kept between any two requests to open-chargepoints.com, shared by every
    operator served from it, so this project sends it at most 29 requests in any hour.
    Requests are sent one at a time; Eco-Movement "strongly recommends limiting
    simultaneous GET requests to a maximum of 5". It recommends retrieving the entire
    dataset once a day.
supports_single_location: unknown
cors: unknown
attribution: null
licence: null
engagement:
  status: key_on_request
  evidence:
    - date: 2026-10-10
      url: https://rawcharging.com/news/article/new-government-ev-charging-regulations-faqs
      note: >-
        RAW Charging's FAQ article on the charging regulations describes reporting data to
        government. It gives no open data feed and no route for requesting open data.
    - date: 2026-10-26
      file: evidence/raw_charging/2026-10-26-token-email.md
      note: >-
        Eco-Movement's email with an expiring link to this network's token for its PCPR
        API, sent as an "Authorization: Token" header to its OCPI 2.2.1 endpoints. The
        token itself is not kept here.
  log:
    - date: 2026-10-10
      action: feed_searched
      summary: >-
        RAW Charging's home page, sitemap, driver support page, Legal Information page and two
        articles on the regulations were read and its /open-data, /opendata and /pcpr
        addresses were tried, and no open data feed or route for requesting open data was
        found.
      quote: We manage all necessary data reporting to government authorities.
      evidence_url: https://rawcharging.com/news/article/new-government-ev-charging-regulations-faqs
    - date: 2026-10-23
      action: request_sent
      channel: web_form
      summary: >-
        Requested access to Raw Charging's PCPR data through ChargePoint's Google form (one submission for this network), which is shared with Eco-Movement.
    - date: 2026-10-26
      action: key_granted
      channel: email
      summary: >-
        Eco-Movement sent a token for this network's PCPR data by email, through an
        expiring link, to be sent as an "Authorization: Token" header to its OCPI
        2.2.1 endpoints. The token is kept as a GitHub Actions secret.
      evidence_file: evidence/raw_charging/2026-10-26-token-email.md
access_requested: 2026-10-23
access_granted: 2026-10-26
sources:
  - url: https://rawcharging.com/
    note: >-
      RAW Charging's home page (read 2026-10-10). Links Driver Support, News and Legal
      Information; no open data or regulations link.
  - url: https://rawcharging.com/sitemap.xml
    note: >-
      RAW Charging's sitemap (read 2026-10-10). Lists 158 pages; none is an open data, OCPI
      or data request page.
  - url: https://rawcharging.com/driver-support
    note: >-
      RAW Charging's driver support page (read 2026-10-10). Covers using the ChargePoint app,
      how to charge and roaming partners; no open data link.
  - url: https://rawcharging.com/news/article/new-government-ev-charging-regulations-faqs
    note: >-
      RAW Charging's "New Government EV Charging Regulations - FAQs" article (read
      2026-10-10). Covers data reporting to government; no open data feed.
  - url: https://rawcharging.com/news/article/what-do-the-new-ev-charging-regulations-mean-for-hospitality-leisure-and-retail-businesses
    note: >-
      RAW Charging's article "What do the new EV charging regulations mean for Hospitality,
      Leisure and Retail businesses?" (read 2026-10-10). Covers reliability, support, pricing
      and contactless payment; no open data feed or request route.
  - url: https://rawcharging.com/legal-information
    note: >-
      RAW Charging's Legal Information page (read 2026-10-10). Its "Public Charge Point
      Regulations" section covers reliability only; no open data feed or request route.
  - url: https://rawcharging.com/open-data
    note: Tried 2026-10-10. Shows RAW Charging's "Not Found" page.
  - url: https://rawcharging.com/opendata
    note: Tried 2026-10-10. Shows RAW Charging's "Not Found" page.
  - url: https://rawcharging.com/pcpr
    note: Tried 2026-10-10. Shows RAW Charging's "Not Found" page.
findings: []
notes: >-
  No open data feed or request route was found on RAW Charging's own website on 2026-10-10.
  ChargePoint's own PCPR data request form (see the chargepoint file, read 2026-10-10) lists
  Raw Charging among the networks whose data can be requested; RAW Charging's site does not
  link that form, so whether it is its route needs confirming.
  A written request could ask RAW Charging where its open data under regulation 10 is
  published.
  On 2026-10-26 Eco-Movement sent a token for this network's data on its PCPR API, so it
  uses the eco_movement_pcpr adapter. What the token returns needs testing with one
  recorded fetch before the network is switched on.
enabled: false
