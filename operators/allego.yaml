# yaml-language-server: $schema=schema.json
id: allego
display_name: Allego
ocpi_country_code: GB
ocpi_party_id: ALL # Confirmed from the feed's own country_code and party_id on 2026-10-29.
adapter: eco_movement_pcpr
base_url: unknown
endpoints:
  locations:
    url: https://open-chargepoints.com/api/ocpi/cpo/2.2.1/locations/
    status: documented
    note: >-
      Confirmed in Eco-Movement's PCPR API reference on 2026-10-07. Written with the trailing
      slash, as in the user guide's example request and the getting started page's paging
      link (read 2026-10-26); without it the server answered HTTP 307 on 2026-10-29.
  tariffs:
    url: https://open-chargepoints.com/api/ocpi/cpo/2.2.1/tariffs/
    status: documented
  statuses:
    url: https://open-chargepoints.com/api/statuses
    status: documented
auth:
  method: header
  name: Authorization
  scheme: Token
  secret_name: ALLEGO_TOKEN
rate_limit:
  min_seconds_between_requests: 125
  limits:
    - publisher: Eco-Movement
      requests: 30
      per_seconds: 3600
      endpoint: locations
      quote: The `locations` endpoint has a rate limit of 30 requests per 1 hour.
      source_url: https://developers.eco-movement.com/v2.2.1/reference/get-all-locations-pcpr-api
      checked: 2026-10-26
    - publisher: Eco-Movement
      requests: 30
      per_seconds: 3600
      endpoint: locations
      scope: single location
      quote: The `locations/{id}` endpoint has a rate limit of 30 requests per 1 hour.
      source_url: https://developers.eco-movement.com/v2.2.1/reference/get-specific-location-pcpr-api
      checked: 2026-10-26
    - publisher: Eco-Movement
      requests: 30
      per_seconds: 3600
      endpoint: tariffs
      quote: The `tariffs` endpoint has a rate limit of 30 requests per 1 hour.
      source_url: https://developers.eco-movement.com/reference/get-tariffs-pcpr-api
      checked: 2026-10-26
    - publisher: Eco-Movement
      requests: 1
      per_seconds: 30
      endpoint: statuses
      quote: The `statuses` endpoint has a rate limit of 1 request per 30 seconds.
      source_url: https://developers.eco-movement.com/reference/get-statuses-pcpr-api
      checked: 2026-10-26
  limits_checked: 2026-10-26
  notes: >-
    One gap of 125 seconds (the 120 seconds the strictest limit needs, plus a safety
    margin) is kept between any two requests to open-chargepoints.com, shared by every
    operator served from it, so this project sends it at most 29 requests in any hour.
    Requests are sent one at a time; Eco-Movement "strongly recommends limiting
    simultaneous GET requests to a maximum of 5". It recommends retrieving the entire
    dataset once a day.
supports_single_location: unknown
cors: unknown
attribution: >-
  Contains data from Allego published under the Public Charge Point Regulations 2023, used
  in line with the Open Government Licence v3.0.
licence:
  name: OGL-3.0
  url: https://www.nationalarchives.gov.uk/doc/open-government-licence/version/3/
  basis: >-
    Allego's Charge Point Data page and its request form (read 2026-10-10) state no licence
    or terms for the data; the form's only agreement box is to Allego's privacy policy.
    Eco-Movement's email of 2026-10-26 with the token, and its PCPR API user guide and
    reference (read 2026-10-26), state no licence or terms either. Regulation 10(5) of the
    Public Charge Point Regulations 2023 requires the data to be available "without any
    requirement to agree to terms and conditions regarding the use of that data", and the
    DfT guidance says "Data must be open in line with the Open Government Licence". On
    2026-10-10 the repository owner decided, as a standing rule for operators whose data has
    no terms of its own, that such operators can be switched on without asking again.
  checked: 2026-10-29
vat_not_stated:
  decided: 2026-10-29
  basis: >-
    Allego's three tariffs on Eco-Movement's PCPR API gave no VAT rate on 2026-10-29.
    One gives an energy price of 0.525 pounds per kWh with the text "Energy: 0.63
    GBP/kWh", and another 0.7 pounds with "Energy: 0.84 GBP/kWh": each text price is the
    feed price with 20% added, the UK standard rate of VAT on public charging. All three
    energy prices come to whole pence once 20% is added. That the prices exclude VAT is
    inferred from the figures, not stated by Allego. The repository owner decided on
    2026-10-29 that VAT at 20% is added, so prices on the map all include VAT and can be
    compared.
  evidence_url: https://open-chargepoints.com/api/ocpi/cpo/2.2.1/tariffs/
  add_percent: 20
engagement:
  status: key_on_request
  evidence:
    - date: 2026-10-10
      url: https://www.allego.eu/charge-point-data/
      note: >-
        Allego's "Charge Point Data" page has a "Request charge point data" form asking for a
        name, company name, email address, planned use of data and agreement to its privacy
        policy. It does not say how the data is delivered or whether a key is issued.
    - date: 2026-10-26
      file: evidence/allego/2026-10-26-token-email.md
      note: >-
        Eco-Movement's email with an expiring link to this network's token for its PCPR
        API, sent as an "Authorization: Token" header to its OCPI 2.2.1 endpoints. The
        token itself is not kept here.
  log:
    - date: 2026-10-10
      action: feed_searched
      summary: >-
        Allego's home page has no open data link, and its page sitemap lists a "Charge Point
        Data" page.
      evidence_url: https://www.allego.eu/page-sitemap.xml
    - date: 2026-10-10
      action: page_checked
      summary: >-
        Allego's Charge Point Data page was read; it offers a form for requesting charge point
        data and names no key, licence, data terms or rate limit.
      quote: Request charge point data
      evidence_url: https://www.allego.eu/charge-point-data/
    - date: 2026-10-23
      action: request_sent
      channel: web_form
      summary: >-
        Requested access to Allego's PCPR data through its charge point data form.
    - date: 2026-10-26
      action: key_granted
      channel: email
      summary: >-
        Eco-Movement sent a token for this network's PCPR data by email, through an
        expiring link, to be sent as an "Authorization: Token" header to its OCPI
        2.2.1 endpoints. The token is kept as a GitHub Actions secret.
      evidence_file: evidence/allego/2026-10-26-token-email.md
access_requested: 2026-10-23
access_granted: 2026-10-26
sources:
  - url: https://www.allego.eu/
    note: Allego's home page (read 2026-10-10). No open data or charge point data link.
  - url: https://www.allego.eu/page-sitemap.xml
    note: >-
      Allego's page sitemap (read 2026-10-10), reached from its sitemap index. Lists the
      Charge Point Data page.
  - url: https://www.allego.eu/charge-point-data/
    note: >-
      Allego's "Charge Point Data" page (read 2026-10-10). Request form, and a statement of
      its network's reliability for 2025 (99.016%).
findings:
  - date: 2026-10-29
    kind: data_quality
    summary: >-
      No price gives a VAT rate. The tariff text gives each energy price with 20%
      added (0.525 pounds per kWh and "Energy: 0.63 GBP/kWh").
    handling: >-
      By the repository owner's decision of 2026-10-29 recorded in vat_not_stated, VAT
      at 20% is added to every price that gives no VAT rate, and the price says this
      project added it. Reading the prices as excluding VAT is inferred from the
      figures and needs confirming by Allego. The tariffs are published unchanged.
    evidence_url: https://open-chargepoints.com/api/ocpi/cpo/2.2.1/tariffs/
  - date: 2026-10-29
    kind: spec_conformance
    summary: >-
      240 EVSEs give parking_restrictions as a single string, such as
      "ev_only,plugged", where OCPI 2.2.1 has a list of values.
    handling: >-
      The value is not read and the EVSE's parking restrictions are shown as unknown.
      Nothing else in the record changes.
    evidence_url: https://open-chargepoints.com/api/ocpi/cpo/2.2.1/locations/
  - date: 2026-10-29
    kind: data_quality
    summary: >-
      Every connector gives max_electric_power 0, which OCPI 2.2.1 defines as the
      connector's maximum power in watts.
    handling: >-
      A power of 0 is not shown. As for any connector with no power figure, its power
      is worked out from max_voltage and max_amperage, which Eco-Movement's
      documentation says it validates and corrects.
    evidence_url: https://open-chargepoints.com/api/ocpi/cpo/2.2.1/locations/
notes: >-
  Its regulation 10 data is served by Eco-Movement's PCPR API (eco_movement_pcpr adapter),
  with a token Eco-Movement sent on 2026-10-26, kept as the GitHub Actions secret
  ALLEGO_TOKEN. Every response on 2026-10-29 linked to a next page past the last record,
  which the adapter does not follow. Eco-Movement's user guide says it creates the
  location ids and may change them when it merges locations. On 2026-10-29 the feed
  reported 77 locations and 3 tariffs.
enabled: true
