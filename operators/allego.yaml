# yaml-language-server: $schema=schema.json
id: allego
display_name: Allego
ocpi_country_code: unknown
ocpi_party_id: unknown
adapter: eco_movement_pcpr
base_url: unknown
endpoints:
  locations:
    url: https://open-chargepoints.com/api/ocpi/cpo/2.2.1/locations
    status: documented
    note: Confirmed in Eco-Movement's PCPR API reference on 2026-10-07.
  tariffs:
    url: https://open-chargepoints.com/api/ocpi/cpo/2.2.1/tariffs
    status: documented
  statuses:
    url: https://open-chargepoints.com/api/statuses
    status: documented
auth:
  method: header
  name: Authorization
  scheme: Token
  secret_name: ALLEGO_TOKEN
rate_limit:
  min_seconds_between_requests: 125
  limits:
    - publisher: Eco-Movement
      requests: 30
      per_seconds: 3600
      endpoint: locations
      quote: The `locations` endpoint has a rate limit of 30 requests per 1 hour.
      source_url: https://developers.eco-movement.com/v2.2.1/reference/get-all-locations-pcpr-api
      checked: 2026-10-26
    - publisher: Eco-Movement
      requests: 30
      per_seconds: 3600
      endpoint: locations
      scope: single location
      quote: The `locations/{id}` endpoint has a rate limit of 30 requests per 1 hour.
      source_url: https://developers.eco-movement.com/v2.2.1/reference/get-specific-location-pcpr-api
      checked: 2026-10-26
    - publisher: Eco-Movement
      requests: 30
      per_seconds: 3600
      endpoint: tariffs
      quote: The `tariffs` endpoint has a rate limit of 30 requests per 1 hour.
      source_url: https://developers.eco-movement.com/reference/get-tariffs-pcpr-api
      checked: 2026-10-26
    - publisher: Eco-Movement
      requests: 1
      per_seconds: 30
      endpoint: statuses
      quote: The `statuses` endpoint has a rate limit of 1 request per 30 seconds.
      source_url: https://developers.eco-movement.com/reference/get-statuses-pcpr-api
      checked: 2026-10-26
  limits_checked: 2026-10-26
  notes: >-
    One gap of 125 seconds (the 120 seconds the strictest limit needs, plus a safety
    margin) is kept between any two requests to open-chargepoints.com, shared by every
    operator served from it, so this project sends it at most 29 requests in any hour.
    Requests are sent one at a time; Eco-Movement "strongly recommends limiting
    simultaneous GET requests to a maximum of 5". It recommends retrieving the entire
    dataset once a day.
supports_single_location: unknown
cors: unknown
attribution: null
licence: null
engagement:
  status: key_on_request
  evidence:
    - date: 2026-10-10
      url: https://www.allego.eu/charge-point-data/
      note: >-
        Allego's "Charge Point Data" page has a "Request charge point data" form asking for a
        name, company name, email address, planned use of data and agreement to its privacy
        policy. It does not say how the data is delivered or whether a key is issued.
    - date: 2026-10-26
      file: evidence/allego/2026-10-26-token-email.md
      note: >-
        Eco-Movement's email with an expiring link to this network's token for its PCPR
        API, sent as an "Authorization: Token" header to its OCPI 2.2.1 endpoints. The
        token itself is not kept here.
  log:
    - date: 2026-10-10
      action: feed_searched
      summary: >-
        Allego's home page has no open data link, and its page sitemap lists a "Charge Point
        Data" page.
      evidence_url: https://www.allego.eu/page-sitemap.xml
    - date: 2026-10-10
      action: page_checked
      summary: >-
        Allego's Charge Point Data page was read; it offers a form for requesting charge point
        data and names no key, licence, data terms or rate limit.
      quote: Request charge point data
      evidence_url: https://www.allego.eu/charge-point-data/
    - date: 2026-10-23
      action: request_sent
      channel: web_form
      summary: >-
        Requested access to Allego's PCPR data through its charge point data form.
    - date: 2026-10-26
      action: key_granted
      channel: email
      summary: >-
        Eco-Movement sent a token for this network's PCPR data by email, through an
        expiring link, to be sent as an "Authorization: Token" header to its OCPI
        2.2.1 endpoints. The token is kept as a GitHub Actions secret.
      evidence_file: evidence/allego/2026-10-26-token-email.md
access_requested: 2026-10-23
access_granted: 2026-10-26
sources:
  - url: https://www.allego.eu/
    note: Allego's home page (read 2026-10-10). No open data or charge point data link.
  - url: https://www.allego.eu/page-sitemap.xml
    note: >-
      Allego's page sitemap (read 2026-10-10), reached from its sitemap index. Lists the
      Charge Point Data page.
  - url: https://www.allego.eu/charge-point-data/
    note: >-
      Allego's "Charge Point Data" page (read 2026-10-10). Request form, and a statement of
      its network's reliability for 2025 (99.016%).
findings: []
notes: >-
  Access could be requested through the form on Allego's Charge Point Data page, which its
  page sitemap lists but its home page does not link. How the data is delivered, whether a
  key is issued and what licence applies are unknown.
  On 2026-10-26 Eco-Movement sent a token for this network's data on its PCPR API, so it
  uses the eco_movement_pcpr adapter. What the token returns needs testing with one
  recorded fetch before the network is switched on.
enabled: false
