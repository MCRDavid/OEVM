      Immingham".
findings: []
notes: >-
  A public charging network for heavy-duty electric trucks, with a first UK hub at
  Immingham. Its site gives its company as Commercial Vehicle Charging Europe B.V. Its PCPR
  data is requested through a form shared with Eco-Movement, like the other networks whose
  data Eco-Movement hosts, so a token would be read with the eco_movement_pcpr adapter. The
  form says the data covers only stations suitable for trucks. No request has been sent.
