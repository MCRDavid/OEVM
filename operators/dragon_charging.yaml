      action: feed_searched
      summary: >-
        Checked this project's published map for Dragon Charging's places on 2026-11-20.
        Clenergy EV's feed has 8 points in the Pembrokeshire area and none at the Dragon
        location names checked (Tenby, Narberth, Crymych, St Davids, County Hall Haverfordwest),
