findings: []
notes: >-
  Found through the EV Roam ID register on 2026-10-23 (operator ID GB*DGN; the OCPI country and
  party codes stay unknown until read from a feed). Its own site, dragoncharging.co.uk ("EV
  charging in Wales"), lists 139 locations, mostly in Pembrokeshire and South West Wales, and
  says its customers can also use Clenergy chargers; its driver portal appears to run on
  Clenergy's platform (inferred from its link to Clenergy's app). Its sites are very likely
  not in Clenergy EV's feed (inferred, 2026-11-20). The next step is a written request
  through its contact page, asking where its regulation 10 data is published.
