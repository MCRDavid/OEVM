# yaml-language-server: $schema=schema.json
id: shell_recharge
display_name: Shell Recharge
ocpi_country_code: GB
ocpi_party_id: TNM # Confirmed from the feed's own country_code and party_id on 2026-10-29.
adapter: eco_movement_pcpr
base_url: unknown
endpoints:
  locations:
    url: https://open-chargepoints.com/api/ocpi/cpo/2.2.1/locations/
    status: documented
    note: >-
      Confirmed in Eco-Movement's PCPR API reference on 2026-10-07. Written with the trailing
      slash, as in the user guide's example request and the getting started page's paging
      link (read 2026-10-26); without it the server answered HTTP 307 on 2026-10-29.
  tariffs:
    url: https://open-chargepoints.com/api/ocpi/cpo/2.2.1/tariffs/
    status: documented
  statuses:
    url: https://open-chargepoints.com/api/statuses
    status: documented
auth:
  method: header
  name: Authorization
  scheme: Token
  secret_name: SHELL_RECHARGE_TOKEN
rate_limit:
  min_seconds_between_requests: 125
  limits:
    - publisher: Eco-Movement
      requests: 30
      per_seconds: 3600
      endpoint: locations
      quote: The `locations` endpoint has a rate limit of 30 requests per 1 hour.
      source_url: https://developers.eco-movement.com/v2.2.1/reference/get-all-locations-pcpr-api
      checked: 2026-10-26
    - publisher: Eco-Movement
      requests: 30
      per_seconds: 3600
      endpoint: locations
      scope: single location
      quote: The `locations/{id}` endpoint has a rate limit of 30 requests per 1 hour.
      source_url: https://developers.eco-movement.com/v2.2.1/reference/get-specific-location-pcpr-api
      checked: 2026-10-26
    - publisher: Eco-Movement
      requests: 30
      per_seconds: 3600
      endpoint: tariffs
      quote: The `tariffs` endpoint has a rate limit of 30 requests per 1 hour.
      source_url: https://developers.eco-movement.com/reference/get-tariffs-pcpr-api
      checked: 2026-10-26
    - publisher: Eco-Movement
      requests: 1
      per_seconds: 30
      endpoint: statuses
      quote: The `statuses` endpoint has a rate limit of 1 request per 30 seconds.
      source_url: https://developers.eco-movement.com/reference/get-statuses-pcpr-api
      checked: 2026-10-26
  limits_checked: 2026-10-26
  notes: >-
    A gap of 125 seconds (the 120 seconds the strictest limit needs, plus a safety
    margin) is kept between any two requests with this network's token, so at most 29
    requests in any hour are sent with it. By the repository owner's decision of
    2026-10-29 (limits_per_key) the limits are read as applying to each token. Requests
    to open-chargepoints.com are still sent one at a time, at least 2 seconds apart
    whichever network they are for, and a request from the server to wait holds back
    every network on it. Eco-Movement "strongly recommends limiting simultaneous GET
    requests to a maximum of 5". It recommends retrieving the entire dataset once a day.
limits_per_key:
  decided: 2026-10-29
  basis: >-
    Eco-Movement publishes a limit of 30 requests an hour for each of the locations and
    tariffs endpoints and gives each network its own token, but does not say whether the
    limits count per token or per address. The repository owner decided on 2026-10-29
    that they are read as applying to each token, so each network keeps its own 125
    second gap, while requests to open-chargepoints.com are still sent one at a time.
  evidence_url: https://developers.eco-movement.com/v2.2.1/docs/eco-movement-pcpr-api-user-guide
supports_single_location: supported
cors: needs_testing
attribution: >-
  Contains data from Shell Recharge published under the Public Charge Point Regulations
  2023, used in line with the Open Government Licence v3.0.
licence:
  name: OGL-3.0
  url: https://www.nationalarchives.gov.uk/doc/open-government-licence/version/3/
  basis: >-
    Shell's open data request page and its Public Charge Point Regulations page (read in
    a browser by the repository owner on 2026-10-09) carry a request form that names no
    licence, terms, key, agreement or rate limit. Eco-Movement's email of 2026-10-28
    with the token, and its PCPR API user guide and reference (read 2026-10-26), state
    no licence or terms either. Regulation 10(5) of the Public Charge Point Regulations
    2023 requires the data to be available "without any requirement to agree to terms
    and conditions regarding the use of that data", and the DfT guidance says "Data must
    be open in line with the Open Government Licence". On 2026-10-10 the repository
    owner decided, as a standing rule for operators whose data has no terms of its own,
    that such operators can be switched on without asking again.
  checked: 2026-10-29
vat_not_stated:
  decided: 2026-10-29
  basis: >-
    Shell Recharge's 308 tariffs on Eco-Movement's PCPR API gave no VAT rate on
    2026-10-29. Its energy prices are 0.7417, 0.6583, 0.7083, 0.575 and 0.625 pounds per
    kWh, which are 89p, 79p, 85p, 69p and 75p with 20% added, the UK standard rate of
    VAT on public charging. That the prices exclude VAT is inferred from the figures,
    not stated by Shell. The repository owner decided on 2026-10-29 that VAT at 20% is
    added, so prices on the map all include VAT and can be compared.
  evidence_url: https://open-chargepoints.com/api/ocpi/cpo/2.2.1/tariffs/
  add_percent: 20
engagement:
  status: key_on_request
  evidence:
    - date: 2026-10-09
      url: https://www.shell.co.uk/electric-vehicle-charging/shell-recharge-open-data-request.html
      note: >-
        Read in a browser by the repository owner. A request form asks for contact details,
        organisation, the network wanted and the planned use, and names no licence, terms,
        key, agreement or rate limit.
    - date: 2026-10-28
      file: evidence/shell_recharge/2026-10-28-token-email.md
      note: >-
        Eco-Movement's email with an expiring link to a note holding tokens for Shell
        Recharge and ubitricity, in reply to the request for all Shell networks. The token
        itself is not kept here.
  log:
    - date: 2026-10-09
      action: page_checked
      summary: >-
        Shell's open data request page and its Public Charge Point Regulations page were
        read in a browser by the repository owner. Both carry the same request form, which
        asks which network the data is for and says the request is passed to
        Eco-Movement. Data is to be provided in a suitable format after review.
      quote: >-
        Your request will be shared with Eco-Movement, who will act on behalf of Shell, to
        fulfil your request.
      evidence_url: https://www.shell.co.uk/electric-vehicle-charging/public-charge-point-regulations.html
    - date: 2026-10-23
      action: request_sent
      channel: web_form
      summary: >-
        Requested access to PCPR data for all Shell networks through Shell's open data request form (choice "All Networks").
    - date: 2026-10-28
      action: key_granted
      channel: email
      summary: >-
        Eco-Movement sent tokens for Shell Recharge and ubitricity by email, through an
        expiring link, in reply to the request for all Shell networks; none was given for
        Community by Shell Recharge. The Shell Recharge token is kept as a GitHub Actions
        secret.
      evidence_file: evidence/shell_recharge/2026-10-28-token-email.md
access_requested: 2026-10-23
access_granted: 2026-10-28
sources:
  - url: https://wiki.openstreetmap.org/wiki/EV_charge_points_in_the_United_Kingdom
    note: The blueprint cites this page for this operator using Eco-Movement's PCPR API.
  - url: https://developers.eco-movement.com/reference/get-tariffs-pcpr-api
    note: Tariffs endpoint and its rate limit.
  - url: https://developers.eco-movement.com/reference/get-statuses-pcpr-api
    note: Statuses endpoint and its rate limit.
  - url: https://developers.eco-movement.com/reference/locations-pcpr-api
    note: Locations overview; recommends retrieving the entire dataset once a day.
  - url: https://developers.eco-movement.com/v2.2.1/reference/get-all-locations-pcpr-api
    note: Locations endpoint URL and its rate limit (read 2026-10-07).
  - url: https://developers.eco-movement.com/v2.2.1/reference/get-specific-location-pcpr-api
    note: >-
      Fetching a single location by id, and its rate limit. The blueprint linked
      /reference/get-specific-location, which is Eco-Movement's separate paid Data API.
  - url: https://developers.eco-movement.com/v2.2.1/reference/getting-started-pcpr-api
    note: 'Authentication: each request adds an "Authorization: Token <token>" header.'
  - url: https://developers.eco-movement.com/v2.2.1/docs/eco-movement-pcpr-api-user-guide
    note: At most 5 simultaneous requests; date_from and date_to described for locations only.
  - url: https://www.shell.co.uk/electric-vehicle-charging/shell-recharge-open-data-request.html
    note: >-
      Shell UK page titled "Public Charge Point Regulations", described as "Request data on
      Shell Recharge including location and usage of our charge points". Its main content
      loads with a script; the repository owner read it in a browser on 2026-10-09 (see
      engagement), and the token it led to covers this operator (2026-10-28).
findings:
  - date: 2026-10-29
    kind: data_quality
    summary: >-
      No price gives a VAT rate. The energy prices are 0.7417, 0.6583, 0.7083, 0.575
      and 0.625 pounds per kWh, which are 89p, 79p, 85p, 69p and 75p with 20% added.
    handling: >-
      By the repository owner's decision of 2026-10-29 recorded in vat_not_stated, VAT
      at 20% is added to every price that gives no VAT rate, and the price says this
      project added it. Reading the prices as excluding VAT is inferred from the
      figures and needs confirming by Shell. The tariffs are published unchanged.
    evidence_url: https://open-chargepoints.com/api/ocpi/cpo/2.2.1/tariffs/
  - date: 2026-10-29
    kind: data_quality
    summary: >-
      Each tariff's text gives its energy price before VAT, rounded to the penny, such
      as "ALL: £0.74 per kWh" for a price of 0.7417 pounds per kWh. 238 of the 308
      tariffs also have a parking price of 0, restricted to times when the power is 0.
    handling: >-
      The text is passed on as published; the map's price comes from the price
      components, with VAT added as above.
    evidence_url: https://open-chargepoints.com/api/ocpi/cpo/2.2.1/tariffs/
  - date: 2026-10-07
    kind: documentation
    summary: >-
      Eco-Movement's PCPR API documentation gives two different defaults for the page size
      (1000 on the getting started page, 1 in the endpoint reference), and its user guide
      says date_from works for locations only while the tariffs reference lists it.
    handling: This project will always send an explicit page size and test date_from before relying on it.
    evidence_url: https://developers.eco-movement.com/v2.2.1/reference/getting-started-pcpr-api
  - date: 2026-10-07
    kind: documentation
    summary: >-
      The rate limits are published, but the documentation does not say whether they
      apply per key or per address, what kind of time window is used, or what response
      is sent when a limit is reached.
    handling: >-
      Until 2026-10-29 this project assumed the strictest reading: one allowance
      shared by every endpoint and every operator on this host, so 125 seconds between
      any two requests to it. Since then, by the repository owner's decision recorded
      in limits_per_key, each token keeps its own 125 second gap, shared by its
      endpoints, with requests to the host still sent one at a time.
    evidence_url: https://developers.eco-movement.com/v2.2.1/docs/eco-movement-pcpr-api-user-guide
notes: >-
  Its regulation 10 data is served by Eco-Movement's PCPR API (eco_movement_pcpr adapter),
  with a token Eco-Movement sent on 2026-10-28 in reply to the request for all Shell
  networks, kept as the GitHub Actions secret SHELL_RECHARGE_TOKEN. The same note held a
  token for ubitricity, whose own token of 2026-10-26 is used, and none for Community by
  Shell Recharge. The response on 2026-10-29 linked to a next page past the last record,
  which the adapter does not follow. On 2026-10-29 the feed reported 266 locations and 308
  tariffs.
enabled: true
