# yaml-language-server: $schema=schema.json
id: bp_pulse
display_name: bp pulse
ocpi_country_code: GB
ocpi_party_id: BPC # Confirmed from the feed's own country_code and party_id on 2026-10-30.
adapter: eco_movement_pcpr
base_url: unknown
endpoints:
  locations:
    url: https://open-chargepoints.com/api/ocpi/cpo/2.2.1/locations/
    status: documented
    note: >-
      Confirmed in Eco-Movement's PCPR API reference on 2026-10-07. Written with the trailing
      slash, as in the user guide's example request and the getting started page's paging
      link (read 2026-10-26); without it the server answered HTTP 307 on 2026-10-29.
  tariffs:
    url: https://open-chargepoints.com/api/ocpi/cpo/2.2.1/tariffs/
    status: documented
  statuses:
    url: https://open-chargepoints.com/api/statuses
    status: documented
auth:
  method: header
  name: Authorization
  scheme: Token
  secret_name: BP_PULSE_TOKEN
rate_limit:
  min_seconds_between_requests: 125
  limits:
    - publisher: Eco-Movement
      requests: 30
      per_seconds: 3600
      endpoint: locations
      quote: The `locations` endpoint has a rate limit of 30 requests per 1 hour.
      source_url: https://developers.eco-movement.com/v2.2.1/reference/get-all-locations-pcpr-api
      checked: 2026-10-26
    - publisher: Eco-Movement
      requests: 30
      per_seconds: 3600
      endpoint: locations
      scope: single location
      quote: The `locations/{id}` endpoint has a rate limit of 30 requests per 1 hour.
      source_url: https://developers.eco-movement.com/v2.2.1/reference/get-specific-location-pcpr-api
      checked: 2026-10-26
    - publisher: Eco-Movement
      requests: 30
      per_seconds: 3600
      endpoint: tariffs
      quote: The `tariffs` endpoint has a rate limit of 30 requests per 1 hour.
      source_url: https://developers.eco-movement.com/reference/get-tariffs-pcpr-api
      checked: 2026-10-26
    - publisher: Eco-Movement
      requests: 1
      per_seconds: 30
      endpoint: statuses
      quote: The `statuses` endpoint has a rate limit of 1 request per 30 seconds.
      source_url: https://developers.eco-movement.com/reference/get-statuses-pcpr-api
      checked: 2026-10-26
  limits_checked: 2026-10-26
  notes: >-
    By the repository owner's decisions of 2026-10-29 the limits are read as applying to
    each network's own token (limits_per_key) and as an allowance rather than a spacing
    (limits_as_allowance). With this network's token, no period of an hour and a second
    holds more than 29 requests to an endpoint limited to 30 an hour, and each request
    starts at least 2 seconds after the last one finished. At most 5 requests are sent to
    open-chargepoints.com at the same time, whichever network they are for, started at
    least 1 second apart. Any retry, wait the server asks for or refusal puts every
    network back to a gap of 125 seconds (the 120 seconds the strictest limit needs, plus
    a safety margin) and one request at a time for the rest of the run. Eco-Movement
    "strongly recommends limiting simultaneous GET requests to a maximum of 5". It
    recommends retrieving the entire dataset once a day.
limits_per_key:
  decided: 2026-10-29
  basis: >-
    Eco-Movement publishes a limit of 30 requests an hour for each of the locations and
    tariffs endpoints and gives each network its own token, but does not say whether the
    limits count per token or per address. The repository owner decided on 2026-10-29
    that they are read as applying to each token, so each network keeps its own 125
    second gap, while requests to open-chargepoints.com are still sent one at a time.
  evidence_url: https://developers.eco-movement.com/v2.2.1/docs/eco-movement-pcpr-api-user-guide
limits_as_allowance:
  decided: 2026-10-29
  basis: >-
    Eco-Movement publishes its limits as a number of requests an hour (30 for each of the
    locations and tariffs endpoints) and does not say they must be spread evenly. The
    repository owner decided on 2026-10-29 that each network's token may use that
    allowance close together once a day, as the whole dataset fits within it (the largest
    network, ubitricity, took 14 requests on 2026-10-29), keeping one request in hand as
    the margin.
  at_once: 5
  at_once_source: >-
    Eco-Movement's PCPR API user guide "strongly recommends limiting simultaneous GET
    requests to a maximum of 5". It does not say whether that counts per token or in
    total; the owner chose 5 in total, which keeps within either reading.
  evidence_url: https://developers.eco-movement.com/v2.2.1/docs/eco-movement-pcpr-api-user-guide
supports_single_location: supported
cors: needs_testing
attribution: >-
  Contains data from bp pulse published under the Public Charge Point Regulations 2023, used
  in line with the Open Government Licence v3.0.
licence:
  name: OGL-3.0
  url: https://www.nationalarchives.gov.uk/doc/open-government-licence/version/3/
  basis: >-
    bp pulse's Public Charge Point Regulations help page (read in a browser by the
    repository owner on 2026-10-09) links to a request form that names no licence, terms,
    key, agreement or rate limit. bp pulse's email of 2026-10-30 with the token, and
    Eco-Movement's PCPR API user guide and reference (read 2026-10-26), state no licence or
    terms either. bp pulse's website legal notice (providers/README.md) is general website
    terms, which, as for GeniePoint, Mer UK and Arnold Clark Charge, the repository owner
    reads as not covering data published under the regulations.
    Regulation 10(5) of the Public Charge Point Regulations 2023 requires the data to be
    available "without any requirement to agree to terms and conditions regarding the use
    of that data", and the DfT guidance says "Data must be open in line with the Open
    Government Licence". On 2026-10-10 the repository owner decided, as a standing rule for
    operators whose data has no terms of its own, that such operators can be switched on
    without asking again.
  checked: 2026-10-30
vat_not_stated:
  decided: 2026-10-30
  basis: >-
    bp pulse's 5 tariffs on Eco-Movement's PCPR API gave no VAT rate on 2026-10-30. Its
    energy prices are 0.542 and 0.742 pounds per kWh, which are 65p and 89p with 20% added,
    the UK standard rate of VAT on public charging, to the nearest penny. bp pulse's own
    site page for a charger in Slough (read 2026-10-30) lists pay as you go prices of
    "£0.65" for "Fast (AC 7kW)" and "£0.79 - £0.93" for "Rapid (AC 43kW / DC 50kW)",
    without saying whether VAT is included. That the feed's prices exclude VAT is inferred
    from the figures, not stated by bp pulse. The repository owner decided on 2026-10-30
    that VAT at 20% is added, so prices on the map all include VAT and can be compared.
  evidence_url: https://open-chargepoints.com/api/ocpi/cpo/2.2.1/tariffs/
  add_percent: 20
engagement:
  status: key_on_request
  evidence:
    - date: 2026-10-09
      url: https://www.bppulse.com/en-gb/help-and-support/public-ev-charging/public-charge-point-regulations
      note: >-
        Read in a browser by the repository owner. bp pulse's FAQ uses a request form, which
        names no licence, terms, key, agreement or rate limit.
    - date: 2026-10-30
      file: evidence/bp_pulse/2026-10-30-token-email.md
      note: >-
        bp pulse's email with a token for Eco-Movement's PCPR API, in reply to the request
        of 2026-10-23. It names no licence, terms or contract. The token itself is not kept
        here.
  log:
    - date: 2026-10-09
      action: page_checked
      summary: >-
        bp pulse's Public Charge Point Regulations FAQ was read in a browser by the
        repository owner. It links to a request form asking for a name, email address and,
        optionally, organisation and purpose. The form mentions no key, licence, terms,
        agreement or rate limit.
      quote: >-
        Once received we will process your request and will contact you to provide
        instruction on how you can gain access to this data in a machine readable format
      evidence_url: https://www.bppulse.com/en-gb/help-and-support/public-ev-charging/public-charge-point-regulations
    - date: 2026-10-23
      action: request_sent
      channel: web_form
      summary: >-
        Requested access to bp pulse's PCPR data through the form linked from its Public Charge Point Regulations help page.
    - date: 2026-10-30
      action: key_granted
      channel: email
      summary: >-
        bp pulse sent a token for Eco-Movement's PCPR API by email, written in the email
        itself, in reply to the request of 2026-10-23, with a link to Eco-Movement's PCPR
        API user guide. The token is kept as a GitHub Actions secret.
      evidence_file: evidence/bp_pulse/2026-10-30-token-email.md
access_requested: 2026-10-23
access_granted: 2026-10-30
sources:
  - url: https://wiki.openstreetmap.org/wiki/EV_charge_points_in_the_United_Kingdom
    note: The blueprint cites this page for this operator using Eco-Movement's PCPR API.
  - url: https://developers.eco-movement.com/reference/get-tariffs-pcpr-api
    note: Tariffs endpoint and its rate limit.
  - url: https://developers.eco-movement.com/reference/get-statuses-pcpr-api
    note: Statuses endpoint and its rate limit.
  - url: https://developers.eco-movement.com/reference/locations-pcpr-api
    note: Locations overview; recommends retrieving the entire dataset once a day.
  - url: https://developers.eco-movement.com/v2.2.1/reference/get-all-locations-pcpr-api
    note: Locations endpoint URL and its rate limit (read 2026-10-07).
  - url: https://developers.eco-movement.com/v2.2.1/reference/get-specific-location-pcpr-api
    note: >-
      Fetching a single location by id, and its rate limit. The blueprint linked
      /reference/get-specific-location, which is Eco-Movement's separate paid Data API.
  - url: https://developers.eco-movement.com/v2.2.1/reference/getting-started-pcpr-api
    note: 'Authentication: each request adds an "Authorization: Token <token>" header.'
  - url: https://developers.eco-movement.com/v2.2.1/docs/eco-movement-pcpr-api-user-guide
    note: At most 5 simultaneous requests; date_from and date_to described for locations only.
findings:
  - date: 2026-10-30
    kind: data_quality
    summary: >-
      No price gives a VAT rate. The energy prices are 0.542 and 0.742 pounds per kWh,
      which are 65p and 89p with 20% added, to the nearest penny. bp pulse's own site page
      for a charger in Slough lists pay as you go prices of "£0.65" for "Fast (AC 7kW)"
      and "£0.79 - £0.93" for "Rapid (AC 43kW / DC 50kW)".
    handling: >-
      By the repository owner's decision of 2026-10-30 recorded in vat_not_stated, VAT
      at 20% is added to every price that gives no VAT rate, and the price says this
      project added it. Reading the prices as excluding VAT is inferred from the
      figures and needs confirming by bp pulse. The tariffs are published unchanged.
    evidence_url: https://open-chargepoints.com/api/ocpi/cpo/2.2.1/tariffs/
  - date: 2026-10-30
    kind: data_quality
    summary: >-
      Tariff 1 gives a flat price of 0 and no other price. On 2026-10-30 it was named by
      15 connectors at 6 of the 1,136 locations, with names such as "New Cross Gate
      Depot", "Langlands Court Council Depot" and "Uniper Cottam Development Centre Power
      Station".
    handling: >-
      These connectors show "Free", as the feed gives no charge. On 2026-10-30 the
      repository owner decided they are shown as published, rather than as "Price
      unknown". Whether drivers pay nothing at these sites needs confirming by bp pulse.
    evidence_url: https://open-chargepoints.com/api/ocpi/cpo/2.2.1/tariffs/
  - date: 2026-10-30
    kind: data_quality
    summary: >-
      The feed holds two kinds of location record. 696 of the 1,136 locations have
      numeric ids, EVSE ids beginning GB*BPC*, time_zone "UTC" and no opening times, and
      every connector gives max_electric_power 0. The other 440 have longer ids, EVSE ids
      beginning GB*BPP* (6 EVSEs AT*HTB*), suboperator "bp pulse", time_zone
      Europe/London and opening times of 24 hours, give each connector's power, and name
      no tariff for any connector.
    handling: >-
      Both are shown. Where max_electric_power is 0 the power is worked out from
      max_voltage and max_amperage, as for any connector with no power figure. Connectors
      that name no tariff show "Price unknown"; no price is guessed. The time zone is not
      used on the map, which shows every time in UK time.
    evidence_url: https://open-chargepoints.com/api/ocpi/cpo/2.2.1/locations/
  - date: 2026-10-30
    kind: data_quality
    summary: >-
      Of the 4,794 EVSEs on 2026-10-30, 1,089 gave the status INOPERATIVE and 634
      OUTOFORDER. At 267 of the 1,136 locations every EVSE gave one of the two (199 of
      the 696 locations with numeric ids, 68 of the other 440).
    handling: >-
      The statuses are shown as published, dated, and both are shown as reported out of
      service. Whether some of these chargers have been removed is not known.
    evidence_url: https://open-chargepoints.com/api/ocpi/cpo/2.2.1/locations/
  - date: 2026-10-30
    kind: data_quality
    summary: >-
      Two connectors give figures that do not fit their type: one Type 1
      (IEC_62196_T1) connector gives power_type DC at 400 V and 16 A, and one Type 2
      single-phase connector gives 0 A.
    handling: >-
      Both are shown as published. The DC Type 1 connector's power is worked out as
      6.4 kW; the 0 A connector's power is unknown.
    evidence_url: https://open-chargepoints.com/api/ocpi/cpo/2.2.1/locations/
  - date: 2026-10-30
    kind: data_quality
    summary: >-
      33 locations (70 EVSEs, in and around London) have names beginning "[E-TAXI
      ONLY]", such as "[E-TAXI ONLY] Mill Hill East Station Car Park". No parking
      restriction or other field in the feed says they are for taxis only.
    handling: >-
      By the repository owner's decision of 2026-10-30 (ADR 0023, amended), "taxi only"
      is one of the name phrases in pipeline/access.py, so these locations are hidden on
      the map unless a visitor asks to see private and restricted chargers, and listed on
      the feed health page. The data is published unchanged.
    evidence_url: https://open-chargepoints.com/api/ocpi/cpo/2.2.1/locations/
  - date: 2026-10-30
    kind: data_quality
    summary: >-
      Two locations are named "IDIADA (PRIVATE)" and "IDIADA bp pulse (PRIVATE)".
    handling: >-
      They are hidden on the map unless a visitor asks to see private and restricted
      chargers, by the name phrases in pipeline/access.py (ADR 0023), and listed on the
      feed health page.
    evidence_url: https://open-chargepoints.com/api/ocpi/cpo/2.2.1/locations/
  - date: 2026-10-07
    kind: documentation
    summary: >-
      Eco-Movement's PCPR API documentation gives two different defaults for the page size
      (1000 on the getting started page, 1 in the endpoint reference), and its user guide
      says date_from works for locations only while the tariffs reference lists it.
    handling: This project will always send an explicit page size and test date_from before relying on it.
    evidence_url: https://developers.eco-movement.com/v2.2.1/reference/getting-started-pcpr-api
  - date: 2026-10-07
    kind: documentation
    summary: >-
      The rate limits are published, but the documentation does not say whether they
      apply per key or per address, what kind of time window is used, or what response
      is sent when a limit is reached.
    handling: >-
      Until 2026-10-29 this project assumed the strictest reading: one allowance
      shared by every endpoint and every operator on this host, so 125 seconds between
      any two requests to it. Since then, by the repository owner's decision recorded
      in limits_per_key, each token keeps its own 125 second gap, shared by its
      endpoints, with requests to the host still sent one at a time.
    evidence_url: https://developers.eco-movement.com/v2.2.1/docs/eco-movement-pcpr-api-user-guide
notes: >-
  Its regulation 10 data is served by Eco-Movement's PCPR API (eco_movement_pcpr adapter),
  with a token bp pulse sent on 2026-10-30, kept as the GitHub Actions secret
  BP_PULSE_TOKEN. The responses on 2026-10-30 linked to a next page past the last record,
  which the adapter does not follow. On 2026-10-30 the feed reported 1,136 locations (two
  pages of up to 1,000) and 5 tariffs. Before then no bp pulse location was on the map
  through another feed.
enabled: true
