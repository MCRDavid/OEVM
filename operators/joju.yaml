  log:
    - date: 2026-10-10
      action: feed_searched
      summary: >-
        Joju's website could not be read by this project's automated checks on 2026-10-10 (a
        failed secure connection, then HTTP 503), so its open data route is not yet known; it
        needs checking in a browser.
      evidence_url: https://jojucharging.com/
    - date: 2026-10-11
      action: page_checked
      summary: >-
        Read in a browser: jojucharging.com failed to connect securely and joju.co.uk redirects to
        Joju Solar. A Joju Solar post says "Our Joju installed charge points, running on the Mer
        network, have hit a 10 million kWh milestone". No open data page was found in its sitemap.
      evidence_url: https://www.jojusolar.co.uk/a-10-million-kwh-milestone-joju-and-mer-ev-charging/
    - date: 2026-10-23
      action: feed_searched
      summary: >-
        Checked Mer UK's open data feed (https://uk.mer.eco/wp-json/ozev/v1/data) for Joju sites.
        It held 175 locations, all with operator "Mer" and suboperator "Mer Fleet Services Ltd".
        No owner, operator, name or other field mentions Joju, and only 2 locations have London
        postcodes. It has no Portsmouth or Eastleigh (Hampshire) locations, where a browser check
        the same day found Joju runs public chargers. So Joju's own Hampshire network is not in
        Mer UK's feed; whether any other Joju-installed chargers are in it is unknown.
      evidence_url: https://uk.mer.eco/live-charge-point-data/
