# yaml-language-server: $schema=schema.json
id: chargy
display_name: char.gy
ocpi_country_code: GB
ocpi_party_id: CGY # Confirmed from the feed's own country_code and party_id on 2026-10-07.
adapter: ocpi_221
base_url: https://char.gy/open-ocpi
endpoints:
  locations:
    url: https://char.gy/open-ocpi/locations
    status: documented
  tariffs:
    url: https://char.gy/open-ocpi/tariffs
    status: documented
auth:
  method: none
  name: null
  secret_name: null
rate_limit:
  min_seconds_between_requests: 4
  limits: []
  limits_checked: 2026-10-07
  notes: >-
    char.gy's open data page states no rate limit. The gap is this project's own choice:
    2 seconds until 8 October 2026, then 6 seconds after the feed refused requests from
    GitHub's servers part-way through the first daily run (see findings). Lowered to 4
    seconds on 9 October 2026 by the repository owner's decision, to shorten the daily
    run; if the feed refuses requests again, the gap goes back to 6 seconds.
supports_single_location: needs_testing
cors: not_supported
attribution: >-
  Contains data from char.gy published under the Public Charge Point Regulations 2023,
  used in line with the Open Government Licence v3.0.
licence:
  name: OGL-3.0
  url: https://www.nationalarchives.gov.uk/doc/open-government-licence/version/3/
  basis: >-
    char.gy publishes this data to meet the Public Charge Point Regulations 2023. DfT's
    guidance (updated 21 October 2024) says "Data must be open in line with the Open
    Government Licence". char.gy's open data page states no other licence or terms for
    the data.
  checked: 2026-10-07
nonstandard_statuses:
  decided: 2026-10-09
  basis: >-
    char.gy publishes EVSE statuses as WORKING and FAULTED, which are not OCPI 2.2.1
    values. Regulation 10(6)(a) uses "working" to mean an OCPI status of available,
    charging or reserved, so WORKING is shown as working, free or in use not stated, and
    never as available. FAULTED is shown as reported out of service. The repository owner
    chose this reading.
  evidence_url: https://char.gy/open-ocpi/locations
  statuses:
    WORKING: working
    FAULTED: out_of_order
engagement:
  status: open_anonymous
  evidence:
    - date: 2026-10-06
      url: https://help.char.gy/support/solutions/articles/77000576948-public-charge-point-regulations-2023
    - date: 2026-10-07
      url: https://help.char.gy/support/solutions/articles/77000576948-public-charge-point-regulations-2023
      note: Re-checked. The page still lists the open locations and tariffs endpoints.
access_requested: null
access_granted: null
sources:
  - url: https://help.char.gy/support/solutions/articles/77000576948-public-charge-point-regulations-2023
    note: >-
      Read 2026-10-07. Gives the host https://char.gy, the locations path
      /open-ocpi/locations and the tariffs path /open-ocpi/tariffs, and points to the OCPI
      standard. States no licence, terms or rate limits.
findings:
  - date: 2026-10-07
    kind: spec_conformance
    summary: >-
      EVSE statuses are published as WORKING, and in a live run on 2026-10-07 also as
      FAULTED. Neither is a value in the OCPI 2.2.1 Status list.
    handling: >-
      Shown as status unknown rather than guessed until 2026-10-09. Since then, by the
      repository owner's decision recorded in nonstandard_statuses, WORKING is shown as
      "Working (free or in use, not stated)", never as available, because regulation
      10(6)(a) uses "working" to mean an OCPI status of available, charging or reserved.
      FAULTED is shown as reported out of service.
    evidence_url: https://char.gy/open-ocpi/locations
  - date: 2026-10-07
    kind: data_quality
    summary: >-
      Tariffs are published in three currencies (EUR, USD and GBP). Locations refer only
      to the GBP tariff.
    handling: >-
      Only GBP prices are shown, in pence per kWh, which is how regulation 10(6)(d)(iv)
      describes the price in reference data. Other currencies show as price unknown and are
      never converted.
    evidence_url: https://char.gy/open-ocpi/tariffs
  - date: 2026-10-07
    kind: data_quality
    summary: >-
      Tariff price components give no VAT figure. OCPI 2.2.1 says an omitted VAT means no
      VAT is applicable.
    handling: >-
      VAT is not guessed. Prices are shown as published, which OCPI defines as excluding
      VAT, and marked "excluding VAT, VAT not stated".
    evidence_url: https://char.gy/open-ocpi/tariffs
  - date: 2026-10-07
    kind: access
    summary: >-
      The feed sends no Access-Control-Allow-Origin header, so web browsers cannot read
      it directly.
    handling: The map will use data fetched by the pipeline, not requests from visitors' browsers.
    evidence_url: https://char.gy/open-ocpi/locations
  - date: 2026-10-08
    kind: access
    summary: >-
      In the first daily run from a GitHub Actions runner, the locations feed answered
      HTTP 403 to the request for offset 2900, after 58 pages had been fetched about 2.8
      seconds apart. The same request answered normally from another network the same
      evening. The server returns at most 50 locations a page, so a full fetch takes about
      120 requests for locations alone.
    handling: >-
      char.gy was left out of that run. The gap between requests was raised from 2 to 6
      seconds the same day, and the next run (37856014933, the same evening) fetched every
      page and published 5,948 locations.
    evidence_url: https://github.com/MCRDavid/OEVM/actions/runs/37853739264
    status: resolved
    resolved_date: 2026-10-08
  - date: 2026-10-09
    kind: access
    summary: >-
      A one-off full fetch made on 2026-10-09 to check coordinates, from a network other
      than GitHub's and with the 4 second gap, was answered HTTP 403 for offset 2700, after
      54 pages. The daily run of the same day fetched every page.
    handling: >-
      The check stopped there and was not retried. All of char.gy's mapped locations were
      checked from the published map instead. The one location left off the map in that
      day's run (listed in that run's manifest) could not be looked at and needs
      checking in a later run. The daily run's gap is unchanged, since the owner's rule is
      about refusals in the daily run.
    evidence_url: https://char.gy/open-ocpi/locations
notes: >-
  Paging uses the OCPI 2.2.1 Link, X-Total-Count and X-Limit headers. Fetching a single
  location by id needs testing.
enabled: true
