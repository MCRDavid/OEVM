# yaml-language-server: $schema=schema.json
id: gridserve
display_name: Gridserve
ocpi_country_code: unknown
ocpi_party_id: unknown
adapter: gridserve
base_url: https://api.gridserve.com/ocpi/v1/
endpoints:
  locations:
    url: https://api.gridserve.com/ocpi/v1/locations
    status: documented
    note: Also GET /locations/{location-id} for one location.
  tariffs:
    url: https://api.gridserve.com/ocpi/v1/tariffs
    status: documented
auth:
  method: header
  name: ec-subscription-key
  secret_name: GRIDSERVE_SUBSCRIPTION_KEY
rate_limit:
  min_seconds_between_requests: 31
  limits:
    - publisher: Gridserve
      requests: 1
      per_seconds: 30
      endpoint: all
      quote: The default API call limit is 1 request per 30 seconds per API key.
      source_url: https://www.gridserve.com/legal-area/open-data-api-terms-and-conditions/
      checked: 2026-10-08
  limits_checked: 2026-10-08
  notes: >-
    Gridserve's API Fair Use Policy sets the limit above, says "Default rate limits are set
    to 1 call every 30 seconds", and says limits may change. This project waits 31 seconds
    between any two requests to the host (30 seconds plus a safety margin). The developer
    documentation (version 1.0, November 2024) states no limit.
supports_single_location: supported
cors: needs_testing
attribution: null
licence:
  name: OGL-3.0
  url: https://www.nationalarchives.gov.uk/doc/open-government-licence/version/3/
  basis: >-
    Gridserve's API Fair Use Policy (read 2026-10-08) says that by using the API you agree
    to be bound by it, that intellectual property in the API and the API Data remains
    Gridserve's, and that the API Data contains confidential and proprietary information.
    It also says users must not copy the API or observe, study or test how it works, except
    as far as the law allows. DfT's guidance says "Data must be open in line with the Open
    Government Licence", and regulation 10(5) requires the data to be available without
    any requirement to agree to terms on its use. On 2026-10-09 the repository owner
    decided that the regulations take priority over the policy's terms for the data, so
    the data is used in line with the Open Government Licence, without first writing to
    Gridserve.
  checked: 2026-10-08
engagement:
  status: key_on_request
  evidence:
    - date: 2026-10-08
      url: https://www.gridserve.com/open-data/
      note: >-
        The page offers a form to request an API key. The form asks the requester to
        confirm they have read and agree to Gridserve's API access and fair use terms.
access_requested: null
access_granted: null
sources:
  - url: https://www.gridserve.com/wp-content/uploads/2024/11/GRIDSERVE-PCPR-API-Developer-Documentation.pdf
    note: >-
      Developer documentation, version 1.0, November 2024, read 2026-10-07. Gives the base
      URL, the ec-subscription-key header and GET /locations, /locations/{location-id} and
      /tariffs. States no rate limit and no licence or terms.
  - url: https://www.gridserve.com/open-data/
    note: Read 2026-10-08. A form to request an API key, which links to the API Fair Use Policy.
  - url: https://www.gridserve.com/legal-area/open-data-api-terms-and-conditions/
    note: >-
      API Fair Use Policy, read 2026-10-08 (the page says it was last modified on
      2026-06-19). Gives the default rate limit and the terms summarised in the licence
      section.
findings:
  - date: 2026-10-07
    kind: documentation
    summary: >-
      The developer documentation's example responses put results under "locations",
      "location" or "tariffs" keys, while OCPI 2.2.1 responses put them in a "data" field.
    handling: The adapter will be written against real responses, recorded as fixtures, not the examples.
    evidence_url: https://www.gridserve.com/wp-content/uploads/2024/11/GRIDSERVE-PCPR-API-Developer-Documentation.pdf
  - date: 2026-10-07
    kind: documentation
    summary: >-
      The developer documentation lists location-id under "Headers", although the endpoint
      is written as GET /locations/{location-id}.
    handling: Noted for when the adapter is built; the path form will be tested first.
    evidence_url: https://www.gridserve.com/wp-content/uploads/2024/11/GRIDSERVE-PCPR-API-Developer-Documentation.pdf
  - date: 2026-10-08
    kind: documentation
    summary: >-
      The API Fair Use Policy sets a default limit of 1 request per 30 seconds per API key;
      the developer documentation (version 1.0, November 2024) states no limit.
    handling: >-
      This project follows the published limit with a safety margin: 31 seconds between
      requests.
    evidence_url: https://www.gridserve.com/legal-area/open-data-api-terms-and-conditions/
  - date: 2026-10-08
    kind: access
    summary: >-
      Keys are requested through a form that asks the requester to agree to the API Fair
      Use Policy. The policy says intellectual property in the API Data remains Gridserve's
      and describes the data as confidential and proprietary.
    handling: >-
      On 2026-10-09 the repository owner decided that regulation 10(5) takes priority
      over the policy's terms for the data, and that the project goes ahead without first
      writing to Gridserve. The policy's rate limit is still followed. The operator stays
      switched off until a key is granted and the adapter is built.
    evidence_url: https://www.gridserve.com/legal-area/open-data-api-terms-and-conditions/
notes: >-
  Keys are requested through the form on Gridserve's open data page, which needs
  agreement to the API Fair Use Policy. The repository owner's decision on the terms for
  the data is in the licence section.
enabled: false
