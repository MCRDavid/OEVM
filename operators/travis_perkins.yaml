# yaml-language-server: $schema=schema.json
id: travis_perkins
display_name: Travis Perkins
ocpi_country_code: GB
ocpi_party_id: GFX # Confirmed from the feed's own country_code and party_id on 2026-10-29.
adapter: eco_movement_pcpr
base_url: unknown
endpoints:
  locations:
    url: https://open-chargepoints.com/api/ocpi/cpo/2.2.1/locations/
    status: documented
    note: >-
      Confirmed in Eco-Movement's PCPR API reference on 2026-10-07. Written with the trailing
      slash, as in the user guide's example request and the getting started page's paging
      link (read 2026-10-26); without it the server answered HTTP 307 on 2026-10-29.
  tariffs:
    url: https://open-chargepoints.com/api/ocpi/cpo/2.2.1/tariffs/
    status: documented
  statuses:
    url: https://open-chargepoints.com/api/statuses
    status: documented
auth:
  method: header
  name: Authorization
  scheme: Token
  secret_name: TRAVIS_PERKINS_TOKEN
rate_limit:
  min_seconds_between_requests: 125
  limits:
    - publisher: Eco-Movement
      requests: 30
      per_seconds: 3600
      endpoint: locations
      quote: The `locations` endpoint has a rate limit of 30 requests per 1 hour.
      source_url: https://developers.eco-movement.com/v2.2.1/reference/get-all-locations-pcpr-api
      checked: 2026-10-26
    - publisher: Eco-Movement
      requests: 30
      per_seconds: 3600
      endpoint: locations
      scope: single location
      quote: The `locations/{id}` endpoint has a rate limit of 30 requests per 1 hour.
      source_url: https://developers.eco-movement.com/v2.2.1/reference/get-specific-location-pcpr-api
      checked: 2026-10-26
    - publisher: Eco-Movement
      requests: 30
      per_seconds: 3600
      endpoint: tariffs
      quote: The `tariffs` endpoint has a rate limit of 30 requests per 1 hour.
      source_url: https://developers.eco-movement.com/reference/get-tariffs-pcpr-api
      checked: 2026-10-26
    - publisher: Eco-Movement
      requests: 1
      per_seconds: 30
      endpoint: statuses
      quote: The `statuses` endpoint has a rate limit of 1 request per 30 seconds.
      source_url: https://developers.eco-movement.com/reference/get-statuses-pcpr-api
      checked: 2026-10-26
  limits_checked: 2026-10-26
  notes: >-
    A gap of 125 seconds (the 120 seconds the strictest limit needs, plus a safety
    margin) is kept between any two requests with this network's token, so at most 29
    requests in any hour are sent with it. By the repository owner's decision of
    2026-10-29 (limits_per_key) the limits are read as applying to each token. Requests
    to open-chargepoints.com are still sent one at a time, at least 2 seconds apart
    whichever network they are for, and a request from the server to wait holds back
    every network on it. Eco-Movement "strongly recommends limiting simultaneous GET
    requests to a maximum of 5". It recommends retrieving the entire dataset once a day.
limits_per_key:
  decided: 2026-10-29
  basis: >-
    Eco-Movement publishes a limit of 30 requests an hour for each of the locations and
    tariffs endpoints and gives each network its own token, but does not say whether the
    limits count per token or per address. The repository owner decided on 2026-10-29
    that they are read as applying to each token, so each network keeps its own 125
    second gap, while requests to open-chargepoints.com are still sent one at a time.
  evidence_url: https://developers.eco-movement.com/v2.2.1/docs/eco-movement-pcpr-api-user-guide
supports_single_location: supported
cors: needs_testing
attribution: >-
  Contains data from Travis Perkins published under the Public Charge Point Regulations
  2023, used in line with the Open Government Licence v3.0.
licence:
  name: OGL-3.0
  url: https://www.nationalarchives.gov.uk/doc/open-government-licence/version/3/
  basis: >-
    The data was requested through Drax's "Public Charge Point Regulations (PCPR) RFI
    Files" page, which offers data on "the Drax managed Public Charge Point Network" and
    names no licence, terms or rate limit for it (read 2026-10-23 and 2026-10-29); its
    only conditions are about sharing the request with Eco-Movement and processing the
    requester's personal data. Eco-Movement's emails of 2026-10-27 with the token, and
    its PCPR API user guide and reference (read 2026-10-26), state no licence or terms
    either. Regulation 10(5) of the Public Charge Point Regulations 2023 requires the
    data to be available "without any requirement to agree to terms and conditions
    regarding the use of that data", and the DfT guidance says "Data must be open in
    line with the Open Government Licence". On 2026-10-10 the repository owner decided,
    as a standing rule for operators whose data has no terms of its own, that such
    operators can be switched on without asking again.
  checked: 2026-10-29
vat_not_stated:
  decided: 2026-10-29
  basis: >-
    Travis Perkins's 2 tariffs on Eco-Movement's PCPR API gave no VAT rate on
    2026-10-29. Its energy prices are 0.317 pounds per kWh, which is 38p with 20% added,
    the UK standard rate of VAT on public charging. That the prices exclude VAT is
    inferred from the figures, not stated in the feed. The repository owner decided on
    2026-10-29 that VAT at 20% is added, so prices on the map all include VAT and can be
    compared.
  evidence_url: https://open-chargepoints.com/api/ocpi/cpo/2.2.1/tariffs/
  add_percent: 20
engagement:
  status: key_on_request
  evidence:
    - date: 2026-10-27
      file: evidence/travis_perkins/2026-10-27-token-emails.md
      note: >-
        Three emails from Eco-Movement on 2026-10-27, each with expiring links to tokens
        for the same eight networks, this one among them, for its PCPR API, sent as an
        "Authorization: Token" header to its OCPI 2.2.1 endpoints. The token itself is not
        kept here.
  log:
    - date: 2026-10-27
      action: key_granted
      channel: email
      summary: >-
        Eco-Movement sent a token for the network it labels "Travis Perkins" by email, through
        an expiring link, to be sent as an "Authorization: Token" header to its OCPI 2.2.1
        endpoints. The emails do not say which request they answer. The token is kept as a
        GitHub Actions secret.
      evidence_file: evidence/travis_perkins/2026-10-27-token-emails.md
access_requested: null
access_granted: 2026-10-27
sources:
  - url: https://developers.eco-movement.com/v2.2.1/docs/eco-movement-pcpr-api-user-guide
    note: >-
      Eco-Movement's PCPR API user guide: at most 5 simultaneous requests; date_from and
      date_to described for locations only.
  - url: https://developers.eco-movement.com/v2.2.1/reference/get-all-locations-pcpr-api
    note: Locations endpoint URL and its rate limit (read 2026-10-26).
  - url: https://developers.eco-movement.com/reference/get-tariffs-pcpr-api
    note: Tariffs endpoint and its rate limit (read 2026-10-26).
  - url: https://energy.drax.com/drax-network-of-public-chargers/
    note: >-
      Drax's PCPR request page (read 2026-10-23), for "the Drax managed Public Charge Point
      Network within the United Kingdom", whose requests are shared with Eco-Movement. The
      project requested data there on 2026-10-23; that this network's token answers that
      request is inferred, not stated.
findings:
  - date: 2026-10-29
    kind: data_quality
    summary: >-
      No price gives a VAT rate. The energy prices are 0.317 pounds per kWh, which is
      38p with 20% added.
    handling: >-
      By the repository owner's decision of 2026-10-29 recorded in vat_not_stated, VAT
      at 20% is added to every price that gives no VAT rate, and the price says this
      project added it. Reading the prices as excluding VAT is inferred from the
      figures and needs confirming by the network's operator. The tariffs are
      published unchanged.
    evidence_url: https://open-chargepoints.com/api/ocpi/cpo/2.2.1/tariffs/
  - date: 2026-10-29
    kind: spec_conformance
    summary: >-
      5 EVSEs give parking_restrictions as the single string "customers", where OCPI
      2.2.1 has a list of values (CUSTOMERS is one).
    handling: >-
      The value is not read and the EVSE's parking restrictions are shown as unknown.
      Nothing else in the record changes.
    evidence_url: https://open-chargepoints.com/api/ocpi/cpo/2.2.1/locations/
notes: >-
  Its regulation 10 data is served by Eco-Movement's PCPR API (eco_movement_pcpr adapter),
  one of eight networks for which Eco-Movement emailed tokens on 2026-10-27, all published
  under the OCPI party GB GFX. Its token is kept as the GitHub Actions secret
  TRAVIS_PERKINS_TOKEN. The emails do not say which request they answer; that they answer
  the request made through Drax's PCPR form on 2026-10-23 is inferred from the labels and
  the shared party. Every location names the network as both operator and owner. The
  response on 2026-10-29 linked to a next page past the last record, which the adapter
  does not follow. On 2026-10-29 the feed reported 15 locations and 2 tariffs.
enabled: true
