findings: []
notes: >-
  Saba Parking UK runs car parks in town centres and at railway stations (West Midlands
  Railway, London Northwestern Railway and London St Pancras among them). Its own page on
  2026-10-11 said it has charging hubs in its car parks that are free to use with paid
  parking. No open data feed or request route was found on its own website on 2026-10-11, so
  the next step is a written request asking where its open data under regulation 10 is
  published. Tesla chargers in its car parks are Tesla's own data.
