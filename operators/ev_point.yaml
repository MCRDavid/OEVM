# yaml-language-server: $schema=schema.json
id: ev_point
display_name: evpoint
ocpi_country_code: unknown
ocpi_party_id: unknown
adapter: eco_movement_pcpr
base_url: unknown
endpoints:
  locations:
    url: https://open-chargepoints.com/api/ocpi/cpo/2.2.1/locations
    status: documented
    note: Confirmed in Eco-Movement's PCPR API reference on 2026-10-07.
  tariffs:
    url: https://open-chargepoints.com/api/ocpi/cpo/2.2.1/tariffs
    status: documented
  statuses:
    url: https://open-chargepoints.com/api/statuses
    status: documented
auth:
  method: header
  name: Authorization
  scheme: Token
  secret_name: EV_POINT_TOKEN
rate_limit:
  min_seconds_between_requests: 125
  limits:
    - publisher: Eco-Movement
      requests: 30
      per_seconds: 3600
      endpoint: locations
      quote: The `locations` endpoint has a rate limit of 30 requests per 1 hour.
      source_url: https://developers.eco-movement.com/v2.2.1/reference/get-all-locations-pcpr-api
      checked: 2026-10-26
    - publisher: Eco-Movement
      requests: 30
      per_seconds: 3600
      endpoint: locations
      scope: single location
      quote: The `locations/{id}` endpoint has a rate limit of 30 requests per 1 hour.
      source_url: https://developers.eco-movement.com/v2.2.1/reference/get-specific-location-pcpr-api
      checked: 2026-10-26
    - publisher: Eco-Movement
      requests: 30
      per_seconds: 3600
      endpoint: tariffs
      quote: The `tariffs` endpoint has a rate limit of 30 requests per 1 hour.
      source_url: https://developers.eco-movement.com/reference/get-tariffs-pcpr-api
      checked: 2026-10-26
    - publisher: Eco-Movement
      requests: 1
      per_seconds: 30
      endpoint: statuses
      quote: The `statuses` endpoint has a rate limit of 1 request per 30 seconds.
      source_url: https://developers.eco-movement.com/reference/get-statuses-pcpr-api
      checked: 2026-10-26
  limits_checked: 2026-10-26
  notes: >-
    One gap of 125 seconds (the 120 seconds the strictest limit needs, plus a safety
    margin) is kept between any two requests to open-chargepoints.com, shared by every
    operator served from it, so this project sends it at most 29 requests in any hour.
    Requests are sent one at a time; Eco-Movement "strongly recommends limiting
    simultaneous GET requests to a maximum of 5". It recommends retrieving the entire
    dataset once a day.
supports_single_location: unknown
cors: unknown
attribution: >-
  Contains data from evpoint published under the Public Charge Point Regulations 2023, used
  in line with the Open Government Licence v3.0.
licence:
  name: OGL-3.0
  url: https://www.nationalarchives.gov.uk/doc/open-government-licence/version/3/
  basis: >-
    evpoint's own site has no open data page (read 2026-10-22). Its data was requested
    through ChargePoint's "PCPR Data Request" Google form, which names no licence, terms,
    key or rate limit (read 2026-10-10 and 2026-10-23). Eco-Movement's email of 2026-10-26
    with the token, and its PCPR API user guide and reference (read 2026-10-26), state no
    licence or terms either. Regulation 10(5) of the Public Charge Point Regulations 2023
    requires the data to be available "without any requirement to agree to terms and
    conditions regarding the use of that data", and the DfT guidance says "Data must be open
    in line with the Open Government Licence". On 2026-10-10 the repository owner decided,
    as a standing rule for operators whose data has no terms of its own, that such operators
    can be switched on without asking again.
  checked: 2026-10-29
engagement:
  status: key_on_request
  evidence:
    - date: 2026-10-22
      url: https://www.ev-point.com/
      note: >-
        evpoint's home page, its customer help and about pages, and its sitemaps (80 pages,
        68 of them location pages) have no open data page or route for requesting open data.
        The customer help page gives a support email address at eg.group.
    - date: 2026-10-26
      file: evidence/ev_point/2026-10-26-token-email.md
      note: >-
        Eco-Movement's email with an expiring link to this network's token for its PCPR
        API, sent as an "Authorization: Token" header to its OCPI 2.2.1 endpoints. The
        token itself is not kept here.
  log:
    - date: 2026-10-22
      action: feed_searched
      summary: >-
        evpoint's home page, customer help page, about page and sitemaps were read, and no
        open data feed or route for requesting open data was found.
      quote: >-
        Our directly managed, owned and operated network provides us with complete control
        over quality, consistency and pricing for our consumers.
      evidence_url: https://www.ev-point.com/
    - date: 2026-10-23
      action: request_sent
      channel: web_form
      summary: >-
        Requested access to evpoint's PCPR data through ChargePoint's Google form (one submission for this network), which is shared with Eco-Movement.
    - date: 2026-10-26
      action: key_granted
      channel: email
      summary: >-
        Eco-Movement sent a token for this network's PCPR data by email, through an
        expiring link, to be sent as an "Authorization: Token" header to its OCPI
        2.2.1 endpoints. The token is kept as a GitHub Actions secret.
      evidence_file: evidence/ev_point/2026-10-26-token-email.md
access_requested: 2026-10-23
access_granted: 2026-10-26
sources:
  - url: https://www.ev-point.com/
    note: >-
      evpoint's home page (read 2026-10-22): "The UK's Fastest Growing EV Charging Network".
      No open data link.
  - url: https://www.ev-point.com/about-us/
    note: >-
      evpoint's about page (read 2026-10-22). Says the brand was born in 2021 within its
      parent company, EG Group, and that "All of EG Group's legacy chargers will be
      transitioned to being part of the evpoint network."
  - url: https://www.ev-point.com/customer-help/
    note: >-
      evpoint's customer help page (read 2026-10-22). Gives a support email address; no open
      data answer.
  - url: https://www.ev-point.com/sitemap_index.xml
    note: >-
      evpoint's sitemap index and its page and location sitemaps (read 2026-10-22). No open
      data page.
  - url: https://docs.google.com/forms/d/e/1FAIpQLSeJ9Z3dyMdsBjaQ3pj9F3aOAXE4jstoHFBxwVq3wxs5lU5JLg/viewform
    note: >-
      ChargePoint's "PCPR Data Request" Google form (read 2026-10-10, recorded in
      operators/chargepoint.yaml). Its network list includes ev-point, so a request through it
      may cover evpoint's data. Requests are shared with Eco-Movement.
findings: []
notes: >-
  EG Group's charging network; its about page says the first evpoint location opened at a
  petrol filling station in Burnley. No open data route was found on evpoint's own site on
  2026-10-22. ChargePoint's data request form lists ev-point among the networks it covers,
  so that form is a possible route; otherwise a written request to evpoint's support
  address.
  On 2026-10-26 Eco-Movement sent a token for this network's data on its PCPR API, so it
  uses the eco_movement_pcpr adapter. What the token returns needs testing with one
  recorded fetch before the network is switched on.
enabled: false
