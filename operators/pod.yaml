# yaml-language-server: $schema=schema.json
id: pod
display_name: Pod
ocpi_country_code: unknown
ocpi_party_id: unknown
adapter: eco_movement_pcpr
base_url: unknown
endpoints:
  locations:
    url: https://open-chargepoints.com/api/ocpi/cpo/2.2.1/locations
    status: documented
    note: Confirmed in Eco-Movement's PCPR API reference on 2026-10-07.
  tariffs:
    url: https://open-chargepoints.com/api/ocpi/cpo/2.2.1/tariffs
    status: documented
  statuses:
    url: https://open-chargepoints.com/api/statuses
    status: documented
auth:
  method: header
  name: Authorization
  scheme: Token
  secret_name: POD_TOKEN
rate_limit:
  min_seconds_between_requests: 125
  limits:
    - publisher: Eco-Movement
      requests: 30
      per_seconds: 3600
      endpoint: locations
      quote: The `locations` endpoint has a rate limit of 30 requests per 1 hour.
      source_url: https://developers.eco-movement.com/v2.2.1/reference/get-all-locations-pcpr-api
      checked: 2026-10-26
    - publisher: Eco-Movement
      requests: 30
      per_seconds: 3600
      endpoint: locations
      scope: single location
      quote: The `locations/{id}` endpoint has a rate limit of 30 requests per 1 hour.
      source_url: https://developers.eco-movement.com/v2.2.1/reference/get-specific-location-pcpr-api
      checked: 2026-10-26
    - publisher: Eco-Movement
      requests: 30
      per_seconds: 3600
      endpoint: tariffs
      quote: The `tariffs` endpoint has a rate limit of 30 requests per 1 hour.
      source_url: https://developers.eco-movement.com/reference/get-tariffs-pcpr-api
      checked: 2026-10-26
    - publisher: Eco-Movement
      requests: 1
      per_seconds: 30
      endpoint: statuses
      quote: The `statuses` endpoint has a rate limit of 1 request per 30 seconds.
      source_url: https://developers.eco-movement.com/reference/get-statuses-pcpr-api
      checked: 2026-10-26
  limits_checked: 2026-10-26
  notes: >-
    One gap of 125 seconds (the 120 seconds the strictest limit needs, plus a safety
    margin) is kept between any two requests to open-chargepoints.com, shared by every
    operator served from it, so this project sends it at most 29 requests in any hour.
    Requests are sent one at a time; Eco-Movement "strongly recommends limiting
    simultaneous GET requests to a maximum of 5". It recommends retrieving the entire
    dataset once a day.
supports_single_location: unknown
cors: unknown
attribution: >-
  Contains data from Pod published under the Public Charge Point Regulations 2023, used in
  line with the Open Government Licence v3.0.
licence:
  name: OGL-3.0
  url: https://www.nationalarchives.gov.uk/doc/open-government-licence/version/3/
  basis: >-
    The "PCPR Data Request - Pod Point" Google form linked from Pod's contact page (read
    2026-10-29) names no licence, terms or rate limit; its only disclaimer is about sharing
    the request with Eco-Movement and processing the requester's personal data.
    Eco-Movement's email of 2026-10-26 with the token, and its PCPR API user guide and
    reference (read 2026-10-26), state no licence or terms either. Regulation 10(5) of the
    Public Charge Point Regulations 2023 requires the data to be available "without any
    requirement to agree to terms and conditions regarding the use of that data", and the
    DfT guidance says "Data must be open in line with the Open Government Licence". On
    2026-10-10 the repository owner decided, as a standing rule for operators whose data has
    no terms of its own, that such operators can be switched on without asking again.
  checked: 2026-10-29
engagement:
  status: key_on_request
  evidence:
    - date: 2026-10-26
      file: evidence/pod/2026-10-26-token-email.md
      note: >-
        Eco-Movement's email with an expiring link to this network's token for its PCPR
        API, sent as an "Authorization: Token" header to its OCPI 2.2.1 endpoints. The
        token itself is not kept here.
  log:
    - date: 2026-10-09
      action: feed_searched
      summary: >-
        Two web searches for a Pod open data or Public Charge Point Regulations page found
        none. Pod's own website was not searched directly; this needs checking.
    - date: 2026-10-10
      action: feed_searched
      summary: >-
        Pod's own website was searched directly; pod-point.com redirects to podenergy.com,
        whose home page, site map page and public charging page link no open data or Public
        Charge Point Regulations page, and the paths /open-data, /opendata and
        /public-charge-point-regulations each answered HTTP 404.
      evidence_url: https://podenergy.com/sitemap
    - date: 2026-10-24
      action: request_sent
      channel: web_form
      summary: >-
        Requested access to Pod's PCPR data through the request form linked from its
        contact page, a Google form shared with Eco-Movement.
      evidence_url: https://podenergy.com/contact-us
    - date: 2026-10-26
      action: key_granted
      channel: email
      summary: >-
        Eco-Movement sent a token for this network's PCPR data by email, through an
        expiring link, to be sent as an "Authorization: Token" header to its OCPI
        2.2.1 endpoints. The token is kept as a GitHub Actions secret.
      evidence_file: evidence/pod/2026-10-26-token-email.md
    - date: 2026-10-29
      action: page_checked
      summary: >-
        The "Open public data access" link on Pod's contact page leads to a Google form
        titled "PCPR Data Request - Pod Point", which asks for an email address, name,
        organisation and planned use of the data. It names no licence, terms or rate limit.
      quote: >-
        Request data on the location, status, and properties of the Community by Pod Point
        network in the United Kingdom which complies with the Public Charge Point
        Regulations.
      evidence_url: https://docs.google.com/forms/d/e/1FAIpQLScNZ1BAAvtnlg407DU3Xaxqsrvg7kJ5XPsBX9DPQWJMQKTSWA/viewform
access_requested: 2026-10-24
access_granted: 2026-10-26
sources:
  - url: https://docs.google.com/forms/d/e/1FAIpQLScNZ1BAAvtnlg407DU3Xaxqsrvg7kJ5XPsBX9DPQWJMQKTSWA/viewform
    note: >-
      The "PCPR Data Request - Pod Point" Google form, linked as "Open public data access"
      from https://podenergy.com/contact-us (read 2026-10-29). Its disclaimer says the request
      will be shared with Eco-Movement. It names no licence, terms or rate limit.
  - url: https://podenergy.com/
    note: >-
      Pod's home page, reached from https://pod-point.com/ by redirect (read 2026-10-10).
      It links no open data or Public Charge Point Regulations page.
  - url: https://podenergy.com/sitemap
    note: >-
      Pod's site map page (read 2026-10-10). It lists no open data or Public Charge Point
      Regulations page.
  - url: https://podenergy.com/public-charging-zapmap
    note: >-
      Pod's public charging page (read 2026-10-10). It covers how drivers use the network and
      says nothing about open data.
notes: >-
  The blueprint said the ocpi_221 adapter would cover Pod "once a token is granted", with
  a version endpoint at ocpi.podenergy.com as an example to probe; the token came instead
  through Pod's request form, which is shared with Eco-Movement.
  On 2026-10-26 Eco-Movement sent a token for this network's data on its PCPR API, so it
  uses the eco_movement_pcpr adapter. What the token returns needs testing with one
  recorded fetch before the network is switched on.
enabled: false
