# yaml-language-server: $schema=schema.json
id: enfield_council
display_name: Enfield Council
ocpi_country_code: unknown # The feed's records carry no country_code or party_id (2026-10-23).
ocpi_party_id: unknown
adapter: ocpi_221
base_url: unknown
endpoints:
  locations:
    url: https://api.fuuse.io/opendata/d73a73f9-d063-456c-9f25-b51765e5747f/location
    status: documented
    note: >-
      Linked as location data on the council's electric vehicle charging page (read in a
      browser on 2026-10-23). Hosted by Fuuse, the back office provider for the chargers the
      council runs, as for Arnold Clark Charge and ScottishPower Recharge.
  tariffs:
    url: https://api.fuuse.io/opendata/d73a73f9-d063-456c-9f25-b51765e5747f/tariff
    status: documented
    note: >-
      Linked as tariff data on the same page (read in a browser on 2026-10-23).
auth:
  method: none
  name: null
  secret_name: null
rate_limit:
  min_seconds_between_requests: 31
  limits: []
  limits_checked: 2026-10-23
  notes: >-
    The council's page states no rate limit. The host answers quick repeat requests with
    HTTP 429 ("The Fuuse API is currently being rate limited"), and asked for 30 seconds
    when ScottishPower Recharge's files were recorded on 2026-10-11. The 31 second gap is
    this project's own choice, the same as for the other operators on this host. Each
    response holds every record, so a full run makes two requests.
supports_single_location: unknown
cors: needs_testing
attribution: >-
  Contains data from Enfield Council published under the Public Charge Point Regulations
  2023, used in line with the Open Government Licence v3.0.
licence:
  name: OGL-3.0
  url: https://www.nationalarchives.gov.uk/doc/open-government-licence/version/3/
  basis: >-
    The council's electric vehicle charging page says "In accordance with The Public Charge
    Point Regulations 2023 the following links will provide up-to-date information for the
    chargers supported by Fuuse and operated by the council", then links the location and
    tariff data. Read in a browser on 2026-10-23, neither the page nor the two files state a
    licence, terms, conditions or rate limit for the data. The council's site-wide terms of
    use (https://www.enfield.gov.uk/terms-of-use) say "You must not use any part of the
    content on our site for commercial purposes without obtaining a licence to do so from
    us or our licensors"; this project is not commercial, and on 2026-10-10 the repository
    owner decided, as a standing rule for operators whose data has no terms of its own, to
    read general website terms as not covering the open data, which regulation 10(5)
    requires to be available without terms on its use. DfT's guidance (updated 21 October
    2024) says "Data must be open in line with the Open Government Licence".
  checked: 2026-10-23
engagement:
  status: open_anonymous
  evidence:
    - date: 2026-10-23
      url: https://www.enfield.gov.uk/services/roads-and-transport/electric-vehicle-charging
      note: >-
        The page links location data and tariff data on api.fuuse.io for "the chargers
        supported by Fuuse and operated by the council", under a sentence citing the Public
        Charge Point Regulations 2023. Read in a browser; the page answers HTTP 403 to this
        project's automated requests.
  log:
    - date: 2026-10-17
      action: page_checked
      summary: >-
        The council's electric vehicle charging page answered 403 to this project's
        automated requests, so its content could not be read. Web search summaries of the
        page say it links location data and tariff data for the chargers it runs on Fuuse.
        It needs reading in a browser.
      evidence_url: https://www.enfield.gov.uk/services/roads-and-transport/electric-vehicle-charging
    - date: 2026-10-23
      action: page_checked
      summary: >-
        The page was read in a browser. It links location and tariff data on Fuuse's open
        data host for the chargers the council runs on Fuuse, which need no key.
      quote: >-
        In accordance with The Public Charge Point Regulations 2023 the following links will
        provide up-to-date information for the chargers supported by Fuuse and operated by
        the council
      evidence_url: https://www.enfield.gov.uk/services/roads-and-transport/electric-vehicle-charging
access_requested: null
access_granted: null
sources:
  - url: https://www.enfield.gov.uk/services/roads-and-transport/electric-vehicle-charging
    note: >-
      Enfield Council's electric vehicle charging page. Answered 403 to automated requests on
      2026-10-17; read in a browser on 2026-10-23. It names the charge point providers in the
      borough (Ubitricity, BP Pulse, Char.gy and the chargers supported by Fuuse) and gives
      the two data links for the Fuuse ones.
  - url: https://support.fuuse.io/hc/en-gb/articles/4696535102239-Open-Data-Access-ODA-Links-Overview
    note: >-
      Fuuse's help article "Open Data Access (ODA) Links - Overview" (updated 2026-09-07,
      read 2026-10-17). Each Fuuse customer has a "Location Data Link" and a "Tariff Data
      Link" and is expected to publish them on its own website.
findings:
  - date: 2026-10-23
    kind: access
    summary: >-
      The host answered tariff requests sent soon after the location request with HTTP 429
      and a page titled "The Fuuse API is currently being rate limited" (seen in a browser on
      2026-10-23); a later request was answered normally. The council's page states no limit.
    handling: >-
      Requests to the host are spaced 31 seconds apart, as for the other operators on it. A
      recording made that way on 2026-10-23 needed no retry.
    evidence_url: https://api.fuuse.io/opendata/d73a73f9-d063-456c-9f25-b51765e5747f/tariff
  - date: 2026-10-23
    kind: spec_conformance
    summary: >-
      Locations and tariffs carry no country_code or party_id, which OCPI 2.2.1 requires.
    handling: >-
      Record ids use "unknown" for the country and party, from this file, until the
      operator's own data gives them.
    evidence_url: https://api.fuuse.io/opendata/d73a73f9-d063-456c-9f25-b51765e5747f/location
  - date: 2026-10-23
    kind: spec_conformance
    summary: >-
      Tariff prices, VAT rates and the minimum kWh are sent as strings (for example "0.4417",
      "20.0000" and "0.1000") rather than numbers.
    handling: Read as the numbers they spell. Values that are not numbers would be unknown.
    evidence_url: https://api.fuuse.io/opendata/d73a73f9-d063-456c-9f25-b51765e5747f/tariff
  - date: 2026-10-23
    kind: data_quality
    summary: >-
      30 of 32 connectors, at 6 of the 7 locations, name no tariff (on 2026-10-23). Only the
      2 connectors at Palace Gardens - Multi-storey name the feed's one tariff, "London
      Borough of Enfield - Public Tariff DAY".
    handling: >-
      Connectors with no tariff show "Price unknown". The one tariff is not applied to them,
      since the feed does not say it covers them.
    evidence_url: https://api.fuuse.io/opendata/d73a73f9-d063-456c-9f25-b51765e5747f/location
notes: >-
  The London Borough of Enfield runs some of the borough's public chargers itself on Fuuse's
  platform; the others belong to Ubitricity, BP Pulse and Char.gy. On 2026-10-23 the feed
  held 7 council car parks with 32 charge points and one tariff.
enabled: true
