# yaml-language-server: $schema=schema.json
id: bright_green
display_name: BrightGreen
ocpi_country_code: GB # From the feed's own country_code on 2026-10-23; it sends no party_id.
ocpi_party_id: unknown
adapter: ocpi_221
base_url: unknown
endpoints:
  locations:
    url: https://connect.bright.green/ocpp/locations
    status: documented
    note: Linked as "Locations Data" from BrightGreen's open data page (read 2026-10-23).
  tariffs:
    url: https://connect.bright.green/ocpp/tariffs
    status: documented
    note: Linked as "Tariffs Data" from BrightGreen's open data page (read 2026-10-23).
auth:
  method: none
  name: null
  secret_name: null
rate_limit:
  min_seconds_between_requests: 2
  limits: []
  limits_checked: 2026-10-23
  notes: >-
    BrightGreen's open data page states no rate limit, and responses carry no rate limit
    headers. The 2 second gap is this project's own choice. Each file holds every record,
    so a full run makes two requests (about 38 KB on 2026-10-23).
supports_single_location: needs_testing
cors: needs_testing
attribution: >-
  Contains data from BrightGreen published under the Public Charge Point Regulations 2023,
  used in line with the Open Government Licence v3.0.
licence:
  name: OGL-3.0
  url: https://www.nationalarchives.gov.uk/doc/open-government-licence/version/3/
  basis: >-
    BrightGreen's open data page, headed "Public Charge Point Regulation Data", says "In
    accordance with the UK Public Charge Point Regulations (PCPR) Open Data requirement,
    please find reference data below" and links "Locations Data" and "Tariffs Data". It
    states no licence or terms for the data. The site has no terms of use page: none of
    the 25 pages in its sitemap is one, and the footer links none (read 2026-10-23).
    Regulation 10(5) of the Public Charge Point Regulations 2023 requires the data to be
    available without terms on its use, and DfT's guidance says "Data must be open in line
    with the Open Government Licence". On 2026-10-10 the repository owner decided, as a
    standing rule for operators whose data has no terms of its own, that such operators
    can be switched on without asking again, and on 2026-10-23 asked for the new feeds
    whose terms allow use to be switched on.
  checked: 2026-10-23
swapped_coordinates:
  decided: 2026-10-23
  basis: >-
    Where a location's longitude is obviously missing its minus sign, or its latitude and
    longitude are obviously the wrong way round, the repository owner decided to show it
    in the right place rather than leave it off the map, with the operator's own figures
    kept and the correction shown on the map and recorded in the findings below. Kiln Farm
    Station's point as published is inside the UK, so the owner named it here on the same
    day (see findings).
  sign_missing:
    - id: 4cbfa56a-07da-4cf1-90be-8277667b4158
      name: Kiln Farm Station
      postal_code: MK11 3LW
vat_in_price:
  decided: 2026-10-23
  basis: >-
    BrightGreen's tariffs file gives every price with VAT 20 and also a display price,
    "price_display", equal to the price as written: for example price "0.59", VAT 20 and
    price_display "£0.59" (12 of 12 tariffs on 23 October 2026). Read as OCPI 2.2.1 says,
    0.59 is 70.8p per kWh including VAT, while the display price shows 59p; which one
    drivers pay is not stated. The repository owner decided that the prices are read as
    the display price shows them, already including VAT, so no VAT is added.
  evidence_url: https://connect.bright.green/ocpp/tariffs
socket_types:
  decided: 2026-10-30
  basis: >-
    BrightGreen's connectors give no OCPI 2.2.1 standard, so their plug type was unknown.
    Each gives a socket_type, a field outside OCPI 2.2.1: "Type 2" on 50 and "CCS 2" on 2
    of the 52 connectors at published locations on 2026-10-30. These are the common names
    of the plugs OCPI 2.2.1 calls IEC_62196_T2 (IEC 62196 Type 2 "Mennekes") and
    IEC_62196_T2_COMBO (Combo Type 2 based, DC). The repository owner decided on
    2026-10-30 that socket_type is read as the plug type for these two values.
  evidence_url: https://connect.bright.green/ocpp/locations
  types:
    Type 2: IEC_62196_T2
    CCS 2: IEC_62196_T2_COMBO
status_from_connectors:
  decided: 2026-10-30
  basis: >-
    Every EVSE status is "idle", which is not an OCPI 2.2.1 value, so every charge point
    showed status unknown. Each connector also gives a status, a field outside OCPI 2.2.1,
    mostly in OCPI 2.2.1 words with a capital first letter: "Available" (44), "Charging" (3),
    "Unknown" (4) and "Unavailable" (1) on 2026-10-30. OCPI 2.2.1 describes its statuses as
    those of the "EVSE/Connector". The repository owner decided on 2026-10-30 that a charge
    point's status is taken from its connectors where they all give the same OCPI 2.2.1
    status (28 of 30 charge points at published locations on 2026-10-30), and is unknown
    otherwise.
  evidence_url: https://connect.bright.green/ocpp/locations
engagement:
  status: open_anonymous
  evidence:
    - date: 2026-10-23
      url: https://bright.green/open-data/
      note: >-
        Links "Locations Data" and "Tariffs Data" on connect.bright.green and states no
        licence, terms or rate limit.
  log:
    - date: 2026-10-23
      action: page_checked
      summary: >-
        BrightGreen's open data page and site were read; the page links two no-key files and
        the site has no terms of use.
      evidence_url: https://bright.green/open-data/
access_requested: null
access_granted: null
sources:
  - url: https://bright.green/open-data/
    note: >-
      BrightGreen's open data page, read on 2026-10-23. Gives the two links. Answers
      automated requests normally.
  - url: https://www.evroam.org.uk/id-register
    note: >-
      EV Roam's ID register lists Bright.Green Energy Limited with operator ID GB*BB1 and
      the website bright.green, which is how this network was found (read 2026-10-23).
findings:
  - date: 2026-10-23
    kind: spec_conformance
    summary: >-
      Locations and tariffs carry country_code GB but no party_id, which OCPI 2.2.1
      requires.
    handling: >-
      Record ids use "unknown" for the party, from this file, until the operator's own data
      gives one.
    evidence_url: https://connect.bright.green/ocpp/locations
  - date: 2026-10-23
    kind: spec_conformance
    summary: >-
      Every EVSE status is "idle" (52 EVSEs on 2026-10-23), which is not one of the OCPI
      2.2.1 EVSE status values.
    handling: >-
      Shown as status unknown, as for any value outside OCPI 2.2.1, until 2026-10-29. From
      2026-10-30, by the repository owner's decision recorded in status_from_connectors,
      the status is taken from the connectors' own status where they all give the same
      OCPI 2.2.1 status, and is unknown otherwise.
    evidence_url: https://connect.bright.green/ocpp/locations
  - date: 2026-10-23
    kind: spec_conformance
    summary: >-
      Tariff prices are sent as text, for example "0.59", where OCPI 2.2.1 uses a number.
      Each states its VAT rate (20 for the GBP tariffs).
    handling: Read as the number written.
    evidence_url: https://connect.bright.green/ocpp/tariffs
  - date: 2026-10-23
    kind: data_quality
    summary: >-
      Every tariff also carries a "price_display" field, which is not in OCPI 2.2.1, equal to
      its price as written: for example price "0.59" with VAT 20 and price_display "£0.59"
      (12 of 12 tariffs on 2026-10-23). OCPI 2.2.1 gives prices excluding VAT, so read that
      way the price is 70.8p per kWh including VAT, while the display price suggests 59p.
      Which one drivers pay is not stated.
    handling: >-
      Each price is shown as written, read as including VAT as the display price shows it,
      by the repository owner's decision of 2026-10-23 (vat_in_price above), and the price
      says it was read that way. The tariffs are published unchanged.
    evidence_url: https://connect.bright.green/ocpp/tariffs
  - date: 2026-10-23
    kind: spec_conformance
    summary: >-
      Connectors give power_type "fast" (48 connectors) or "ultrarapid" (3) and no standard
      (51), and locations give the two-letter country codes "GB" and "SK" in country. OCPI
      2.2.1 uses AC_1_PHASE, AC_3_PHASE or DC for power_type, a ConnectorType for standard
      and a three-letter ISO 3166-1 code for country.
    handling: >-
      Each is recorded as unknown, as for any value outside OCPI 2.2.1. Whether a location is
      in the UK is decided from its coordinates, not from country. From 2026-10-30, by the
      repository owner's decision recorded in socket_types, a connector's plug type is read
      from its socket_type (next finding).
    evidence_url: https://connect.bright.green/ocpp/locations
  - date: 2026-10-23
    kind: data_quality
    summary: >-
      15 locations on 2026-10-23: 13 in the UK and 2 in Slovakia, with one EUR tariff. 5 of
      the UK locations are marked publish false. One location in Slovakia, "Nabito Lab", has
      no coordinates. Of the rest, three ("Archived Station", "Canalside Farm Stafford" and
      "Aston Marina", in Stafford and Stone) share the same rounded coordinates, 52.81 and
      -2.01.
    handling: >-
      Locations marked publish false are not kept, and the one with no coordinates is
      skipped. The other Slovak location is left off the map, and the EUR tariff shows
      "Price unknown". The three locations sharing coordinates are kept as published.
    evidence_url: https://connect.bright.green/ocpp/locations
  - date: 2026-10-23
    kind: data_quality
    summary: >-
      "Kiln Farm Station" has a Milton Keynes postcode (MK11 3LW) and coordinates 52.04 and
      .82. Milton Keynes is at about longitude -0.82, west of the Greenwich meridian, so the
      minus sign appears to be missing; as published the point is in Suffolk.
    handling: >-
      Shown at longitude -0.82, by the repository owner's decision of 2026-10-23
      (swapped_coordinates above), with the operator's own figures kept and the correction
      shown on the map.
    evidence_url: https://connect.bright.green/ocpp/locations
  - date: 2026-10-30
    kind: spec_conformance
    summary: >-
      Each connector gives two fields that are not in OCPI 2.2.1: socket_type ("Type 2" on
      50 and "CCS 2" on 2 of the 52 connectors at published locations) and status
      ("Available" 44, "Charging" 3, "Unknown" 4, "Unavailable" 1). Every EVSE's own status
      is "idle".
    handling: >-
      By the repository owner's decisions of 2026-10-30 recorded in socket_types and
      status_from_connectors, "Type 2" is read as IEC_62196_T2 and "CCS 2" as
      IEC_62196_T2_COMBO where a connector gives no standard, and a charge point's status
      is taken from its connectors where they all give the same OCPI 2.2.1 status. Two
      charge points have connectors that differ (IBIS Derby, eight sockets, one charging
      and one "Unavailable"; EZ charge HQ, three, one charging), so their status stays
      unknown. "Unavailable" is not an OCPI 2.2.1 status, so it is never read as one.
    evidence_url: https://connect.bright.green/ocpp/locations
  - date: 2026-10-30
    kind: data_quality
    summary: >-
      At "EZ charge HQ" one charge point has two "CCS 2" connectors and one "Type 2"
      connector, each with max_electric_power 150000 (150 kW) and power_type "ultrarapid".
    handling: >-
      Shown as published, a Type 2 connector at 150 kW; neither value is changed. Whether
      that connector charges at 150 kW needs testing.
    evidence_url: https://connect.bright.green/ocpp/locations
notes: >-
  One location in the feed is named "EZ charge HQ" (Bicester). EZ-Charge has its own file in
  the registry (operators/ez_charge.yaml), with no public feed found; whether BrightGreen's
  feed covers EZ-Charge's network is not known.
enabled: true
