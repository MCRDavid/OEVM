notes: >-
  No open data feed or request route was found on Lidl's own website on 2026-10-10. Its FAQ
  refers to the ChargePoint community for roaming, and ChargePoint's own PCPR data request
  form (see the chargepoint file, read 2026-10-10) lists Lidl Great Britain Limited among
  the networks whose data can be requested; Lidl's site does not link that form, so whether
  it is Lidl's route needs confirming. A written request could ask where its open data under
