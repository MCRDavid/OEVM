auth:
  method: none
  name: null
  secret_name: null
rate_limit:
  min_seconds_between_requests: 31
  limits:
    - publisher: 3ti
      requests: 1
      per_seconds: 30
      endpoint: all
      quote: >-
        Fuuse allows roughly 1-2 requests per 30 seconds per IP (shared across sites and
        endpoints), so this script makes ONE request at a time, at least 31 s apart
      source_url: https://3ti.co.uk/3ti-public-charge-points/
      checked: 2026-10-23
  limits_checked: 2026-10-23
  notes: >-
    The limit is quoted from a comment in the script on 3ti's public charge points page,
    read as its lower figure, 1 request per 30 seconds. Arnold Clark Charge and ScottishPower
    Recharge use the same 31 second gap on the same host, and the client keeps one timer
    for it. Six sites, each with a location and a tariff file, make 12 requests a run, so a
    full run takes about 6 minutes.
supports_single_location: unknown
cors: unknown
attribution: >-
  Contains data from 3ti published under the Public Charge Point Regulations 2023, used in
  line with the Open Government Licence v3.0.
licence:
  name: OGL-3.0
  url: https://www.nationalarchives.gov.uk/doc/open-government-licence/version/3/
  basis: >-
    3ti's public charge points page shows "live availability and pricing for the public
    charge points we operate", says "Data supplied by Fuuse", and reads each site from
    Fuuse's open data host with no key. It states no licence or terms for the data. Fuuse
    describes these as "Open Data Access" links that each of its customers publishes on its
    own website. DfT's guidance (updated 21 October 2024) says "Data must be open in line
    with the Open Government Licence". 3ti's website "Terms of Service" page (read
    2026-10-23, not linked from the charge points page) says "Permission is granted to
    temporarily download one copy of the materials (information or software) on 3ti's
    website for personal, non-commercial transitory viewing only". The files are served
    from Fuuse's host, not from 3ti's website. On 2026-10-10 the repository owner decided,
    as a standing rule for operators whose data has no terms of its own, to read general
    website or charging terms as not covering the open data, which regulation 10(5)
    requires to be available without terms on its use. The same reading applies to Arnold
    Clark Charge, whose files are on the same host.
  checked: 2026-10-23
engagement:
  status: open_anonymous
  evidence:
    - date: 2026-10-23
      url: https://3ti.co.uk/3ti-public-charge-points/
      note: >-
        3ti's public charge points page shows "live availability and pricing for the public
        charge points we operate" for six sites, says "Data supplied by Fuuse", and its
        script reads each site from api.fuuse.io/opendata/<site id>/location and /tariff.
  log:
    - date: 2026-10-23
      action: page_checked
      summary: >-
        3ti's public charge points page was read; it reads six sites' location and tariff
        data from Fuuse's open data host with no key.
      evidence_url: https://3ti.co.uk/3ti-public-charge-points/
    - date: 2026-10-23
      action: page_checked
      summary: >-
        3ti's website pages were listed and its terms read: a general website Terms of
        Service page and a privacy policy (last updated July 2026); two "EV Charging" terms
        pages have no text. None mentions the charge point data.
      evidence_url: https://3ti.co.uk/hfh-equipment-maintenance-tcs-2-2/
access_requested: null
access_granted: null
sources:
  - url: https://3ti.co.uk/3ti-public-charge-points/
    note: >-
      Read on 2026-10-23. Lists six sites, each read from its own Fuuse open data address
      (with "location" or "tariff" added): Raigmore Hospital, Inverness; Riverbridge House,
      Surrey; Segen, Medway; University of Surrey, Surrey; East Staffordshire Borough
      Council; Salford Royal Hospital. The addresses are in endpoints and more_endpoints.
      The page says "Prices include VAT" and its script multiplies each energy price by
      1.2.
  - url: https://3ti.co.uk/hfh-equipment-maintenance-tcs-2-2/
    note: >-
      3ti's website "Terms of Service", read 2026-10-23. General website terms; they do not
      mention the charge point data.
  - url: https://3ti.co.uk/privacy-policy/
    note: 3ti's privacy policy, last updated July 2026, read 2026-10-23.
  - url: https://support.fuuse.io/hc/en-gb/articles/4696535102239-Open-Data-Access-ODA-Links-Overview
    note: >-
      Fuuse's help article "Open Data Access (ODA) Links - Overview" (read 2026-10-17). Each
      Fuuse customer has a "Location Data Link" and a "Tariff Data Link" and is expected to
      publish them on its own website.
  - url: https://www.evroam.org.uk/id-register
    note: >-
      EV Roam's ID register lists 3ti Energy Hubs with operator ID GB*3TI, which is how this
      network was found (read 2026-10-23).
findings:
  - date: 2026-10-23
    kind: documentation
    summary: >-
      3ti publishes its data per site rather than as one feed: each of six sites has its
      own location and tariff address on Fuuse's open data host.
    handling: >-
      The six pairs of addresses are read in turn and their records added together; each
      record keeps the address it came from.
    evidence_url: https://3ti.co.uk/3ti-public-charge-points/
notes: >-
  Found through EV Roam's ID register on 2026-10-23. The page is a live status page rather
  than a page about the regulations.
enabled: true
