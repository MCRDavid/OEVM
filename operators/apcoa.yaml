findings: []
notes: >-
  APCOA runs its own public charging network in the car parks it operates, which drivers use
  through the APCOA Connect app; on 2026-10-11 its UK business page gave about 1,000 charging
  stations. No open data feed or request route was found on its own websites on 2026-10-11.
  The next step is a written request asking where its open data under regulation 10 is
  published. Some APCOA car parks host Tesla chargers, which are Tesla's own data.
