# yaml-language-server: $schema=schema.json
id: esb_energy
display_name: ESB Energy
ocpi_country_code: unknown
ocpi_party_id: unknown
adapter: eco_movement_pcpr
base_url: unknown
endpoints:
  locations:
    url: https://open-chargepoints.com/api/ocpi/cpo/2.2.1/locations
    status: documented
    note: Confirmed in Eco-Movement's PCPR API reference on 2026-10-07.
  tariffs:
    url: https://open-chargepoints.com/api/ocpi/cpo/2.2.1/tariffs
    status: documented
  statuses:
    url: https://open-chargepoints.com/api/statuses
    status: documented
auth:
  method: header
  name: Authorization
  scheme: Token
  secret_name: ESB_ENERGY_TOKEN
rate_limit:
  min_seconds_between_requests: 125
  limits:
    - publisher: Eco-Movement
      requests: 30
      per_seconds: 3600
      endpoint: locations
      quote: The `locations` endpoint has a rate limit of 30 requests per 1 hour.
      source_url: https://developers.eco-movement.com/v2.2.1/reference/get-all-locations-pcpr-api
      checked: 2026-10-26
    - publisher: Eco-Movement
      requests: 30
      per_seconds: 3600
      endpoint: locations
      scope: single location
      quote: The `locations/{id}` endpoint has a rate limit of 30 requests per 1 hour.
      source_url: https://developers.eco-movement.com/v2.2.1/reference/get-specific-location-pcpr-api
      checked: 2026-10-26
    - publisher: Eco-Movement
      requests: 30
      per_seconds: 3600
      endpoint: tariffs
      quote: The `tariffs` endpoint has a rate limit of 30 requests per 1 hour.
      source_url: https://developers.eco-movement.com/reference/get-tariffs-pcpr-api
      checked: 2026-10-26
    - publisher: Eco-Movement
      requests: 1
      per_seconds: 30
      endpoint: statuses
      quote: The `statuses` endpoint has a rate limit of 1 request per 30 seconds.
      source_url: https://developers.eco-movement.com/reference/get-statuses-pcpr-api
      checked: 2026-10-26
  limits_checked: 2026-10-26
  notes: >-
    One gap of 125 seconds (the 120 seconds the strictest limit needs, plus a safety
    margin) is kept between any two requests to open-chargepoints.com, shared by every
    operator served from it, so this project sends it at most 29 requests in any hour.
    Requests are sent one at a time; Eco-Movement "strongly recommends limiting
    simultaneous GET requests to a maximum of 5". It recommends retrieving the entire
    dataset once a day.
supports_single_location: unknown
cors: unknown
attribution: >-
  Contains data from ESB Energy published under the Public Charge Point Regulations 2023,
  used in line with the Open Government Licence v3.0.
licence:
  name: OGL-3.0
  url: https://www.nationalarchives.gov.uk/doc/open-government-licence/version/3/
  basis: >-
    ESB Energy's "PCPR Data Request" Google form (read 2026-10-10) names no licence, terms,
    key or rate limit. Eco-Movement's email of 2026-10-26 with the token, and its PCPR API
    user guide and reference (read 2026-10-26), state no licence or terms either. Regulation
    10(5) of the Public Charge Point Regulations 2023 requires the data to be available
    "without any requirement to agree to terms and conditions regarding the use of that
    data", and the DfT guidance says "Data must be open in line with the Open Government
    Licence". On 2026-10-10 the repository owner decided, as a standing rule for operators
    whose data has no terms of its own, that such operators can be switched on without
    asking again.
  checked: 2026-10-29
engagement:
  status: key_on_request
  evidence:
    - date: 2026-10-10
      url: https://www.esbenergy.co.uk/ev
      note: >-
        The menu of ESB Energy's electric vehicle pages links "PCPR Data Request", a Google
        form asking for an email address, name, organisation and planned use of data. The
        form says requests are shared with Eco-Movement and names no licence, terms, key or
        rate limit.
    - date: 2026-10-26
      file: evidence/esb_energy/2026-10-26-token-email.md
      note: >-
        Eco-Movement's email with an expiring link to this network's token for its PCPR
        API, sent as an "Authorization: Token" header to its OCPI 2.2.1 endpoints. The
        token itself is not kept here.
  log:
    - date: 2026-10-10
      action: feed_searched
      summary: >-
        ESB Energy's home page has no open data link, and the menu of its electric vehicle
        pages links a "PCPR Data Request" form.
      evidence_url: https://www.esbenergy.co.uk/ev
    - date: 2026-10-10
      action: page_checked
      summary: >-
        ESB Energy's "PCPR Data Request" Google form was read, not submitted; it says the
        request will be shared with Eco-Movement and an answer will come within 5 working
        days.
      quote: >-
        Request data on the location, status, and properties of the ESB network in the United
        Kingdom which complies with the Public Charge Point Regulations. You will receive an
        answer within 5 working days.
      evidence_url: https://docs.google.com/forms/d/e/1FAIpQLSfAe5GBI7djZfhpr-yq1QBpb6oSs2dF1rG4SxIYK7rj9AVnHw/viewform
    - date: 2026-10-23
      action: request_sent
      channel: web_form
      summary: >-
        Requested access to ESB Energy's PCPR data through its Google form, which is shared with Eco-Movement.
    - date: 2026-10-26
      action: key_granted
      channel: email
      summary: >-
        Eco-Movement sent a token for this network's PCPR data by email, through an
        expiring link, to be sent as an "Authorization: Token" header to its OCPI
        2.2.1 endpoints. The token is kept as a GitHub Actions secret.
      evidence_file: evidence/esb_energy/2026-10-26-token-email.md
access_requested: 2026-10-23
access_granted: 2026-10-26
sources:
  - url: https://www.esbenergy.co.uk/
    note: ESB Energy's home page (read 2026-10-10). No open data link.
  - url: https://www.esbenergy.co.uk/ev
    note: >-
      ESB Energy's electric vehicle charging page (read 2026-10-10). Its menu links the "PCPR
      Data Request" form.
  - url: https://docs.google.com/forms/d/e/1FAIpQLSfAe5GBI7djZfhpr-yq1QBpb6oSs2dF1rG4SxIYK7rj9AVnHw/viewform
    note: >-
      The "PCPR Data Request - ESB" Google form (read 2026-10-10, not submitted). Its
      disclaimer says "Your request will be shared with Eco-Movement" and gives
      Eco-Movement's PCPR address for privacy questions.
findings: []
notes: >-
  Access could be requested through the "PCPR Data Request" form linked from ESB Energy's
  electric vehicle pages. Requests are shared with Eco-Movement, so the eco_movement_pcpr
  adapter may apply once access is given, but the form does not say how the data is
  delivered; this needs testing.
  On 2026-10-26 Eco-Movement sent a token for this network's data on its PCPR API, so it
  uses the eco_movement_pcpr adapter. What the token returns needs testing with one
  recorded fetch before the network is switched on.
enabled: false
