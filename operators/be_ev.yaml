findings: []
notes: >-
  No open data feed or request route was found on Be.EV's own website on 2026-10-10 or
  2026-10-17. Be.EV runs on Fuuse, which gives each customer location and tariff data links
  to publish, so a written request could ask Be.EV where those are published. Be.EV
  acquired Mer's UK public network in February 2026; Mer UK's own feed is read separately,
  and whether it covers any Be.EV charge points is unknown.
