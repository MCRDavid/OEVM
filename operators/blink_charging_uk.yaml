# yaml-language-server: $schema=schema.json
id: blink_charging_uk
display_name: Blink Charging
ocpi_country_code: unknown
ocpi_party_id: unknown
adapter: eco_movement_pcpr
base_url: unknown
endpoints:
  locations:
    url: https://open-chargepoints.com/api/ocpi/cpo/2.2.1/locations
    status: documented
    note: Confirmed in Eco-Movement's PCPR API reference on 2026-10-07.
  tariffs:
    url: https://open-chargepoints.com/api/ocpi/cpo/2.2.1/tariffs
    status: documented
  statuses:
    url: https://open-chargepoints.com/api/statuses
    status: documented
auth:
  method: header
  name: Authorization
  scheme: Token
  secret_name: BLINK_CHARGING_UK_TOKEN
rate_limit:
  min_seconds_between_requests: 125
  limits:
    - publisher: Eco-Movement
      requests: 30
      per_seconds: 3600
      endpoint: locations
      quote: The `locations` endpoint has a rate limit of 30 requests per 1 hour.
      source_url: https://developers.eco-movement.com/v2.2.1/reference/get-all-locations-pcpr-api
      checked: 2026-10-26
    - publisher: Eco-Movement
      requests: 30
      per_seconds: 3600
      endpoint: locations
      scope: single location
      quote: The `locations/{id}` endpoint has a rate limit of 30 requests per 1 hour.
      source_url: https://developers.eco-movement.com/v2.2.1/reference/get-specific-location-pcpr-api
      checked: 2026-10-26
    - publisher: Eco-Movement
      requests: 30
      per_seconds: 3600
      endpoint: tariffs
      quote: The `tariffs` endpoint has a rate limit of 30 requests per 1 hour.
      source_url: https://developers.eco-movement.com/reference/get-tariffs-pcpr-api
      checked: 2026-10-26
    - publisher: Eco-Movement
      requests: 1
      per_seconds: 30
      endpoint: statuses
      quote: The `statuses` endpoint has a rate limit of 1 request per 30 seconds.
      source_url: https://developers.eco-movement.com/reference/get-statuses-pcpr-api
      checked: 2026-10-26
  limits_checked: 2026-10-26
  notes: >-
    One gap of 125 seconds (the 120 seconds the strictest limit needs, plus a safety
    margin) is kept between any two requests to open-chargepoints.com, shared by every
    operator served from it, so this project sends it at most 29 requests in any hour.
    Requests are sent one at a time; Eco-Movement "strongly recommends limiting
    simultaneous GET requests to a maximum of 5". It recommends retrieving the entire
    dataset once a day.
supports_single_location: unknown
cors: unknown
attribution: null
licence: null
engagement:
  status: key_on_request
  evidence:
    - date: 2026-10-10
      url: https://blinkcharging.com/en-gb/getintouch/blink-open-data-request
      note: >-
        Blink Charging's open data request page links a request form and says requests are
        shared with Eco-Movement and that the data is provided in API format. It states no
        licence, terms or rate limit for the data.
    - date: 2026-10-10
      url: https://docs.google.com/forms/d/e/1FAIpQLSfCr1YljoUjIv8fTRahl9Ewhi3h3mpVEGvBZ7VryT34wTccsw/viewform
      note: >-
        The linked form, titled "PCPR Data Request - Blink Charging", asks for an email
        address, name, organisation and planned use of the data, and says an answer is
        given within 5 working days.
    - date: 2026-10-26
      file: evidence/blink_charging_uk/2026-10-26-token-email.md
      note: >-
        Eco-Movement's email with an expiring link to this network's token for its PCPR
        API, sent as an "Authorization: Token" header to its OCPI 2.2.1 endpoints. The
        token itself is not kept here.
  log:
    - date: 2026-10-10
      action: page_checked
      summary: >-
        Blink Charging's open data request page and its linked request form were read; the
        page says requests are shared with Eco-Movement.
      quote: >-
        The Blink Data team will review your request and provide the data in api format and
        a stipulated timeframe..
      evidence_url: https://blinkcharging.com/en-gb/getintouch/blink-open-data-request
    - date: 2026-10-23
      action: request_sent
      channel: web_form
      summary: >-
        Requested access to Blink Charging's PCPR data through its Google form, which is shared with Eco-Movement.
    - date: 2026-10-26
      action: key_granted
      channel: email
      summary: >-
        Eco-Movement sent a token for this network's PCPR data by email, through an
        expiring link, to be sent as an "Authorization: Token" header to its OCPI
        2.2.1 endpoints. The token is kept as a GitHub Actions secret.
      evidence_file: evidence/blink_charging_uk/2026-10-26-token-email.md
access_requested: 2026-10-23
access_granted: 2026-10-26
sources:
  - url: https://blinkcharging.com/en-gb/getintouch/blink-open-data-request
    note: >-
      Blink Charging's UK open data request page, read 2026-10-10. Says "Your request will
      be shared with Eco-Movement, and in submitting the request you are consenting to the
      processing of their data."
  - url: https://docs.google.com/forms/d/e/1FAIpQLSfCr1YljoUjIv8fTRahl9Ewhi3h3mpVEGvBZ7VryT34wTccsw/viewform
    note: >-
      Blink Charging's PCPR data request form, linked from its open data request page,
      read 2026-10-10 without submitting it. It says "Request data on the location,
      status, and properties of Blink Charging's stations in the United Kingdom, in
      accordance with the UK Public Charge Point Regulations."
findings: []
notes: >-
  Blink Charging's page says requests are shared with Eco-Movement, so the
  eco_movement_pcpr adapter may apply once access is given; this needs testing. Access
  could be requested through the form linked from its open data request page. EB
  Charging's former website redirected to Blink Charging's site when checked on
  2026-10-10.
  On 2026-10-26 Eco-Movement sent a token for this network's data on its PCPR API, so it
  uses the eco_movement_pcpr adapter. What the token returns needs testing with one
  recorded fetch before the network is switched on.
enabled: false
