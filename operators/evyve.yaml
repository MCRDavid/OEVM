engagement:
  status: key_on_request
  evidence:
    - date: 2026-10-10
      url: https://evyve.co.uk/
      note: >-
        The "PCPR - Open Data Request" answer in the FAQs on evyve's home page links a Google
        form and sends questions to Eco-Movement's PCPR support address. The page says the
        data will be provided "in 48 hours"; the form says an answer will come "within 5
        working days". Neither the FAQ answer nor the form names a licence, terms, agreement,
        key or rate limit.
  log:
    - date: 2026-10-10
      action: page_checked
      summary: >-
        The "PCPR - Open Data Request" FAQ on evyve's home page and the Google form it links
        were read; the form asks for an email address, name, organisation and planned use of
        the data, and says the request will be shared with Eco-Movement.
      quote: >-
        If you are interested in accessing our Open Data please complete the form from the
        link below:
      evidence_url: https://evyve.co.uk/
    - date: 2026-10-17
      action: page_checked
      summary: >-
        The "PCPR - Open Data Request" FAQ on evyve's home page still links the same Google
        form. evyve's own news post of 19 January 2026 says its network now runs on Monta's
        charge point management software; no open data link was found on Monta's pages for
        evyve, so the form remains the route.
      quote: >-
        evyve, an electric vehicle charging network owner and operator, has selected EV
        charging platform Monta to deploy its intelligent end-to-end charging management
        system across evyve's network of 350 rapid and ultra-rapid charge points across the
        UK.
      evidence_url: https://evyve.co.uk/news/evyve-selects-monta-to-power-reliable-growth-across-the-uk-s-ev-charging-network/
access_requested: null
access_granted: null
sources:
  - url: https://evyve.co.uk/
    note: >-
      evyve's home page, whose FAQs include "PCPR - Open Data Request" (read 2026-10-10). It
      says "Our team will review your request and provide the data in a suitable format in
      48 hours."
  - url: https://forms.gle/tJCAi6pm4rZt513t8
    note: >-
      The "PCPR Data Request - evyve" Google form linked from that FAQ (read 2026-10-10, not
      submitted). Its disclaimer says the request will be shared with Eco-Movement.
  - url: https://evyve.co.uk/news/evyve-selects-monta-to-power-reliable-growth-across-the-uk-s-ev-charging-network/
    note: >-
      evyve's news post "evyve Selects Monta to Power Reliable Growth Across the UK's EV
      Charging Network", dated 19 January 2026 (read 2026-10-17). Monta provides its back
      end operations, payment and roaming. No open data link.
  - url: https://monta.com/en/help-center/export-open-data-charge-points/
    note: >-
      Monta's help article on exporting open data (read 2026-10-17): a network exports a file
      for its whole operator from Monta Hub and publishes it itself. It names no file format,
      address or API.
findings: []
notes: >-
  Access could be requested through the Google form linked from the open data FAQ on
  evyve's home page. Requests are passed to Eco-Movement, so the eco_movement_pcpr adapter
  may apply once access is given, but the page does not say how the data is delivered;
  this needs testing. Since January 2026 the network runs on Monta, whose operators export
  their own open data file from Monta Hub; on 2026-10-17 the form was still the only route
  found.
enabled: false
