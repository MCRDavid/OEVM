# yaml-language-server: $schema=schema.json
id: evyve
display_name: evyve
ocpi_country_code: unknown
ocpi_party_id: unknown
adapter: eco_movement_pcpr
base_url: unknown
endpoints:
  locations:
    url: https://open-chargepoints.com/api/ocpi/cpo/2.2.1/locations/
    status: documented
    note: >-
      Confirmed in Eco-Movement's PCPR API reference on 2026-10-07. Written with the trailing
      slash, as in the user guide's example request and the getting started page's paging
      link (read 2026-10-26); without it the server answered HTTP 307 on 2026-10-29.
  tariffs:
    url: https://open-chargepoints.com/api/ocpi/cpo/2.2.1/tariffs/
    status: documented
  statuses:
    url: https://open-chargepoints.com/api/statuses
    status: documented
auth:
  method: header
  name: Authorization
  scheme: Token
  secret_name: EVYVE_TOKEN
rate_limit:
  min_seconds_between_requests: 125
  limits:
    - publisher: Eco-Movement
      requests: 30
      per_seconds: 3600
      endpoint: locations
      quote: The `locations` endpoint has a rate limit of 30 requests per 1 hour.
      source_url: https://developers.eco-movement.com/v2.2.1/reference/get-all-locations-pcpr-api
      checked: 2026-10-26
    - publisher: Eco-Movement
      requests: 30
      per_seconds: 3600
      endpoint: locations
      scope: single location
      quote: The `locations/{id}` endpoint has a rate limit of 30 requests per 1 hour.
      source_url: https://developers.eco-movement.com/v2.2.1/reference/get-specific-location-pcpr-api
      checked: 2026-10-26
    - publisher: Eco-Movement
      requests: 30
      per_seconds: 3600
      endpoint: tariffs
      quote: The `tariffs` endpoint has a rate limit of 30 requests per 1 hour.
      source_url: https://developers.eco-movement.com/reference/get-tariffs-pcpr-api
      checked: 2026-10-26
    - publisher: Eco-Movement
      requests: 1
      per_seconds: 30
      endpoint: statuses
      quote: The `statuses` endpoint has a rate limit of 1 request per 30 seconds.
      source_url: https://developers.eco-movement.com/reference/get-statuses-pcpr-api
      checked: 2026-10-26
  limits_checked: 2026-10-26
  notes: >-
    One gap of 125 seconds (the 120 seconds the strictest limit needs, plus a safety
    margin) is kept between any two requests to open-chargepoints.com, shared by every
    operator served from it, so this project sends it at most 29 requests in any hour.
    Requests are sent one at a time; Eco-Movement "strongly recommends limiting
    simultaneous GET requests to a maximum of 5". It recommends retrieving the entire
    dataset once a day.
supports_single_location: unknown
cors: unknown
attribution: >-
  Contains data from evyve published under the Public Charge Point Regulations 2023, used in
  line with the Open Government Licence v3.0.
licence:
  name: OGL-3.0
  url: https://www.nationalarchives.gov.uk/doc/open-government-licence/version/3/
  basis: >-
    The open data answer in evyve's FAQs and the Google form it links (read 2026-10-10) name
    no licence, terms, agreement, key or rate limit. Eco-Movement's email of 2026-10-26 with
    the token, and its PCPR API user guide and reference (read 2026-10-26), state no licence
    or terms either. Regulation 10(5) of the Public Charge Point Regulations 2023 requires
    the data to be available "without any requirement to agree to terms and conditions
    regarding the use of that data", and the DfT guidance says "Data must be open in line
    with the Open Government Licence". On 2026-10-10 the repository owner decided, as a
    standing rule for operators whose data has no terms of its own, that such operators can
    be switched on without asking again.
  checked: 2026-10-29
engagement:
  status: key_on_request
  evidence:
    - date: 2026-10-10
      url: https://evyve.co.uk/
      note: >-
        The "PCPR - Open Data Request" answer in the FAQs on evyve's home page links a Google
        form and sends questions to Eco-Movement's PCPR support address. The page says the
        data will be provided "in 48 hours"; the form says an answer will come "within 5
        working days". Neither the FAQ answer nor the form names a licence, terms, agreement,
        key or rate limit.
    - date: 2026-10-26
      file: evidence/evyve/2026-10-26-token-email.md
      note: >-
        Eco-Movement's email with an expiring link to this network's token for its PCPR
        API, sent as an "Authorization: Token" header to its OCPI 2.2.1 endpoints. The
        token itself is not kept here.
  log:
    - date: 2026-10-10
      action: page_checked
      summary: >-
        The "PCPR - Open Data Request" FAQ on evyve's home page and the Google form it links
        were read; the form asks for an email address, name, organisation and planned use of
        the data, and says the request will be shared with Eco-Movement.
      quote: >-
        If you are interested in accessing our Open Data please complete the form from the
        link below:
      evidence_url: https://evyve.co.uk/
    - date: 2026-10-17
      action: page_checked
      summary: >-
        The "PCPR - Open Data Request" FAQ on evyve's home page still links the same Google
        form. evyve's own news post of 19 January 2026 says its network now runs on Monta's
        charge point management software; no open data link was found on Monta's pages for
        evyve, so the form remains the route.
      quote: >-
        evyve, an electric vehicle charging network owner and operator, has selected EV
        charging platform Monta to deploy its intelligent end-to-end charging management
        system across evyve's network of 350 rapid and ultra-rapid charge points across the
        UK.
      evidence_url: https://evyve.co.uk/news/evyve-selects-monta-to-power-reliable-growth-across-the-uk-s-ev-charging-network/
    - date: 2026-10-23
      action: request_sent
      channel: web_form
      summary: >-
        Requested access to evyve's PCPR data through its Google form, which is shared with Eco-Movement.
    - date: 2026-10-26
      action: key_granted
      channel: email
      summary: >-
        Eco-Movement sent a token for this network's PCPR data by email, through an
        expiring link, to be sent as an "Authorization: Token" header to its OCPI
        2.2.1 endpoints. The token is kept as a GitHub Actions secret.
      evidence_file: evidence/evyve/2026-10-26-token-email.md
access_requested: 2026-10-23
access_granted: 2026-10-26
sources:
  - url: https://evyve.co.uk/
    note: >-
      evyve's home page, whose FAQs include "PCPR - Open Data Request" (read 2026-10-10). It
      says "Our team will review your request and provide the data in a suitable format in
      48 hours."
  - url: https://forms.gle/tJCAi6pm4rZt513t8
    note: >-
      The "PCPR Data Request - evyve" Google form linked from that FAQ (read 2026-10-10, not
      submitted). Its disclaimer says the request will be shared with Eco-Movement.
  - url: https://evyve.co.uk/news/evyve-selects-monta-to-power-reliable-growth-across-the-uk-s-ev-charging-network/
    note: >-
      evyve's news post "evyve Selects Monta to Power Reliable Growth Across the UK's EV
      Charging Network", dated 19 January 2026 (read 2026-10-17). Monta provides its back
      end operations, payment and roaming. No open data link.
  - url: https://monta.com/help/monta-hub-reporting-compliance-data-exports-third-party-publishing/export-open-data-charge-points
    note: >-
      Monta's help article on exporting open data (read 2026-10-17): a network exports a file
      for its whole operator from Monta Hub and publishes it itself. It names no file format,
      address or API.
findings: []
notes: >-
  Access could be requested through the Google form linked from the open data FAQ on
  evyve's home page. Requests are passed to Eco-Movement, so the eco_movement_pcpr adapter
  may apply once access is given, but the page does not say how the data is delivered;
  this needs testing. Since January 2026 the network runs on Monta, whose operators export
  their own open data file from Monta Hub; on 2026-10-17 the form was still the only route
  found.
  On 2026-10-26 Eco-Movement sent a token for this network's data on its PCPR API, so it
  uses the eco_movement_pcpr adapter. What the token returns needs testing with one
  recorded fetch before the network is switched on.
enabled: false
