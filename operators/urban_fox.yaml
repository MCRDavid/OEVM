# yaml-language-server: $schema=schema.json
id: urban_fox
display_name: Urban Fox
ocpi_country_code: GB
ocpi_party_id: UFX # Confirmed from the feed's own country_code and party_id on 2026-10-23.
adapter: ocpi_221
base_url: unknown
endpoints:
  locations:
    url: https://api.urbanfox.network/api/opendata/locations
    status: documented
    note: >-
      Listed in Urban Fox's OCPI Open Data API description, linked as "View API
      documentation" from its data access page (read 2026-10-23). Pages of 50 by default,
      at most 100, with offset and limit, X-Total-Count and a Link header.
  tariffs:
    url: https://api.urbanfox.network/api/opendata/tariffs
    status: documented
    note: Listed in the same API description (read 2026-10-23).
auth:
  method: none
  name: null
  secret_name: null
rate_limit:
  min_seconds_between_requests: 2
  limits: []
  limits_checked: 2026-10-23
  notes: >-
    Urban Fox's data access page and API description state no rate limit, and responses
    carry no rate limit headers. The 2 second gap is this project's own choice. A full run
    makes about four requests (138 locations in pages of 50, and one page of 22 tariffs on
    2026-10-23).
supports_single_location: needs_testing
cors: needs_testing
attribution: >-
  Contains data from Urban Fox published under the Public Charge Point Regulations 2023,
  used in line with the Open Government Licence v3.0.
licence:
  name: OGL-3.0
  url: https://www.nationalarchives.gov.uk/doc/open-government-licence/version/3/
  basis: >-
    Urban Fox's data access page says it "complies with the Public Charge Point Regulations
    2023 by making the necessary open data available via OCPI. Our open data API is
    publicly available below", and that the API gives "real-time chargepoint locations,
    availability, and tariff information without needing to request access". Neither the
    page nor the API description states a licence or terms for the data. The site's only
    terms are its "Terms and Conditions for charging services" (dated 21 March 2025),
    which cover charging and use of its app and website, not the open data (read
    2026-10-23). Regulation 10(5) of the Public Charge Point Regulations 2023 requires the
    data to be available without terms on its use, and DfT's guidance says "Data must be
    open in line with the Open Government Licence". On 2026-10-10 the repository owner
    decided, as a standing rule for operators whose data has no terms of its own, to read
    general website or charging terms as not covering the open data, and on 2026-10-23
    asked for the new feeds whose terms allow use to be switched on.
  checked: 2026-10-23
own_feed_over_copies:
  decided: 2026-10-23
  basis: >-
    Monta's open data feed also carries Urban Fox locations under Urban Fox's own party, GB
    UFX, with different location ids: 95 of them were on the map on 23 October 2026, and
    39 of the first 50 locations in Urban Fox's own feed are within about 30 metres of one
    of them. The repository owner decided that Urban Fox's own feed is shown in their
    place, and that Monta's GB UFX locations are left off while Urban Fox's own locations,
    from the latest run or its last good copy, are on the map.
  evidence_url: https://api.urbanfox.network/api/opendata/locations
  operators:
    - monta
zero_price_tariffs:
  decided: 2026-10-23
  basis: >-
    8 of the 22 tariffs give an energy price of 0.0 and no other price, and they cover 127
    of the 138 locations (mostly in Newport and Plymouth) on 2026-10-23; the other
    tariffs charge 30p to 50p per kWh. Urban Fox's own website, read in a browser on
    2026-10-23, gives prices for these places that the feed does not: "30 - 40p/kWh" on
    each of its 24 Newport street pages (for example
    https://urbanfox.network/networks/newport-city-council/alexandra-road/) and "43 -
    50p/kWh" for Plymouth, without saying what decides the rate within a range. Newport
    City Council's newspaper, Newport Matters for July 2026 (page 6,
    https://www.newport.gov.uk/sites/default/files/media/media-documents/Newport-Matters-July-2026.pdf),
    says "Our charging network offers competitive overnight rates, starting from 39p per
    kWh". These prices are noted here only and are not used as data. Monta's copies of
    these sites showed "Price unknown". On 2026-10-23 the repository owner decided these tariffs show "Price
    unknown" rather than "Free".
  evidence_url: https://api.urbanfox.network/api/opendata/tariffs
  tariff_ids:
    - 0ae8884b-6a09-4e85-be2f-be25d078fe76
    - 11a3a07a-7203-4b3c-8012-09fbae3d6df9
    - 26ce229c-f5e0-4ac1-9cdf-275b8a95961e
    - 381fff54-3687-4aa3-b328-bfcdd76ced11
    - 417d44eb-f56a-469d-a556-168acdce5a51
    - 4c7f1ebc-142b-4bd9-a206-06851db03e0f
    - 7346e3f9-4af4-45de-91ca-e9b0bec04ac0
    - 74aa4c53-3e50-44d1-9a3b-eb3c796f72aa
engagement:
  status: open_anonymous
  evidence:
    - date: 2026-10-23
      url: https://urbanfox.network/public-charge-point-regulations-data-access/
      note: >-
        Says the OCPI open data API is publicly available without requesting access, links
        its documentation, and offers a form for other data requests.
  log:
    - date: 2026-10-23
      action: page_checked
      summary: >-
        Urban Fox's data access page, API description and terms were read; the API needs no
        key and the terms cover charging only.
      evidence_url: https://urbanfox.network/public-charge-point-regulations-data-access/
access_requested: null
access_granted: null
sources:
  - url: https://urbanfox.network/public-charge-point-regulations-data-access/
    note: >-
      Urban Fox's data access page, read on 2026-10-23. Links the API documentation at
      https://api.urbanfox.network/api-docs/index.html. Answers automated requests normally.
  - url: https://api.urbanfox.network/api-docs/opendata/v1/api.yaml
    note: >-
      "Urban Fox OCPI Open Data API" description (OpenAPI), read on 2026-10-23: four GET
      endpoints for locations and tariffs, with no security scheme.
  - url: https://urbanfox.network/terms/
    note: >-
      Terms and Conditions for charging services, read on 2026-10-23. They do not mention
      the open data.
  - url: https://www.evroam.org.uk/id-register
    note: >-
      EV Roam's ID register lists Urban Fox Networks (UK) Ltd with operator ID GB*UFX (read
      2026-10-23).
findings:
  - date: 2026-10-23
    kind: data_quality
    summary: >-
      Every tariff price component states VAT 0 (22 tariffs on 2026-10-23), so the feed
      says no VAT applies. Public charging in the UK normally carries VAT at 20%; whether
      the prices already include it is not stated.
    handling: >-
      Shown as published, with the VAT the feed states, so the prices read as the full
      price. Not checked against Urban Fox's app.
    evidence_url: https://api.urbanfox.network/api/opendata/tariffs
  - date: 2026-10-23
    kind: data_quality
    summary: >-
      8 of the 22 tariffs give an energy price of 0.0 and no other price, and 127 of the
      138 locations (116 with the city Newport, 1 with Gwent, 9 in Plymouth and 1 in Brighton) name
      only these tariffs. The same 8 tariff ids were sent again about four hours later. As
      published, these sites would read as free to use, while Urban Fox's own website gives
      30 to 40p per kWh for Newport and 43 to 50p per kWh for Plymouth (read 2026-10-23).
    handling: >-
      Shown as "Price unknown" rather than "Free", by the repository owner's decision of
      2026-10-23 (zero_price_tariffs above), matched by exact tariff id while their prices
      stay zero. The tariffs are published unchanged.
    evidence_url: https://api.urbanfox.network/api/opendata/tariffs
  - date: 2026-10-23
    kind: data_quality
    summary: >-
      Monta's open data feed also carries Urban Fox locations under the party GB UFX, with
      different location ids (95 of them were on the map on 2026-10-23). Of the first 50
      locations in Urban Fox's own feed, 39 are within about 30 metres of one of those.
    handling: >-
      Urban Fox's own feed is shown, and Monta's GB UFX locations are left off while it is
      on the map, by the repository owner's decision of 2026-10-23 (own_feed_over_copies
      above). The feed health page lists how many were left off.
    evidence_url: https://api.urbanfox.network/api/opendata/locations
notes: >-
  Found through EV Roam's ID register on 2026-10-23. Urban Fox's feed is standard OCPI 2.2.1
  with offset paging, read by the ocpi_221 adapter.
enabled: true
