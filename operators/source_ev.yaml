# yaml-language-server: $schema=schema.json
id: source_ev
display_name: Source EV
ocpi_country_code: unknown
ocpi_party_id: unknown
adapter: eco_movement_pcpr
base_url: unknown
endpoints:
  locations:
    url: https://open-chargepoints.com/api/ocpi/cpo/2.2.1/locations
    status: documented
    note: Confirmed in Eco-Movement's PCPR API reference on 2026-10-07.
  tariffs:
    url: https://open-chargepoints.com/api/ocpi/cpo/2.2.1/tariffs
    status: documented
  statuses:
    url: https://open-chargepoints.com/api/statuses
    status: documented
auth:
  method: header
  name: Authorization
  scheme: Token
  secret_name: SOURCE_EV_TOKEN
rate_limit:
  min_seconds_between_requests: 125
  limits:
    - publisher: Eco-Movement
      requests: 30
      per_seconds: 3600
      endpoint: locations
      quote: The `locations` endpoint has a rate limit of 30 requests per 1 hour.
      source_url: https://developers.eco-movement.com/v2.2.1/reference/get-all-locations-pcpr-api
      checked: 2026-10-26
    - publisher: Eco-Movement
      requests: 30
      per_seconds: 3600
      endpoint: locations
      scope: single location
      quote: The `locations/{id}` endpoint has a rate limit of 30 requests per 1 hour.
      source_url: https://developers.eco-movement.com/v2.2.1/reference/get-specific-location-pcpr-api
      checked: 2026-10-26
    - publisher: Eco-Movement
      requests: 30
      per_seconds: 3600
      endpoint: tariffs
      quote: The `tariffs` endpoint has a rate limit of 30 requests per 1 hour.
      source_url: https://developers.eco-movement.com/reference/get-tariffs-pcpr-api
      checked: 2026-10-26
    - publisher: Eco-Movement
      requests: 1
      per_seconds: 30
      endpoint: statuses
      quote: The `statuses` endpoint has a rate limit of 1 request per 30 seconds.
      source_url: https://developers.eco-movement.com/reference/get-statuses-pcpr-api
      checked: 2026-10-26
  limits_checked: 2026-10-26
  notes: >-
    One gap of 125 seconds (the 120 seconds the strictest limit needs, plus a safety
    margin) is kept between any two requests to open-chargepoints.com, shared by every
    operator served from it, so this project sends it at most 29 requests in any hour.
    Requests are sent one at a time; Eco-Movement "strongly recommends limiting
    simultaneous GET requests to a maximum of 5". It recommends retrieving the entire
    dataset once a day.
supports_single_location: unknown
cors: unknown
attribution: null
licence: null
engagement:
  status: key_on_request
  evidence:
    - date: 2026-10-10
      url: https://source-ev.com/legal/request-compliance-data
      note: >-
        Source EV's Request Compliance Data page links a Google request form, says the
        request will be shared with Eco-Movement, asks requesters to "Sign the agreement as
        required under the PCPR" and states that the data "is licensed on terms equivalent
        to the UK Open Government Licence". It names no key or rate limit.
    - date: 2026-10-26
      file: evidence/source_ev/2026-10-26-token-email.md
      note: >-
        Eco-Movement's email with an expiring link to this network's token for its PCPR
        API, sent as an "Authorization: Token" header to its OCPI 2.2.1 endpoints. The
        token itself is not kept here.
  log:
    - date: 2026-10-10
      action: page_checked
      summary: >-
        Source EV's Request Compliance Data page and the Google form it links were read;
        the page lists signing an agreement among the steps before a request, and its terms
        and conditions state a licence for the data.
      quote: >-
        PCPR open data provided by Source EV is licensed on terms equivalent to the UK Open
        Government Licence. You are free to copy, publish and distribute the data provided
        you attribute Source EV Ltd as the data provider and do not misrepresent the data or
        imply endorsement.
      evidence_url: https://source-ev.com/legal/request-compliance-data
    - date: 2026-10-24
      action: request_sent
      channel: web_form
      summary: >-
        Requested access to Source EV's PCPR data through the Google form linked from its
        Request Compliance Data page, which is shared with Eco-Movement, and asked for a
        copy of the agreement the page mentions.
      evidence_url: https://source-ev.com/legal/request-compliance-data
    - date: 2026-10-26
      action: key_granted
      channel: email
      summary: >-
        Eco-Movement sent a token for this network's PCPR data by email, through an
        expiring link, to be sent as an "Authorization: Token" header to its OCPI
        2.2.1 endpoints. The token is kept as a GitHub Actions secret.
      evidence_file: evidence/source_ev/2026-10-26-token-email.md
access_requested: 2026-10-24
access_granted: 2026-10-26
sources:
  - url: https://source-ev.com/legal/request-compliance-data
    note: >-
      Source EV's Request Compliance Data page (read 2026-10-10). It says "Requests are
      typically processed within five working days" and "Your request will be shared with
      Eco-Movement for the purpose of providing the data you have requested."
  - url: https://docs.google.com/forms/d/e/1FAIpQLScHf0fgoLk_IWNoE7SODMZeqKFSFGorI41OUCChPawnA-jF9Q/viewform
    note: >-
      The "PCPR Data Request - Source EV" Google form linked from that page (read
      2026-10-10, not submitted). It asks for an email address, name, organisation and
      planned use of the data, and its disclaimer says the request will be shared with
      Eco-Movement.
findings:
  - date: 2026-10-10
    kind: documentation
    summary: >-
      Source EV's Request Compliance Data page asks requesters to "Sign the agreement as
      required under the PCPR" and shows terms and conditions that a requester agrees to by
      submitting, but does not say whether those terms are the agreement, and no separate
      agreement or way to sign one was shown or linked on the page or in the linked request
      form when both were read.
    handling: >-
      Which agreement is meant will be confirmed and the agreement read before any request
      is sent, and the operator stays switched off until then.
    evidence_url: https://source-ev.com/legal/request-compliance-data
    status: open
notes: >-
  The owner could ask Source EV which agreement it means (the terms and conditions on its
  Request Compliance Data page or a separate document) and read it, then request access
  through the form linked from that page. Requests are passed to Eco-Movement, so the
  eco_movement_pcpr adapter may apply once access is given; this needs testing.
  On 2026-10-26 Eco-Movement sent a token for this network's data on its PCPR API, so it
  uses the eco_movement_pcpr adapter. What the token returns needs testing with one
  recorded fetch before the network is switched on.
enabled: false
