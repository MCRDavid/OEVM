# yaml-language-server: $schema=schema.json
id: source_ev
display_name: Source EV
ocpi_country_code: GB
ocpi_party_id: SGB # Confirmed from the feed's own country_code and party_id on 2026-10-29.
adapter: eco_movement_pcpr
base_url: unknown
endpoints:
  locations:
    url: https://open-chargepoints.com/api/ocpi/cpo/2.2.1/locations/
    status: documented
    note: >-
      Confirmed in Eco-Movement's PCPR API reference on 2026-10-07. Written with the trailing
      slash, as in the user guide's example request and the getting started page's paging
      link (read 2026-10-26); without it the server answered HTTP 307 on 2026-10-29.
  tariffs:
    url: https://open-chargepoints.com/api/ocpi/cpo/2.2.1/tariffs/
    status: documented
  statuses:
    url: https://open-chargepoints.com/api/statuses
    status: documented
auth:
  method: header
  name: Authorization
  scheme: Token
  secret_name: SOURCE_EV_TOKEN
rate_limit:
  min_seconds_between_requests: 125
  limits:
    - publisher: Eco-Movement
      requests: 30
      per_seconds: 3600
      endpoint: locations
      quote: The `locations` endpoint has a rate limit of 30 requests per 1 hour.
      source_url: https://developers.eco-movement.com/v2.2.1/reference/get-all-locations-pcpr-api
      checked: 2026-10-26
    - publisher: Eco-Movement
      requests: 30
      per_seconds: 3600
      endpoint: locations
      scope: single location
      quote: The `locations/{id}` endpoint has a rate limit of 30 requests per 1 hour.
      source_url: https://developers.eco-movement.com/v2.2.1/reference/get-specific-location-pcpr-api
      checked: 2026-10-26
    - publisher: Eco-Movement
      requests: 30
      per_seconds: 3600
      endpoint: tariffs
      quote: The `tariffs` endpoint has a rate limit of 30 requests per 1 hour.
      source_url: https://developers.eco-movement.com/reference/get-tariffs-pcpr-api
      checked: 2026-10-26
    - publisher: Eco-Movement
      requests: 1
      per_seconds: 30
      endpoint: statuses
      quote: The `statuses` endpoint has a rate limit of 1 request per 30 seconds.
      source_url: https://developers.eco-movement.com/reference/get-statuses-pcpr-api
      checked: 2026-10-26
  limits_checked: 2026-10-26
  notes: >-
    By the repository owner's decisions of 2026-10-29 the limits are read as applying to
    each network's own token (limits_per_key) and as an allowance rather than a spacing
    (limits_as_allowance). With this network's token, no period of an hour and a second
    holds more than 29 requests to an endpoint limited to 30 an hour, and each request
    starts at least 2 seconds after the last one finished. At most 5 requests are sent to
    open-chargepoints.com at the same time, whichever network they are for, started at
    least 1 second apart. Any retry, wait the server asks for or refusal puts every
    network back to a gap of 125 seconds (the 120 seconds the strictest limit needs, plus
    a safety margin) and one request at a time for the rest of the run. Eco-Movement
    "strongly recommends limiting simultaneous GET requests to a maximum of 5". It
    recommends retrieving the entire dataset once a day.
limits_per_key:
  decided: 2026-10-29
  basis: >-
    Eco-Movement publishes a limit of 30 requests an hour for each of the locations and
    tariffs endpoints and gives each network its own token, but does not say whether the
    limits count per token or per address. The repository owner decided on 2026-10-29
    that they are read as applying to each token, so each network keeps its own 125
    second gap, while requests to open-chargepoints.com are still sent one at a time.
  evidence_url: https://developers.eco-movement.com/v2.2.1/docs/eco-movement-pcpr-api-user-guide
limits_as_allowance:
  decided: 2026-10-29
  basis: >-
    Eco-Movement publishes its limits as a number of requests an hour (30 for each of the
    locations and tariffs endpoints) and does not say they must be spread evenly. The
    repository owner decided on 2026-10-29 that each network's token may use that
    allowance close together once a day, as the whole dataset fits within it (the largest
    network, ubitricity, took 14 requests on 2026-10-29), keeping one request in hand as
    the margin.
  at_once: 5
  at_once_source: >-
    Eco-Movement's PCPR API user guide "strongly recommends limiting simultaneous GET
    requests to a maximum of 5". It does not say whether that counts per token or in
    total; the owner chose 5 in total, which keeps within either reading.
  evidence_url: https://developers.eco-movement.com/v2.2.1/docs/eco-movement-pcpr-api-user-guide
supports_single_location: unknown
cors: unknown
attribution: >-
  Contains data from Source EV Ltd, the data provider, published under the Public Charge
  Point Regulations 2023, used in line with the Open Government Licence v3.0.
licence:
  name: OGL-3.0
  url: https://www.nationalarchives.gov.uk/doc/open-government-licence/version/3/
  basis: >-
    Source EV's Request Compliance Data page (read 2026-10-10) says "PCPR open data provided
    by Source EV is licensed on terms equivalent to the UK Open Government Licence. You are
    free to copy, publish and distribute the data provided you attribute Source EV Ltd as
    the data provider and do not misrepresent the data or imply endorsement." The page also
    asks requesters to "Sign the agreement as required under the PCPR". The request of
    2026-10-24 asked for a copy of that agreement; on 2026-10-26 Eco-Movement sent the token
    by email with no agreement to sign, and its PCPR API user guide and reference (read
    2026-10-26) state no terms. On 2026-10-26 the repository owner decided to use the data
    on the terms the page states, attributing Source EV Ltd as the data provider. Regulation
    10(5) of the Public Charge Point Regulations 2023 requires the data to be available
    "without any requirement to agree to terms and conditions regarding the use of that
    data".
  checked: 2026-10-29
engagement:
  status: key_on_request
  evidence:
    - date: 2026-10-10
      url: https://source-ev.com/legal/request-compliance-data
      note: >-
        Source EV's Request Compliance Data page links a Google request form, says the
        request will be shared with Eco-Movement, asks requesters to "Sign the agreement as
        required under the PCPR" and states that the data "is licensed on terms equivalent
        to the UK Open Government Licence". It names no key or rate limit.
    - date: 2026-10-26
      file: evidence/source_ev/2026-10-26-token-email.md
      note: >-
        Eco-Movement's email with an expiring link to this network's token for its PCPR
        API, sent as an "Authorization: Token" header to its OCPI 2.2.1 endpoints. The
        token itself is not kept here.
  log:
    - date: 2026-10-10
      action: page_checked
      summary: >-
        Source EV's Request Compliance Data page and the Google form it links were read;
        the page lists signing an agreement among the steps before a request, and its terms
        and conditions state a licence for the data.
      quote: >-
        PCPR open data provided by Source EV is licensed on terms equivalent to the UK Open
        Government Licence. You are free to copy, publish and distribute the data provided
        you attribute Source EV Ltd as the data provider and do not misrepresent the data or
        imply endorsement.
      evidence_url: https://source-ev.com/legal/request-compliance-data
    - date: 2026-10-24
      action: request_sent
      channel: web_form
      summary: >-
        Requested access to Source EV's PCPR data through the Google form linked from its
        Request Compliance Data page, which is shared with Eco-Movement, and asked for a
        copy of the agreement the page mentions.
      evidence_url: https://source-ev.com/legal/request-compliance-data
    - date: 2026-10-26
      action: key_granted
      channel: email
      summary: >-
        Eco-Movement sent a token for this network's PCPR data by email, through an
        expiring link, to be sent as an "Authorization: Token" header to its OCPI
        2.2.1 endpoints. The token is kept as a GitHub Actions secret.
      evidence_file: evidence/source_ev/2026-10-26-token-email.md
access_requested: 2026-10-24
access_granted: 2026-10-26
sources:
  - url: https://source-ev.com/legal/request-compliance-data
    note: >-
      Source EV's Request Compliance Data page (read 2026-10-10). It says "Requests are
      typically processed within five working days" and "Your request will be shared with
      Eco-Movement for the purpose of providing the data you have requested."
  - url: https://docs.google.com/forms/d/e/1FAIpQLScHf0fgoLk_IWNoE7SODMZeqKFSFGorI41OUCChPawnA-jF9Q/viewform
    note: >-
      The "PCPR Data Request - Source EV" Google form linked from that page (read
      2026-10-10, not submitted). It asks for an email address, name, organisation and
      planned use of the data, and its disclaimer says the request will be shared with
      Eco-Movement.
findings:
  - date: 2026-10-29
    kind: spec_conformance
    summary: >-
      One of the two tariffs gives VAT as 0.2 on its energy price of 0.45 pounds per
      kWh, while the other gives 20. OCPI 2.2.1 gives VAT as a percentage, so 0.2
      reads as 0.2%.
    handling: >-
      The tariff is shown as published, with 0.2% VAT added (45.1p per kWh). It
      probably means 20%, which needs confirming by Source EV.
    evidence_url: https://open-chargepoints.com/api/ocpi/cpo/2.2.1/tariffs/
  - date: 2026-10-10
    kind: documentation
    summary: >-
      Source EV's Request Compliance Data page asks requesters to "Sign the agreement as
      required under the PCPR" and shows terms and conditions that a requester agrees to by
      submitting, but does not say whether those terms are the agreement, and no separate
      agreement or way to sign one was shown or linked on the page or in the linked request
      form when both were read.
    handling: >-
      The request of 2026-10-24 asked for a copy of the agreement. Eco-Movement sent
      the token on 2026-10-26 with no agreement to sign, and on 2026-10-26 the
      repository owner decided to use the data on the terms the page states,
      attributing Source EV Ltd as the data provider.
    evidence_url: https://source-ev.com/legal/request-compliance-data
    status: resolved
    resolved_date: 2026-10-26
notes: >-
  Its regulation 10 data is served by Eco-Movement's PCPR API (eco_movement_pcpr adapter),
  with a token Eco-Movement sent on 2026-10-26, kept as the GitHub Actions secret
  SOURCE_EV_TOKEN. Every response on 2026-10-29 linked to a next page past the last
  record, which the adapter does not follow. Eco-Movement's user guide says it creates the
  location ids and may change them when it merges locations. On 2026-10-29 the feed
  reported 37 locations and 2 tariffs.
enabled: true
