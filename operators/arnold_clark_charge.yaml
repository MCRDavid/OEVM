# yaml-language-server: $schema=schema.json
id: arnold_clark_charge
display_name: Arnold Clark Charge
ocpi_country_code: unknown # The feed's records carry no country_code or party_id (2026-10-10).
ocpi_party_id: unknown
adapter: ocpi_221
base_url: unknown
endpoints:
  locations:
    url: https://api.fuuse.io/opendata/e6397b95-1624-49cd-824d-ab2f9dfe7294/location
    status: documented
    note: >-
      Linked as "Open Access Location Data" in the footer of Arnold Clark Charge's page
      (read 2026-10-10). Hosted by Fuuse, the network's back office provider.
  tariffs:
    url: https://api.fuuse.io/opendata/e6397b95-1624-49cd-824d-ab2f9dfe7294/tariff
    status: documented
    note: >-
      Linked as "Open Access Tariff Data" in the footer of Arnold Clark Charge's page
      (read 2026-10-10).
auth:
  method: none
  name: null
  secret_name: null
rate_limit:
  min_seconds_between_requests: 2
  limits: []
  limits_checked: 2026-10-10
  notes: >-
    Neither Arnold Clark's pages nor the responses state a rate limit. The 2 second gap is
    this project's own choice. Each response holds every record, so a full run makes two
    requests (about 0.3 MB on 2026-10-10).
supports_single_location: unknown
cors: needs_testing
attribution: >-
  Contains data from Arnold Clark Charge published under the Public Charge Point
  Regulations 2023, used in line with the Open Government Licence v3.0.
licence:
  name: OGL-3.0
  url: https://www.nationalarchives.gov.uk/doc/open-government-licence/version/3/
  basis: >-
    Arnold Clark Charge's page links the two files as "Open Access Location Data" and "Open
    Access Tariff Data" and states no licence, terms or rate limit for them. DfT's guidance
    (updated 21 October 2024) says "Data must be open in line with the Open Government
    Licence". Arnold Clark's website terms of use (read 2026-10-10) say its website,
    accounts portal and app "are copyright of Arnold Clark Automobiles Limited and its
    licensors. No part of these platforms may be reproduced in any form without the express
    permission of Arnold Clark Automobiles Limited". The files are served from Fuuse's host,
    not from those platforms. Whether those terms cover the open data, which regulation
    10(5) requires to be available without terms on its use, is for the repository owner
    to decide before this file is merged. The charging terms (last updated 1 December 2025)
    say nothing about the data.
  checked: 2026-10-10
engagement:
  status: open_anonymous
  evidence:
    - date: 2026-10-10
      url: https://www.arnoldclark.com/charge
      note: >-
        The footer links "Open Access Location Data" and "Open Access Tariff Data" and states
        no licence, terms or rate limit.
  log:
    - date: 2026-10-10
      action: page_checked
      summary: >-
        Read Arnold Clark Charge's page, whose footer links location and tariff files that
        need no key.
      evidence_url: https://www.arnoldclark.com/charge
access_requested: null
access_granted: null
sources:
  - url: https://www.arnoldclark.com/charge
    note: >-
      Arnold Clark Charge's page, read 2026-10-10. Its footer gives the two data links.
      States no licence, terms or rate limits.
  - url: https://www.arnoldclark.com/terms-of-use
    note: Arnold Clark's website, accounts portal and app terms of use, read 2026-10-10.
  - url: https://www.arnoldclark.com/charge/terms
    note: >-
      Arnold Clark Charge's charging terms, last updated 1 December 2025, read 2026-10-10.
      They do not mention the data.
findings:
  - date: 2026-10-10
    kind: spec_conformance
    summary: >-
      Locations and tariffs carry no country_code or party_id, which OCPI 2.2.1 requires.
    handling: >-
      Record ids use "unknown" for the country and party, from this file, until the
      operator's own data gives them.
    evidence_url: https://api.fuuse.io/opendata/e6397b95-1624-49cd-824d-ab2f9dfe7294/location
  - date: 2026-10-10
    kind: data_quality
    summary: >-
      2 of 429 connectors name a tariff in tariff_ids (on 2026-10-10). The other 427 name
      none.
    handling: Connectors with no tariff show "Price unknown".
    evidence_url: https://api.fuuse.io/opendata/e6397b95-1624-49cd-824d-ab2f9dfe7294/location
  - date: 2026-10-10
    kind: spec_conformance
    summary: >-
      Tariff prices and VAT rates are sent as strings (for example "0.4583" and "20.0000")
      rather than numbers.
    handling: Read as the numbers they spell. Values that are not numbers would be unknown.
    evidence_url: https://api.fuuse.io/opendata/e6397b95-1624-49cd-824d-ab2f9dfe7294/tariff
  - date: 2026-10-10
    kind: data_quality
    summary: >-
      Several sites appear twice, once with "(App Bookings)" added to the name, with
      different location ids and chargers.
    handling: Kept as published; each record is shown as its own location.
    evidence_url: https://api.fuuse.io/opendata/e6397b95-1624-49cd-824d-ab2f9dfe7294/location
notes: >-
  The files are standard OCPI 2.2.1 responses with X-Total-Count, read by the ocpi_221
  adapter. Fuuse runs the back office for many UK networks; others may publish files in
  the same form on its host, and any that are added here share its 2 second gap. Not yet
  fetched from a GitHub Actions runner; the first daily run will show whether the host
  answers requests from there.
enabled: true
