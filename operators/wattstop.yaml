  log:
    - date: 2026-10-17
      action: feed_searched
      summary: >-
        WattStop's home page, its page for charge point owners, its driver terms and its
        sitemap were read, and no open data feed or route for requesting open data was found.
      quote: >-
        WattStop is a UK-based virtual charge point operator (CPO) and your one-stop solution
        for maximising the potential of your EV chargers.
      evidence_url: https://www.wattstop.co.uk/charge-point-owners
